<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Trainingslog</title>
<style>
:root{
  /* Kampfanzug-Palette: tiefes Blau als Grund, Orange für Aktionen, Gold für Energie, Grün für Messwerte, Tinte für Konturen */
  --bg:#0d1440; --card:#172165; --card2:#24338f; --well:#0a1036; --line:#34449f;
  --text:#fff8e7; --muted:#a9b5ea;
  --accent:#ff8a1f; --accent-hi:#ffa94d; --accent-deep:#e8590c; --accent-ink:#2a1000; --accent-shade:#8a3200;
  --ki:#ffd43b; --scan:#6dff9e; --ink:#060a26; --danger:#ff6b6b;
  /* Schräge, schmale Titelschrift: auf dem iPhone Avenir Next Condensed, sonst der nächste passende Systemfont */
  --display:"Avenir Next Condensed","Bahnschrift","Arial Narrow","Impact",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.35;
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* Aura hinter allem: blaues Leuchten von oben mit feinen Tempolinien */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 55% at 50% -8%,rgba(78,112,255,.6),rgba(78,112,255,0) 70%),
    repeating-conic-gradient(from 0deg at 50% -18%,rgba(255,255,255,.04) 0deg 1.5deg,transparent 1.5deg 6deg);
  -webkit-mask-image:linear-gradient(#000,transparent 72%);mask-image:linear-gradient(#000,transparent 72%)}
main{padding:12px 16px calc(200px + env(safe-area-inset-bottom));   /* Platz für Tab-Leiste und Pausen-Timer, damit der letzte Knopf frei bleibt */max-width:560px;margin:0 auto}
h1,h2,.ex-name,.ttime,.num,.tpl .t,.tpl .go,.sheet-head b,.hero-text b,.lvl b,.stat b,.gain b,.levelup,button.primary{font-family:var(--display);font-stretch:condensed;font-style:italic;font-weight:900}
h1{width:fit-content;max-width:100%;font-size:44px;line-height:.98;margin:6px 0 16px;padding:.12em .14em 0 0; /* Platz für Umlautpunkte und schräge Buchstaben */text-transform:uppercase;letter-spacing:.01em;
  color:var(--ki);background:linear-gradient(180deg,#fff3a6 0%,var(--ki) 36%,var(--accent) 72%,var(--accent-deep) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 16px rgba(255,138,31,.35))}
h2{font-size:18px;color:var(--ki);margin:24px 0 8px;letter-spacing:.01em}
p{margin:0 0 10px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 0 var(--ink)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:14px}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;background:var(--card2);border:0;border-radius:12px;padding:12px 14px;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 var(--ink)}
button:disabled{opacity:.3}
button:focus-visible{outline:2px solid var(--ki);outline-offset:2px}
button.primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent) 45%,var(--accent-deep));color:var(--accent-ink);font-size:20px;letter-spacing:.02em;
  border:2px solid var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 0 var(--accent-shade);text-shadow:0 1px 0 rgba(255,255,255,.3)}
button.primary:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 var(--accent-shade)}
button.dangerbtn{background:linear-gradient(180deg,#ff8787,#f03e3e);color:#fff;font-weight:800;border:2px solid var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #7d1515}
button.dangerbtn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 #7d1515}
button.ghost{background:transparent;color:var(--muted);padding:8px 10px;min-height:44px;min-width:44px}   /* Mindestgröße für Tap-Flächen */
button.danger{color:var(--danger)}
button.accent{color:var(--accent);font-weight:800}
button.block{width:100%;display:block}
button.small{padding:8px 12px;font-size:14px;border-radius:10px;min-height:44px;min-width:44px}   /* Mindestgröße für Tap-Flächen */
button.ghost,button.li,button.tab{box-shadow:none}
.left{text-align:left}
input,select,textarea{font:inherit;font-size:17px;color:var(--text);background:var(--well);border:2px solid var(--line);border-radius:10px;padding:10px;width:100%;-webkit-appearance:none;appearance:none}
textarea{font-size:13px;font-family:ui-monospace,Menlo,monospace;min-height:160px;resize:vertical}
input:focus,select,textarea:focus{outline:none}
input:focus,textarea:focus{border-color:var(--ki);box-shadow:0 0 0 3px rgba(255,212,59,.22)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}

/* Start screen: sieben Sternkugeln, eine pro Training der letzten 7 Tage */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2233a0,var(--card) 62%);border:2px solid var(--ink);border-radius:16px;padding:16px 14px 13px;margin-bottom:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 var(--ink)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none; /* Rasterpunkte wie im Manga, nach links unten auslaufend */
  background:radial-gradient(circle,rgba(255,255,255,.16) 1.2px,transparent 1.7px) 0 0/9px 9px;
  -webkit-mask-image:radial-gradient(85% 130% at 100% 0,#000,transparent 62%);mask-image:radial-gradient(85% 130% at 100% 0,#000,transparent 62%)}
.hero.full{border-color:var(--ki);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 var(--ink),0 0 26px rgba(255,212,59,.55)}
.orbs{position:relative;z-index:1;display:flex;justify-content:space-between;gap:6px}
.orbs svg{flex:1;min-width:0;max-width:52px;height:auto;aspect-ratio:1}
.orbs svg.lit{filter:drop-shadow(0 0 6px rgba(255,160,40,.8))}
.hero-text{position:relative;z-index:1;flex-wrap:wrap;gap:2px 12px;margin-top:12px}
.hero-text b{font-size:24px;color:var(--ki);margin-right:2px}
button.hero{display:block;width:100%;text-align:left}
.lvl{position:relative;z-index:1;flex-wrap:wrap;gap:2px 12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.lvl b{font-size:21px;color:var(--ki);margin-right:2px}
.xp{position:relative;z-index:1;display:block;height:10px;margin:8px 3px 0;background:var(--well);border:1px solid var(--line);border-radius:3px;overflow:hidden;transform:skewX(-16deg)}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent) 40%,var(--ki))}
.hero-foot{position:relative;z-index:1;margin-top:9px;font-size:13px}

/* Fortschritt und Belohnung nach dem Training */
.lvl-box .lvl{border-top:0;margin-top:4px;padding-top:0}
.lvl-box .muted{display:block;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;color:var(--ki)}
.stat span{color:var(--muted);font-size:13px}
.badge{gap:12px}
.badge svg{flex:none;width:36px;height:36px}
.badge svg.lit{filter:drop-shadow(0 0 5px rgba(255,160,40,.7))}
.badge b,.badge .muted{display:block}
.badge.off b{color:var(--muted)}
.gain{text-align:center;margin:8px 0 2px}
.gain b{display:block;font-size:64px;line-height:1;color:var(--ki);filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 18px rgba(255,212,59,.5))}
.gain span{color:var(--muted)}
.levelup{text-align:center;color:var(--accent);font-size:20px;margin:10px 0 0}
.backup-due{margin-top:18px;padding:12px;border:2px solid #ffb341;border-radius:12px;background:rgba(255,179,65,.08)}
.backup-due p{font-size:14px}
.tpl{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;background:var(--card);
  padding:14px 16px 14px 24px;margin-bottom:12px;border:2px solid var(--ink);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 0 var(--ink)}
.tpl:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 var(--ink)}
.tpl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:linear-gradient(180deg,var(--accent-hi),var(--accent-deep))} /* Gürtel */
.tpl .t{font-size:25px;line-height:1.05;letter-spacing:.01em}
.tpl-foot{display:flex;align-items:center;gap:14px;margin-top:8px}
/* Überschrift je Programm auf dem Startbildschirm */
.tpl-group{margin:18px 2px 8px;font-size:14px;font-weight:700;color:var(--text);overflow-wrap:anywhere}
.tpl-group .muted{font-weight:400}
.tpl-slot{display:block;font-size:12px;margin-top:2px}
/* Programmzeile über dem Namen einer Dran-Karte; rechts bleibt Platz für das Dran-Schild */
.tpl-prog{font-size:13px;font-weight:700;color:var(--ki);padding-right:64px;overflow-wrap:anywhere}
.tpl-prog .nw{white-space:nowrap;font-weight:400}
/* Übrige Vorlagen auf dem Startbildschirm als einzeilige Knöpfe (Idee 51) */
.tpl-row{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;text-align:left;
  background:var(--card);padding:8px 14px 8px 22px;margin-bottom:8px;border:2px solid var(--ink);border-radius:12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 0 var(--ink)}
.tpl-row:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 0 var(--ink)}
.tpl-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(180deg,var(--accent-hi),var(--accent-deep))}
.tpl-row .t{font-family:var(--display);font-stretch:condensed;font-style:italic;font-weight:900;font-size:19px;line-height:1.1;overflow-wrap:anywhere;min-width:0}
.tpl-row .muted{font-size:13px;white-space:nowrap;flex-shrink:0}
.prog-taken{display:block;font-size:13px;color:var(--scan);margin-top:2px}
.tpl-foot .muted{font-size:13px}
/* Vorlage, die am längsten her ist */
.tpl.due{border-color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 0 var(--ink),0 0 18px rgba(255,138,31,.35)}
.due-tag{position:absolute;top:12px;right:14px;padding:2px 10px 3px;font-size:13px;font-weight:800;color:var(--accent-ink);border-radius:3px;transform:skewX(-10deg);
  background:linear-gradient(180deg,#fff3a6,var(--ki) 55%,var(--accent));box-shadow:2px 2px 0 var(--ink)}
.tpl .go{padding:3px 16px 4px 14px;font-size:16px;letter-spacing:.02em;color:var(--accent-ink);
  background:linear-gradient(180deg,var(--accent-hi),var(--accent-deep));border-radius:3px;transform:skewX(-10deg);box-shadow:2px 2px 0 var(--ink)}

/* Active workout */
.ex-name{font-size:22px;line-height:1.1;letter-spacing:.01em}
.last{font-size:13px;color:var(--scan);margin-top:4px}
.ex-note{font-size:13px;color:var(--muted);margin-top:2px}

/* Übungsbibliothek und Programme */
.lib-title{margin-top:30px;padding-top:16px;border-top:2px solid var(--line);font-size:20px;scroll-margin-top:64px}
.plan{font-size:13px;color:var(--ki);margin-top:3px}
.lib-add{flex:none;color:var(--accent);font-weight:900;font-size:22px;line-height:1;padding-left:12px}
.hints{margin:0;padding-left:20px;font-size:14px}
.hints li{margin:4px 0}
.prog{padding:2px 14px 6px}
.prog-desc{margin:2px 0 6px}
.unit{border-top:1px solid var(--line);padding:12px 0 6px}
.unit-name{font-size:16px}
.unit .small{flex:none}
.unit-ex{margin:8px 0 6px;padding-left:18px;font-size:14px}
.unit-ex li{margin:3px 0}
/* Eigene Texte (Namen, Notizen) dürfen notfalls mitten im Wort umbrechen, damit nichts aus der Karte läuft */
.ex-note,.ex-name,.last,.tpl .t,.tpl .muted,.li{overflow-wrap:anywhere}

/* Kalender und Wochenvergleich im Fortschritt */
.cal{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:4px 8px 8px}
.cal-month{font-family:var(--display);font-stretch:condensed;font-style:italic;font-weight:900;font-size:19px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:2px}
.cal-wd{font-size:11px;font-weight:700;color:var(--muted);padding:2px 0 4px}
.cal-day{display:flex;align-items:center;justify-content:center;aspect-ratio:1;max-height:40px;margin:0 auto;width:100%;max-width:40px;border-radius:50%;font-size:14px;color:var(--muted)}
.cal-day.on{background:radial-gradient(circle at 35% 30%,#fff3a6,var(--ki) 45%,var(--accent) 100%);color:var(--accent-ink);font-weight:800;box-shadow:0 0 8px rgba(255,212,59,.45)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day.on.today{box-shadow:inset 0 0 0 2px var(--ink),0 0 10px rgba(255,138,31,.7)}
.cal-sum{margin:8px 4px 0;font-size:13px}
/* Kalendertage antippbar (Idee 78): Tap-Fläche 44 px, die Kugel bleibt 40 px */
.cal-hit{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0;background:none;box-shadow:none;border-radius:50%}
.cal-day.sel{outline:2px solid var(--text);outline-offset:2px}
.cal-dayinfo{margin-top:6px;border-top:1px solid var(--line)}
.cal-dayinfo .li{width:100%;text-align:left;padding:10px 4px;background:none;box-shadow:none;border-radius:0}
button.stat{text-align:left;width:100%;font:inherit;box-shadow:none}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:8px 18px;align-items:baseline;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cmp-h{font-size:12px;color:var(--muted);text-align:right}
.cmp b{font-family:var(--display);font-stretch:condensed;font-style:italic;font-weight:900;font-size:20px;color:var(--ki);text-align:right}
.cmp .muted{text-align:right}
/* Sätze pro Muskel: Balken mit hell markiertem Zielbereich, Zahl in Gold, sobald der Bereich erreicht ist */
.mus{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.mus-row{display:grid;grid-template-columns:minmax(0,112px) 1fr 36px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mus-name{overflow-wrap:anywhere;line-height:1.2}
.mus-name small{display:block;font-size:12px;color:var(--muted)}
.mus-bar{position:relative;display:block;height:12px;border-radius:3px;background:var(--card);overflow:hidden}
.mus-bar i{position:absolute;top:0;bottom:0;display:block}
.mus-bar .zone{background:rgba(255,212,59,.16);border-left:2px solid var(--ki);border-right:2px solid var(--ki);z-index:1}   /* über dem Balken, damit die Grenzen sichtbar bleiben */
.mus-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:10px 0 4px;font-size:12px;color:var(--muted)}
.mus-legend i{display:inline-block;width:22px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mus-legend .lz{background:rgba(255,212,59,.16);border-left:2px solid var(--ki);border-right:2px solid var(--ki)}
.mus-legend .ln{background:var(--line)}
.mus-bar .fill{left:0;border-radius:3px;background:linear-gradient(90deg,var(--accent-deep),var(--accent));opacity:.75}
.mus-row.ok .fill{background:linear-gradient(90deg,var(--accent-deep),var(--accent) 50%,var(--ki));opacity:1}
.mus-row.nozone .fill{background:var(--line);opacity:1}
.mus-row b{text-align:right;color:var(--muted)}
.mus-row.ok b{color:var(--ki)}
.mus-row.nozone b{color:var(--text)}
.mus-note{font-size:13px;margin-top:8px}
/* Steigerungsvorschlag: schräger Knopf in Gold wie die Energieanzeigen */
button.step-up{margin-top:8px;padding:6px 14px 7px 12px;min-height:44px;font-size:14px;font-weight:800;color:var(--accent-ink);border-radius:3px;transform:skewX(-10deg);
  background:linear-gradient(180deg,#fff3a6,var(--ki) 55%,var(--accent));box-shadow:2px 2px 0 var(--ink),0 0 12px rgba(255,212,59,.4)}
button.step-up:active{transform:skewX(-10deg) translateY(2px);box-shadow:0 0 0 var(--ink)}
/* Übungskopf: ⇄ und ✕ ragen in den Kartenrand, damit die Namenszeile nicht 44 px hoch wird (Tap-Fläche bleibt 44 × 44) */
.ex-head{align-items:flex-start}
.ex-tools{gap:0;flex:none;margin:-10px -8px -8px 0}
.ex-tools button{font-size:20px;color:var(--text);opacity:.75}
/* Übungsname als Knopf (Idee 53): sieht aus wie Text, die Tap-Fläche reicht wie bei ⇄ und ✕ in den Kartenrand */
button.ex-info{background:none;box-shadow:none;border-radius:6px;text-align:left;padding:11px 0 10px;margin:-11px 0 -10px;min-width:0}
button.ex-info::after{content:" ›";color:var(--muted);font-style:normal;font-weight:400}
button.ex-info:active{opacity:.7}
.ex-type{padding:10px 0;font-size:17px}
/* Kategorie mit einem Tipp (Idee 62) */
.cat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
button.chip{min-height:44px;padding:8px 14px;font-size:14px;border-radius:22px;background:var(--well);border:2px solid var(--line);box-shadow:none}
button.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
/* Übungs-Sheet aus dem Training (Idee 59): Name groß oben, laufende Pause in der Kopfzeile */
.ex-sheet-name{font-family:var(--display);font-stretch:condensed;font-style:italic;font-weight:900;font-size:24px;line-height:1.1;margin:4px 0 2px;overflow-wrap:anywhere}
#sheet-rest.resting{color:var(--ki)}
.lib-link{gap:8px;margin-top:10px;font-size:14px}
.lib-link .muted{overflow-wrap:anywhere}
/* Ziel eintragen: goldene Umrandung, zwischen „Steigern“ (gefüllt) und „Entlasten“ (orange umrandet) */
.goal-btn{display:block;width:fit-content;margin-top:8px;padding:6px 14px 7px 12px;min-height:44px;font-size:14px;font-weight:700;color:var(--text);
  background:rgba(255,212,59,.08);border:2px solid var(--ki);border-radius:3px;transform:skewX(-10deg);box-shadow:none;text-align:left}
.goal-btn b{color:var(--ki)}
button.goal-btn:active{transform:skewX(-10deg) translateY(2px)}
/* Ziel ist eingetragen: gleich hoch wie der Knopf, damit die Sätze darunter beim Wechsel nicht springen */
.goal-text{display:flex;align-items:center;gap:.3em;background:none;border-color:transparent;color:var(--muted);font-weight:600;padding-left:0;transform:none}
.goal-text.hit{color:var(--scan)}
.better{color:var(--scan);text-align:right}
/* Verlauf (Ideen 64, 65, 67) */
.w-gain{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.w-gain b{color:var(--ki);font-weight:700}
.w-brief{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.w-rec{color:var(--ki);font-weight:700}
.hist-head{margin:18px 2px 8px;font-size:14px;font-weight:700}
.hist-head .muted{font-weight:400}
button.hist-group{width:100%;min-height:52px;margin-bottom:10px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:15px}
.hist-filter{margin:4px -16px 6px;padding:0 16px 4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.hist-filter::-webkit-scrollbar{display:none}
.hist-filter .chip{white-space:nowrap;flex:none}
.hist-open{margin:-4px 0 14px 6px;padding-left:10px;border-left:2px solid var(--line)}
/* Entlasten: ruhiger als „Steigern“, nur umrandet */
.step-down-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.step-down-row .muted{font-size:13px}
button.step-down{padding:6px 14px 7px 12px;min-height:44px;font-size:14px;font-weight:800;color:var(--accent-hi);background:transparent;border:2px solid var(--accent);border-radius:3px;transform:skewX(-10deg);box-shadow:none}
button.step-down:active{transform:skewX(-10deg) translateY(2px)}

/* Fortschrittskurve im Übungs-Sheet */
.chart{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.chart svg{display:block;width:100%;height:auto;margin:8px 0 4px;overflow:visible}
.chart-now{font-family:var(--display);font-stretch:condensed;font-style:italic;font-weight:900;font-size:20px;color:var(--ki)}
.chart-line{fill:none;stroke:var(--ki);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart-best{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.chart-dot{fill:var(--well);stroke:var(--ki);stroke-width:2}
.chart-last{fill:var(--ki);stroke:var(--ink);stroke-width:1.5;filter:drop-shadow(0 0 5px rgba(255,212,59,.8))}
.chart-foot{font-size:12px}
.chart-rec{fill:var(--ki);stroke:var(--ink);stroke-width:1.5}
.chart-sel{stroke:var(--text);stroke-width:2.5}
.chart-cursor{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3}
.chart-seg{font-size:11px;fill:var(--muted)}
.chart-now{white-space:nowrap;padding-left:8px}
#recs{scroll-margin-top:72px}   /* unter der festen Kopfzeile des Sheets */
[class^="trend-"]{text-align:right}
.chart svg[data-act]{cursor:pointer}
.chart-range{display:flex;gap:6px;margin-top:6px}
.chart-range .chip{flex:1;padding:6px 8px}
.bests .li{gap:10px}
.bests b{text-align:right;font-size:14px}
.trend-sum{font-weight:700;margin:4px 2px 8px}
.trend-up{color:var(--scan)}
.trend-same{color:var(--ki)}
.trend-down{color:var(--danger)}
.trend-few,.trend-pause{color:var(--muted)}
.chart-pickinfo{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.set{display:grid;gap:8px;align-items:center;margin-top:8px}
.set.head{margin-top:12px}
.set.head span{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.set input{text-align:center;padding:10px 4px;font-size:18px;font-weight:700}
.num{font-size:19px;color:var(--muted);text-align:center}
.check{height:48px;padding:0;border-radius:12px;font-size:20px;font-weight:800;color:var(--muted)}
.set.done .check{background:radial-gradient(circle at 35% 28%,#fff3a6,var(--ki) 45%,var(--accent) 100%);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-shade),0 0 14px rgba(255,212,59,.6)}
.set.done input{background:rgba(255,212,59,.12);border-color:rgba(255,212,59,.5);color:var(--ki)}
/* Nächster Satz nach dem Abhaken: oranger Strich links und orange Nummer */
.set.next{position:relative}
.set.next::before{content:"";position:absolute;left:-9px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--accent)}
.set.next .num{color:var(--accent)}
/* Bleibt beim Scrollen oben stehen und reicht bis unter die iPhone-Statusleiste */
.live-head{position:sticky;top:0;z-index:5;margin:calc(-1 * env(safe-area-inset-top)) -16px 10px;padding:calc(8px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(13,20,64,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--ink)}
.live-head h1{font-size:32px}

/* Lists */
.list{padding:0 14px}
.li{padding:13px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
button.li{background:none;border-radius:0;width:100%;text-align:left;padding:14px 0}
button.li:active{transform:none;opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ew-when{display:grid;grid-template-columns:1fr 104px;gap:8px;margin-bottom:6px}
.ew-when input{min-width:0}

/* Timer: die Pause lädt wie eine Energieleiste auf */
.timer{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;
  background:linear-gradient(180deg,#26369a,var(--card));border:2px solid var(--ink);border-radius:16px;padding:12px 12px 14px;z-index:40;
  transform:translateY(170%);transition:transform .25s ease;box-shadow:0 5px 0 var(--ink),0 14px 30px rgba(0,0,0,.5);pointer-events:none}
.timer.show{transform:none;pointer-events:auto}
.timer.over{border-color:var(--ki);animation:aura 1s ease-in-out infinite alternate}
@keyframes aura{from{box-shadow:0 5px 0 var(--ink),0 0 8px rgba(255,212,59,.35)}to{box-shadow:0 5px 0 var(--ink),0 0 34px rgba(255,212,59,.95)}}
.bar{height:12px;margin:0 4px 10px;background:var(--well);border:1px solid var(--line);border-radius:3px;overflow:hidden;transform:skewX(-16deg)}
#tfill{height:100%;width:0;background:linear-gradient(90deg,#3bc9ff,#9af0ff 45%,var(--ki) 88%,#fff3a6)}
.ttime{font-size:34px;line-height:1;color:var(--ki);font-variant-numeric:tabular-nums}
.timer.over .ttime{font-size:24px}
.timer button{padding:9px 11px;font-size:14px;min-height:44px;min-width:48px}
#tlabel{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:rgba(8,12,44,.93);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:2px solid var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative;border-radius:0}
.tab:active{transform:none}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:-6px;left:50%;width:36px;height:4px;margin-left:-18px;background:var(--accent);transform:skewX(-24deg)}
.tab.live::after{content:"";position:absolute;top:3px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--ki);box-shadow:0 0 8px var(--ki)}

/* Sheet + dialog */
#sheet,#dlg{position:fixed;inset:0;display:none}
#sheet{z-index:60}#dlg{z-index:80}
#sheet.open,#dlg.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(3,5,22,.72)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);
  border-top:3px solid var(--accent);border-radius:20px 20px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.panel.anim{animation:up .22s ease-out}
/* Auswahl-Sheet immer hoch: sonst schrumpft es beim Suchen, und das Suchfeld rutscht unter dem Finger weg */
.panel.tall{height:90vh}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);padding:12px 0 8px;z-index:2}
.sheet-head b{font-size:21px}
.dlg-box{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);max-width:380px;margin:0 auto;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:18px;box-shadow:0 5px 0 var(--ink)}
.dlg-box p{font-size:16px;margin-bottom:16px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-170%);transition:transform .25s;z-index:90;
  background:var(--ink);color:var(--text);border:2px solid var(--ki);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.45);width:max-content;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
#toast[data-act]{cursor:pointer;border-color:var(--accent);box-shadow:0 0 18px rgba(255,138,31,.6),0 8px 24px rgba(0,0,0,.45)}
/* Hinweis unten, oberhalb von Pausen-Timer und Tab-Leiste; ausgeblendet nur durchsichtig, damit er nichts verdeckt */
#toast.low{top:auto;bottom:calc(184px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;padding:12px 18px}
#toast.low.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast.low.notimer{bottom:calc(84px + env(safe-area-inset-bottom))}   /* ohne Pausen-Timer direkt über der Tab-Leiste, damit er keine Karten verdeckt */
.status{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);margin-bottom:12px}
.status i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--muted)}
.status.ok i{background:var(--scan)}.status.warn i{background:#ffb341}
@media (prefers-reduced-motion:reduce){.timer.over,.panel.anim{animation:none}}
</style>
</head>
<body>
<main id="main"></main>

<!-- Farbverläufe für die Sternkugeln auf dem Startbildschirm (siehe orb()) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="orb-lit" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff3a6"/><stop offset=".35" stop-color="#ffc21f"/><stop offset=".8" stop-color="#ff8a1f"/><stop offset="1" stop-color="#d9480f"/></radialGradient>
  <radialGradient id="orb-off" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#3a49a8"/><stop offset="1" stop-color="#1b2570"/></radialGradient>
</defs></svg>

<div id="timer" class="timer" aria-live="polite">
  <div class="bar"><div id="tfill"></div></div>
  <div class="row between">
    <div><div id="tlabel">Pause</div><div id="ttime" class="ttime">0:00</div></div>
    <div class="row" style="gap:6px">
      <button data-act="t-minus">−15</button>
      <button data-act="t-plus">+15</button>
      <button data-act="t-skip">Weiter</button>
    </div>
  </div>
</div>

<nav class="tabs">
  <button class="tab" data-act="tab" data-tab="training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Training</span></button>
  <button class="tab" data-act="tab" data-tab="vorlagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>Vorlagen</span></button>
  <button class="tab" data-act="tab" data-tab="uebungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Übungen</span></button>
  <button class="tab" data-act="tab" data-tab="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Verlauf</span></button>
</nav>

<div id="sheet"></div>
<div id="dlg"></div>
<div id="toast"></div>
<input type="file" id="imp-file" accept=".json,application/json,text/plain" hidden>

<script>
"use strict";
/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const num = v => parseFloat(String(v ?? "").replace(",", ".")) || 0;
const fmtNum = n => String(Math.round(n * 100) / 100).replace(".", ",");
const fmtDate = t => new Date(t).toLocaleDateString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit"});
const fmtDateLong = t => new Date(t).toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
const fmtSec = s => s < 60 ? `${s} s` : `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} min`;
const dayStart = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function relDay(t){ const d = Math.round((dayStart(Date.now()) - dayStart(t)) / 864e5); return d <= 0 ? "Heute" : d === 1 ? "Gestern" : `vor ${d} Tagen`; }

const TYPES = {
  kraft:    {label:"Kraft (Gewicht × Wdh)", f:[["a","kg","decimal"],["b","Wdh","numeric"]]},
  ausdauer: {label:"Ausdauer (Zeit + Strecke)", f:[["a","min","decimal"],["b","km","decimal"]]},
  zeit:     {label:"Nur Zeit", f:[["a","min","decimal"]]}
};

/* ---------- Data ---------- */
const LEGACY_KEY = "trainingslog-v1";   // localStorage-Eintrag des Prototyps, wird nur noch für die Migration gelesen
function seed(){
  const ex = (name, cat, type="kraft") => ({id:uid(), name, cat, type});
  const list = [
    ex("Bankdrücken","Brust"), ex("Schrägbankdrücken","Brust"), ex("Schulterdrücken","Schultern"), ex("Seitheben","Schultern"),
    ex("Dips","Trizeps"), ex("Klimmzüge","Rücken"), ex("Langhantelrudern","Rücken"), ex("Latzug","Rücken"), ex("Bizepscurls","Bizeps"),
    ex("Kniebeugen","Beine"), ex("Kreuzheben","Beine"), ex("Beinpresse","Beine"), ex("Wadenheben","Beine"),
    ex("Laufen","Ausdauer","ausdauer"), ex("Padel-Drills","Padel","zeit")
  ];
  const by = n => list.find(e => e.name === n).id;
  return {
    v:1, updatedAt:0, exercises:list,
    templates:[
      {id:uid(), name:"Push", ex:["Bankdrücken","Schrägbankdrücken","Schulterdrücken","Seitheben","Dips"].map(by)},
      {id:uid(), name:"Pull", ex:["Klimmzüge","Langhantelrudern","Latzug","Bizepscurls"].map(by)},
      {id:uid(), name:"Legs", ex:["Kniebeugen","Kreuzheben","Beinpresse","Wadenheben"].map(by)},
      {id:uid(), name:"Ausdauer", ex:["Laufen"].map(by)},
      {id:uid(), name:"Padel", ex:["Padel-Drills"].map(by)}
    ],
    workouts:[], deleted:[], active:null, settings:{rest:90}
  };
}
function loadLegacy(){ try { const s = localStorage.getItem(LEGACY_KEY); if (s) return JSON.parse(s); } catch(e){} return null; }
// Optionales Feld lastBackup: nur eine gültige Zahl behalten, sonst gilt „noch kein Backup“.
function cleanSettings(s){
  if (!(Number.isFinite(s.lastBackup) && s.lastBackup > 0)) delete s.lastBackup;
  return s;
}
function normalize(d){
  const b = seed();
  d = d && typeof d === "object" ? d : b;
  return {
    v:1, updatedAt:d.updatedAt || 0,
    exercises:Array.isArray(d.exercises) ? d.exercises : b.exercises,
    templates:Array.isArray(d.templates) ? d.templates : b.templates,
    workouts:(Array.isArray(d.workouts) ? d.workouts : []).filter(w => w && w.id).sort((x,y) => x.date - y.date),
    deleted:Array.isArray(d.deleted) ? d.deleted : [],
    active:d.active || null,
    settings:cleanSettings(Object.assign({rest:90}, d.settings || {}))
  };
}
let S = null;   // wird beim Start aus IndexedDB geladen, siehe boot()

const exById = id => S.exercises.find(e => e.id === id);
const exName = id => exById(id)?.name || "Gelöschte Übung";
const exType = id => exById(id)?.type || "kraft";

// before (optional): nur Trainings, die vor diesem Zeitpunkt begonnen haben (Vergleich im Verlauf, Idee 65)
function lastFor(exId, before = Infinity){
  for (let k = S.workouts.length - 1; k >= 0; k--){
    const w = S.workouts[k], en = w.date < before && w.entries.find(e => e.exId === exId);
    if (en && en.sets.length) return {date:w.date, sets:en.sets};
  }
  return null;
}
// Tempo aus Minuten pro Kilometer, z. B. 5.2 → "5:12"
const fmtPace = minPerKm => { const s = Math.round(minPerKm * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const paceOf = s => num(s.a) > 0 && num(s.b) > 0 ? fmtPace(num(s.a) / num(s.b)) : "";
function fmtSets(type, sets){
  // Zahl und Einheit mit geschütztem Leerzeichen, damit sie in schmalen Zeilen zusammenbleiben
  if (type === "ausdauer") return sets.map(s => `${s.a || "–"} min${s.b ? ` · ${s.b} km` : ""}${paceOf(s) ? ` · ${paceOf(s)} min/km` : ""}`).join(" | ");
  if (type === "zeit") return sets.map(s => `${s.a || "–"} min`).join(" | ");
  const w = s => num(s.a) > 0 ? `${s.a} kg` : "KG";   // „0“ ist kein Gewicht: Körpergewicht
  const weights = new Set(sets.map(s => num(s.a) > 0 ? String(s.a) : ""));
  if (sets.length > 1 && weights.size === 1) return `${w(sets[0])} × ${sets.map(s => s.b || "–").join(", ")}`;
  return sets.map(s => `${w(s)} × ${s.b || "–"}`).join(", ");
}
// plan (optional): Richtwert aus einem Bibliotheks-Programm. Er gibt beim ersten Mal die Zahl der leeren Sätze vor;
// hatte die letzte Einheit weniger Sätze, werden Sätze mit den Werten des letzten Satzes ergänzt (nie gekürzt, höchstens 10).
function newEntry(exId, plan){
  const last = lastFor(exId), want = plan && parseInt(plan.saetze) > 0 ? Math.min(10, parseInt(plan.saetze)) : 0;
  const first = want || (exType(exId) === "kraft" ? 3 : 1);
  const sets = last ? last.sets.map(s => ({a:s.a ?? "", b:s.b ?? "", done:false}))
                    : Array.from({length:first}, () => ({a:"", b:"", done:false}));
  while (last && sets.length < want){ const p = sets[sets.length - 1]; sets.push({a:p.a, b:p.b, done:false}); }
  return {exId, sets};
}
// Ist ein Satz ausgefüllt? Kraft braucht Wdh (das Gewicht darf bei Körpergewicht fehlen), Ausdauer Minuten oder km, „nur Zeit“ Minuten.
const filledSet = (type, s) => type === "kraft" ? num(s.b) > 0 : type === "ausdauer" ? num(s.a) > 0 || num(s.b) > 0 : num(s.a) > 0;
// Zeitpunkt als Wert für <input type="datetime-local"> in Ortszeit, z. B. "2026-11-14T18:30"
const toLocalInput = t => { const d = new Date(t); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
function groupByCat(list){
  const m = new Map();
  [...list].sort((a,b) => a.name.localeCompare(b.name, "de")).forEach(e => {
    const c = e.cat || "Sonstiges"; if (!m.has(c)) m.set(c, []); m.get(c).push(e);
  });
  return [...m.entries()].sort((a,b) => a[0].localeCompare(b[0], "de"));
}
function bestLabel(e){
  let best = 0, count = 0;
  S.workouts.forEach(w => w.entries.forEach(en => { if (en.exId === e.id){ count++; en.sets.forEach(s => best = Math.max(best, num(s.a))); } }));
  if (!count) return "";
  return e.type === "kraft" && best > 0 ? `Best ${fmtNum(best)} kg` : `${count}×`;
}

/* Steigerungsvorschlag: Wurden in den letzten zwei Einheiten einer Kraftübung alle Sätze mit demselben Gewicht
   und mindestens STEP_REPS Wiederholungen geschafft, schlägt die App STEP_KG mehr vor. Ergebnis: neues Gewicht oder null. */
const STEP_REPS = 10, STEP_KG = 2.5;
// plan (optional): Richtwert aus einem Bibliotheks-Programm. Dann gilt als Schwelle das obere Ende seines
// Wiederholungsbereichs (z. B. 8 bei „6-8“, 5 bei „5“), sonst STEP_REPS.
const planTop = plan => { const m = String(plan && plan.wdh || "").match(/(\d+)\s*$/); return m && +m[1] > 0 ? +m[1] : 0; };
// Mit Programm außerdem (fachlich geprüft vom trainings-experte): Ein festes Ziel ohne Bereich wie „5“ bei 5×5 ist
// lineare Progression, dort reicht eine geschaffte Einheit; bei Bereichen wie „6-8“ braucht es zwei. Und die Satzzahl
// des Programms muss erreicht sein.
function stepUp(exId, plan){
  if (exType(exId) !== "kraft") return null;
  const reps = planTop(plan) || STEP_REPS;
  const need = plan && /^\s*\d+\s*$/.test(String(plan.wdh || "")) ? 1 : 2;
  const minSets = parseInt(plan && plan.saetze) || 1;
  const runs = [];
  for (let k = S.workouts.length - 1; k >= 0 && runs.length < need; k--){
    const en = S.workouts[k].entries.find(e => e.exId === exId);
    if (en && en.sets.length) runs.push(en.sets);
  }
  if (runs.length < need) return null;
  const kg = num(runs[0][0].a);
  if (!(kg > 0)) return null;
  return runs.every(sets => sets.length >= minSets && sets.every(s => num(s.a) === kg && num(s.b) >= reps)) ? kg + stepSize(exId, need === 1, kg) : null;
}
/* Gewichtsschritt passend zur Übung, abgeleitet aus Gerät und Grundübung in der Bibliothek (Empfehlung des trainings-experte):
   Kurzhantel-Grundübung 2 kg, Kurzhantel-Isolation 1 kg, ab 10 kg aber 2 kg (schwere Einzelhanteln wie beim Pullover
   gibt es im Studio meist nur in 2-kg-Schritten), Langhantel-Grundübung für die Beine bei linearer Progression (5×5)
   5 kg, sonst STEP_KG (2,5 kg). Übungen ohne Bibliothekseintrag bleiben bei STEP_KG. kg: aktuelles Gewicht. */
function stepSize(exId, linear, kg){
  const l = libOf(exById(exId)), g = (l && l.geraet) || [];
  if (!l) return STEP_KG;
  if (g.includes("Kurzhantel")) return l.grunduebung || kg >= 10 ? 2 : 1;
  if (linear && l.grunduebung && l.cat === "Beine" && g.includes("Langhantel")) return 5;
  return STEP_KG;
}
/* Entlasten-Vorschlag bei Stillstand (Regel vom trainings-experte geprüft, siehe bibliothek/README.md, „Progression“).
   Nur mit Programm, weil erst dessen Wdh-Bereich gewolltes Halten von Stillstand unterscheidet. Auslöser: In den letzten
   drei Einheiten der Übung hatten alle Sätze dasselbe Gewicht (> 0), es gab mindestens so viele Sätze wie im Programm,
   jedes Mal lag ein Satz unter der unteren Grenze, und die Summe der Wdh (über die Programm-Sätze) ist in der neuesten
   Einheit nicht höher als in der ältesten. Vorschlag: bei einem Bereich 5 %, bei festem Ziel wie „5“ (5×5) 10 % weniger,
   in ganzen Gewichtsschritten vom aktuellen Gewicht abgezogen. Schließt „Steigern“ aus. Ergebnis: Gewicht oder null. */
function stepDown(exId, plan){
  if (exType(exId) !== "kraft" || !plan) return null;
  const m = String(plan.wdh || "").match(/^\s*(\d+)\s*(?:-\s*(\d+))?\s*$/);
  if (!m) return null;
  const low = +m[1], linear = !m[2], n = parseInt(plan.saetze) || 1, runs = [];
  for (let k = S.workouts.length - 1; k >= 0 && runs.length < 3; k--){
    const en = S.workouts[k].entries.find(e => e.exId === exId);
    if (en && en.sets.length) runs.push(en.sets);
  }
  if (runs.length < 3) return null;
  const kg = num(runs[0][0].a), reps = sets => sets.slice(0, n).reduce((t, s) => t + num(s.b), 0);
  if (!(kg > 0) || !runs.every(sets => sets.length >= n && sets.every(s => num(s.a) === kg) && sets.some(s => num(s.b) < low))) return null;
  if (reps(runs[0]) > reps(runs[2])) return null;   // es geht noch voran
  // Schritt im Zielbereich: Kurzhantel-Isolation mit 10 kg geht auf 9 kg zurück (unter 10 kg gibt es 1-kg-Schritte)
  const step = Math.min(stepSize(exId, false, kg), stepSize(exId, false, kg * .9));
  const down = kg - step * Math.max(1, Math.round(kg * (linear ? .10 : .05) / step));
  return down > 0 ? Math.round(down * 100) / 100 : null;
}
/* Wiedereinstieg nach langer Pause (Idee 33, Regel vom trainings-experte, siehe bibliothek/README.md „Progression“,
   Grundlage Bosquet 2013: bis etwa 4 Wochen kaum Kraftverlust). Liegt die letzte Einheit dieser Übung 35 Tage oder
   länger zurück, gibt es {days, weeks, kg, cut}: kg = schwerster Satz der letzten Einheit, cut = Abzug (10 % bis 55 Tage,
   danach 20 %, in ganzen Gewichtsschritten, mindestens einer; 0 ohne Gewicht, bei Ausdauer und „nur Zeit“ oder wenn
   nichts übrig bliebe). In dieser Einheit entfallen „Steigern“, „Entlasten“ und „Ziel heute“; ab der nächsten gilt alles
   wieder normal. Wird nur berechnet. */
const PAUSE_DAYS = 35;
function comeback(exId){
  const last = lastFor(exId);
  if (!last) return null;
  const days = Math.round((dayStart(Date.now()) - dayStart(last.date)) / 864e5);
  if (days < PAUSE_DAYS) return null;
  const r = {days, weeks:Math.floor(days / 7), kg:0, cut:0};
  if (exType(exId) !== "kraft") return r;
  const kg = Math.max(0, ...last.sets.map(s => num(s.a)));
  if (!(kg > 0)) return r;
  const p = days >= 56 ? .2 : .1, step = Math.min(stepSize(exId, false, kg), stepSize(exId, false, kg * (1 - p)));
  const cut = step * Math.max(1, Math.round(kg * p / step));
  if (kg - cut > 0){ r.kg = kg; r.cut = Math.round(cut * 100) / 100; }
  return r;
}
// Neues Gewicht eines Satzes beim Wiedereinstieg: nur Sätze, die noch auf dem alten Niveau liegen, und nie auf 0 oder darunter
const comebackKg = (s, b) => num(s.a) > b.kg - b.cut && num(s.a) - b.cut > 0 ? num(s.a) - b.cut : null;
/* Wiederholungsziel für heute (doppelte Progression, siehe bibliothek/README.md): pro Satz eine Wdh mehr als
   letztes Mal, höchstens bis zum oberen Ende des Programmbereichs bzw. STEP_REPS; wer schon darüber lag, hält.
   Ohne Gewicht gibt es nach oben keine Grenze. Gilt nur bei gleichem Gewicht: Weicht ein Satz im Gewicht vom
   letzten Mal ab (z. B. nach „Steigern“), gibt es kein Ziel. Nur Anzeige, nichts wird gespeichert. */
function repGoal(en, plan){
  const last = exType(en.exId) === "kraft" && lastFor(en.exId);
  if (!last || !en.sets.length) return null;
  const prev = j => last.sets[Math.min(j, last.sets.length - 1)];
  if (en.sets.some((s, j) => num(s.a) !== num(prev(j).a))) return null;
  const goal = en.sets.map((s, j) => {
    const r = num(prev(j).b), top = planTop(plan) || (num(prev(j).a) > 0 ? STEP_REPS : Infinity);
    return r > 0 ? Math.max(r, Math.min(top, r + 1)) : 0;
  });
  return goal.every(g => g > 0) ? goal : null;
}
const fmtGoal = g => g.length > 1 && g.every(x => x === g[0]) ? `${g.length} × ${g[0]} Wdh` : `${g.join(", ")} Wdh`;
// Ziel geschafft: jeder Satz mit mindestens den Ziel-Wdh (die Gewichte prüft schon repGoal)
const goalMet = (en, g) => !!g && en.sets.every((s, j) => num(s.b) >= g[j]);
/* „Besser als letztes Mal“ (Idee 35): vergleicht eine gerade trainierte Übung (en mit den erledigten Sätzen) mit der
   letzten gespeicherten Einheit, muss also vor dem Speichern aufgerufen werden. Kraft: mehr Gewicht (schwerster Satz),
   sonst mehr Wdh beim schwersten Gewicht; „Ziel geschafft“, wenn das Ziel von „Ziel heute“ erreicht ist und mehr verlangte
   als letztes Mal. Ausdauer: mehr km, sonst bei ähnlicher Strecke (mind. 90 %) schnelleres Tempo, ohne km mehr Minuten.
   Nur Zeit: mehr Minuten. Ergebnis: {name, label, goal} oder null. Wird nur berechnet, nicht gespeichert. */
// at (optional): Beginn eines gespeicherten Trainings; verglichen wird dann mit der Einheit davor, ohne „Ziel geschafft“,
// weil das Ziel nicht gespeichert ist (Verlauf, Idee 65)
function betterThanLast(en, plan, at){
  const last = lastFor(en.exId, at), type = exType(en.exId), name = exName(en.exId);
  if (!last || !en.sets.length) return null;
  const sum = (sets, f) => sets.reduce((t, s) => t + num(s[f]), 0);
  if (type === "kraft"){
    const heavy = sets => Math.max(0, ...sets.map(s => num(s.a))), kg = heavy(en.sets), kg0 = heavy(last.sets);
    if (kg > kg0) return {name, label:`+${fmtNum(kg - kg0)} kg`};
    if (kg < kg0) return null;
    const reps = sets => sum(sets.filter(s => num(s.a) === kg), "b"), diff = reps(en.sets) - reps(last.sets);
    const g = at || comeback(en.exId) ? null : repGoal(en, plan);   // nach langer Pause gab es kein Ziel
    const more = g && g.some((x, j) => x > num(last.sets[Math.min(j, last.sets.length - 1)].b));
    // „gesamt“: Summe über alle Sätze, nicht pro Satz (sonst passt es nicht zu „11 Wdh, vorher 8“ bei den Rekorden)
    if (more && goalMet(en, g)) return {name, label:diff > 0 ? `Ziel geschafft · +${fmtNum(diff)} Wdh gesamt` : "Ziel geschafft", goal:true};
    return diff > 0 ? {name, label:`+${fmtNum(diff)} Wdh gesamt`} : null;
  }
  const min = sum(en.sets, "a"), min0 = sum(last.sets, "a");
  if (type === "ausdauer"){
    const km = sum(en.sets, "b"), km0 = sum(last.sets, "b");
    if (km > km0) return {name, label:`+${fmtNum(km - km0)} km`};
    if (km > 0 && km0 > 0 && km >= km0 * .9 && min > 0 && min0 > 0 && min / km < min0 / km0) return {name, label:`Tempo ${fmtPace(min / km)} statt ${fmtPace(min0 / km0)} min/km`};
    if (km || km0) return null;
  }
  return min > min0 ? {name, label:`+${fmtNum(min - min0)} min`} : null;
}

/* Einheitswert (Regel des trainings-experte, bibliothek/README.md „Regeln für Auswertungen“), gemeinsame Grundlage der
   Kurve (Idee 76), der Kraftentwicklung (73) und der Bestwerte (75):
   Kraft mit Gewicht: nur die Sätze mit dem schwersten Gewicht der Einheit, je Satz Epley kg × (1 + Wdh/30) mit höchstens
   15 Wdh (1 Wdh = das Gewicht), davon der Mittelwert. Körpergewicht-Übungen (Gerät „Körpergewicht“ in der Bibliothek,
   ohne Eintrag: ein Satz ohne Gewicht) rechnen nicht mit Epley: ohne Zusatzgewicht der Mittelwert der Wdh, mit
   Zusatzgewicht das schwerste Zusatzgewicht und der Mittelwert der Wdh damit. */
const REP_CAP = 15;
const epley = (kg, reps) => { const r = Math.min(reps, REP_CAP); return r > 1 ? kg * (1 + r / 30) : kg; };
function isBodyweight(exId, sets){
  const l = libOf(exById(exId));
  if (l) return (l.geraet || []).includes("Körpergewicht");
  return (sets || []).some(x => num(x.b) > 0 && !(num(x.a) > 0));
}
// sets einer Einheit → {v, top, extra, reps, bw} oder null (ohne gültigen Satz)
function unitValue(exId, sets, bw){
  const ok = sets.filter(x => num(x.b) > 0);
  if (!ok.length) return null;
  const mean = xs => xs.reduce((t, x) => t + x, 0) / xs.length;
  const top = Math.max(0, ...ok.map(x => num(x.a))), at = ok.filter(x => num(x.a) === top);
  if (bw){ const reps = mean(at.map(x => num(x.b))); return {v:reps, top, extra:top, reps, bw:true}; }
  if (!(top > 0)) return null;
  return {v:mean(at.map(x => epley(top, num(x.b)))), top, extra:0, reps:mean(at.map(x => num(x.b))), bw:false};
}
// Einheiten einer Übung, nach Datum: {date, id, sets}
const exRuns = exId => S.workouts.map(w => ({date:w.date, id:w.id, sets:(w.entries.find(e => e.exId === exId) || {}).sets})).filter(r => r.sets && r.sets.length);

/* Fortschrittskurve einer Übung: ein Wert pro Einheit (Idee 76, Regel des trainings-experte).
   Kraft: Einheitswert (geschätztes Maximum als Schnitt der Arbeitssätze); Körpergewicht: Wdh im Schnitt, bei jedem
   Wechsel des Zusatzgewichts beginnt ein neuer, beschrifteter Abschnitt; Ausdauer: Tempo in min/km (kleiner ist besser);
   nur Zeit: Minuten der Einheit. Jeder Punkt trägt Datum, Training (id) und Sätze; seg trennt Abschnitte. */
function exSeries(exId){
  const type = exType(exId), pts = [], sum = (sets, f) => sets.reduce((t, s) => t + num(s[f]), 0);
  const runs = exRuns(exId);
  if (type === "kraft"){
    const bw = isBodyweight(exId, runs.flatMap(r => r.sets));
    runs.forEach(r => { const u = unitValue(exId, r.sets, bw); if (u) pts.push({date:r.date, id:r.id, sets:r.sets, v:u.v, seg:bw ? u.extra : 0}); });
    return bw ? {pts, bw:true, label:"Wiederholungen im Schnitt", fmt:v => `${fmtNum(Math.round(v * 10) / 10)} Wdh`}
              : {pts, label:"Geschätztes Maximum (Schnitt der Arbeitssätze)", fmt:v => `≈ ${fmtNum(Math.round(v * 2) / 2)} kg`};
  }
  if (type === "ausdauer"){
    // nur Einträge mit Minuten und km, sonst zählen Läufe ohne Strecke ins Tempo hinein
    runs.forEach(r => { const both = r.sets.filter(s => num(s.a) > 0 && num(s.b) > 0), min = sum(both, "a"), km = sum(both, "b"); if (min > 0 && km > 0) pts.push({date:r.date, id:r.id, sets:r.sets, v:min / km, seg:0}); });
    return {pts, label:"Tempo (oben ist schneller)", lowerIsBetter:true, fmt:v => `${fmtPace(v)} min/km`};
  }
  runs.forEach(r => { const min = sum(r.sets, "a"); if (min > 0) pts.push({date:r.date, id:r.id, sets:r.sets, v:min, seg:0}); });
  return {pts, label:"Minuten pro Einheit", fmt:v => `${fmtNum(v)} min`};
}
/* Bestwerte einer Übung (Idee 75, Regel des trainings-experte). Kraft: schwerster Satz (bei Gleichstand die meisten Wdh,
   Datum des ersten Mals), bestes geschätztes Maximum (höchster Einheitswert, wie die Bestwert-Linie der Kurve) und die
   besten Wdh der vier schwersten Gewichte (ein Gewicht fällt weg, wenn ein schwereres mindestens gleich viele Wdh hat).
   Körpergewicht: meiste Wdh in einem Satz, bester Wdh-Schnitt, mit Zusatzgewicht das schwerste und die Wdh je Stufe.
   Ausdauer: längste Strecke, schnellstes Tempo ab 1 km, ohne km die meisten Minuten. Nur Zeit: längster Satz und
   meiste Minuten einer Einheit. */
function vBests(exId){
  const type = exType(exId), runs = exRuns(exId);
  if (!runs.length) return "";
  const d = t => fmtDate(t), rows = [];
  const sum = (sets, f) => sets.reduce((t, x) => t + num(x[f]), 0);
  if (type === "kraft"){
    const bw = isBodyweight(exId, runs.flatMap(r => r.sets));
    const sets = runs.flatMap(r => r.sets.filter(x => num(x.b) > 0).map(x => ({kg:num(x.a) > 0 ? num(x.a) : 0, reps:num(x.b), date:r.date})));
    if (!sets.length) return "";
    // beste Wdh je Gewicht, die vier schwersten, ohne Gewichte, die ein schwereres mit mindestens gleich vielen Wdh schlägt
    const byKg = new Map(); sets.forEach(x => byKg.set(x.kg, Math.max(byKg.get(x.kg) || 0, x.reps)));
    let maxReps = 0; const ladder = [];
    [...byKg.keys()].sort((a, b) => b - a).forEach(kg => { const r = byKg.get(kg); if (r > maxReps){ ladder.push([kg, r]); maxReps = r; } });
    const kgLabel = kg => kg > 0 ? `${fmtNum(kg)} kg` : "ohne";
    const ladderRow = ladder.length > 1 ? ladder.slice(0, 4).map(([kg, r]) => `${bw && kg > 0 ? "+" : ""}${kgLabel(kg)}: ${fmtNum(r)}`).join(" · ") : "";
    if (bw){
      const most = sets.reduce((a, b) => b.reps > a.reps ? b : a);
      const bestU = runs.map(r => ({r, u:unitValue(exId, r.sets, true)})).filter(x => x.u && !x.u.extra).reduce((a, b) => !a || b.u.reps > a.u.reps ? b : a, null);
      rows.push(["Meiste Wdh", `${fmtNum(most.reps)} Wdh${most.kg ? ` mit +${fmtNum(most.kg)} kg` : ""} · ${d(most.date)}`]);
      if (bestU) rows.push(["Bester Schnitt", `${fmtNum(Math.round(bestU.u.reps * 10) / 10)} Wdh · ${d(bestU.r.date)}`]);
      const heavy = sets.filter(x => x.kg > 0).reduce((a, b) => !a || b.kg > a.kg || (b.kg === a.kg && b.reps > a.reps) ? b : a, null);
      if (heavy) rows.push(["Schwerstes Zusatzgewicht", `+${fmtNum(heavy.kg)} kg × ${fmtNum(heavy.reps)} · ${d(heavy.date)}`]);
      if (ladderRow && heavy) rows.push(["Beste Wdh je Gewicht", ladderRow]);
    } else {
      const heavy = sets.reduce((a, b) => b.kg > a.kg || (b.kg === a.kg && b.reps > a.reps) ? b : a);
      if (!(heavy.kg > 0)) return "";
      const bestU = runs.map(r => ({r, u:unitValue(exId, r.sets, false)})).filter(x => x.u).reduce((a, b) => !a || b.u.v > a.u.v ? b : a, null);
      rows.push(["Schwerster Satz", `${fmtNum(heavy.kg)} kg × ${fmtNum(heavy.reps)} · ${d(heavy.date)}`]);
      if (bestU) rows.push(["Geschätztes Maximum", `≈ ${fmtNum(Math.round(bestU.u.v * 2) / 2)} kg · ${d(bestU.r.date)}`]);
      if (ladderRow) rows.push(["Beste Wdh je Gewicht", ladderRow]);
    }
  } else if (type === "ausdauer"){
    const u = runs.map(r => ({date:r.date, km:sum(r.sets, "b"), min:sum(r.sets, "a"), both:r.sets.filter(x => num(x.a) > 0 && num(x.b) > 0)}));
    const far = u.reduce((a, b) => b.km > a.km ? b : a);
    if (far.km > 0){
      rows.push(["Längste Strecke", `${fmtNum(far.km)} km · ${d(far.date)}`]);
      const fast = u.map(x => ({date:x.date, km:sum(x.both, "b"), min:sum(x.both, "a")})).filter(x => x.km >= 1 && x.min > 0).reduce((a, b) => !a || b.min / b.km < a.min / a.km ? b : a, null);
      if (fast) rows.push(["Schnellstes Tempo", `${fmtPace(fast.min / fast.km)} min/km über ${fmtNum(fast.km)} km · ${d(fast.date)}`]);
    } else { const long = u.reduce((a, b) => b.min > a.min ? b : a); if (long.min > 0) rows.push(["Meiste Minuten", `${fmtNum(long.min)} min · ${d(long.date)}`]); }
  } else {
    const one = runs.every(r => r.sets.length === 1);
    const unit = runs.map(r => ({date:r.date, min:sum(r.sets, "a")})).reduce((a, b) => b.min > a.min ? b : a);
    if (!one){ const set = runs.flatMap(r => r.sets.map(x => ({date:r.date, min:num(x.a)}))).reduce((a, b) => b.min > a.min ? b : a); if (set.min > 0) rows.push(["Längster Satz", `${fmtNum(set.min)} min · ${d(set.date)}`]); }
    if (unit.min > 0) rows.push(["Meiste Minuten", `${fmtNum(unit.min)} min · ${d(unit.date)}`]);
  }
  return rows.length ? `<h2>Bestwerte</h2><div class="list bests" style="padding:0">${rows.map(([k, v]) => `<div class="li row between"><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join("")}</div>` : "";
}
/* Kraftentwicklung (Idee 73, Regel des trainings-experte): je Kraftübung der beste Einheitswert der letzten 42 Tage gegen
   den der 42 Tage davor, je mindestens 3 Einheiten. steigt: Δ ≥ +2 % oder die neueste Einheit ist schwerer als jeder
   Satz im alten Fenster; fällt: Δ ≤ −2 % und die neueste ist nicht schwerer; sonst gleich. Körpergewicht ohne
   Zusatzgewicht: Δ = (30 + Wdh neu) / (30 + Wdh alt) − 1; mit Zusatzgewicht zuerst das Zusatzgewicht, bei gleichem die Wdh.
   Nach einer Lücke ab 35 Tagen zählen nur die Einheiten danach („nach Pause“, wenn das nicht reicht). „gleich seit
   X Wochen“: Wochen seit dem höchsten Einheitswert der letzten 84 Tage, bei gleich und fällt ab 6 Wochen. */
const TREND_DAYS = 42, TREND_MIN = 3, TREND_STEP = .02;
function strengthTrend(){
  const now = Date.now(), mid = now - TREND_DAYS * 864e5, old = now - 2 * TREND_DAYS * 864e5, out = [];
  S.exercises.filter(e => (e.type || "kraft") === "kraft").forEach(e => {
    let runs = exRuns(e.id);
    if (!runs.length || runs[runs.length - 1].date < mid) return;   // gerade nicht im Training
    const bw = isBodyweight(e.id, runs.flatMap(r => r.sets));
    let cut = -1; runs.forEach((r, i) => { if (i && r.date - runs[i - 1].date >= PAUSE_DAYS * 864e5) cut = i; });
    const paused = cut >= 0 && runs[cut].date > old;
    if (cut >= 0) runs = runs.slice(cut);
    const us = runs.map(r => ({date:r.date, u:unitValue(e.id, r.sets, bw)})).filter(x => x.u);
    const nw = us.filter(x => x.date >= mid), ol = us.filter(x => x.date >= old && x.date < mid);
    if (nw.length < TREND_MIN || ol.length < TREND_MIN){ out.push({e, state:paused ? "pause" : "few", n:nw.length}); return; }
    // Körpergewicht: zuerst das Zusatzgewicht, dann die Wdh
    const score = x => bw ? x.u.extra * 1000 + x.u.reps : x.u.v;
    const newest = nw[nw.length - 1].u, best = xs => xs.reduce((a, b) => score(b) > score(a) ? b : a);
    let delta, heavier = false, val;
    if (bw){
      const xNew = Math.max(...nw.map(x => x.u.extra)), xOld = Math.max(...ol.map(x => x.u.extra));
      const repsAt = (xs, x) => Math.max(...xs.filter(y => y.u.extra === x).map(y => y.u.reps));
      if (xNew !== xOld){ delta = xNew > xOld ? 1 : -1; heavier = xNew > xOld; }
      else delta = (30 + repsAt(nw, xNew)) / (30 + repsAt(ol, xOld)) - 1;
      val = `${xNew ? `+${fmtNum(xNew)} kg · ` : ""}Ø ${fmtNum(Math.round(repsAt(nw, xNew) * 10) / 10)} Wdh`;
    } else {
      const bn = best(nw).u.v, bo = best(ol).u.v;
      delta = bn / bo - 1;
      heavier = newest.top > Math.max(...runs.filter(r => r.date >= old && r.date < mid).flatMap(r => r.sets.map(x => num(x.a))));
      val = `≈ ${fmtNum(Math.round(bn))} kg`;
    }
    const state = delta >= TREND_STEP || heavier ? "up" : delta <= -TREND_STEP ? "down" : "same";
    let since = 0;
    if (state !== "up"){ const recent = us.filter(x => x.date >= now - 84 * 864e5); if (recent.length){ const pk = best(recent); since = Math.floor((now - pk.date) / (7 * 864e5)); } }
    out.push({e, state, delta, val, since:since >= 6 ? since : 0});
  });
  return out;
}
function vStrengthTrend(all){
  const t = strengthTrend(), rated = t.filter(x => ["up", "same", "down"].includes(x.state));
  if (!rated.length) return "";
  const cnt = st => rated.filter(x => x.state === st).length;
  const pct = d => `${d > 0 ? "+" : "−"}${fmtNum(Math.round(Math.abs(d) * 1000) / 10)} %`;
  const row = x => `<button class="li row between" data-act="rec-ex" data-id="${x.e.id}"><span>${esc(x.e.name)}<span class="muted" style="display:block">${x.val ? esc(x.val) : x.state === "pause" ? "nach Pause" : "zu wenig Einheiten"}</span></span>
    <span class="trend-${x.state}">${x.state === "up" ? `steigt${x.delta > 0 && x.delta < 1 ? ` ${pct(x.delta)}` : ""}` : x.state === "down" ? `fällt${x.delta > -1 ? ` ${pct(x.delta)}` : ""}` : x.state === "same" ? "gleich" : ""}${x.since ? `<span class="muted" style="display:block">seit ${x.since} Wochen</span>` : ""}</span></button>`;
  const stuck = rated.filter(x => x.state !== "up").sort((a, b) => (a.state === "down" ? 0 : 1) - (b.state === "down" ? 0 : 1) || b.since - a.since);
  const ups = rated.filter(x => x.state === "up").sort((a, b) => b.delta - a.delta);
  const shown = [...stuck, ...ups.slice(0, 3)], rest = [...ups.slice(3), ...t.filter(x => !rated.includes(x))];
  return `<h2>Kraft, letzte 6 Wochen</h2>
    <p class="trend-sum"><span class="trend-up">Steigt ${cnt("up")}</span> · <span class="trend-same">gleich ${cnt("same")}</span> · <span class="trend-down">fällt ${cnt("down")}</span></p>
    <div class="list" style="padding:0">${shown.map(row).join("")}${all ? rest.map(row).join("") : ""}</div>
    ${rest.length ? `<button class="small ghost accent" style="padding-left:0" data-act="trend-all">${all ? "Weniger zeigen" : `Alle zeigen (${t.length})`}</button>` : ""}
    <p class="muted mus-note">Bester Schnitt der Arbeitssätze der letzten 6 Wochen gegen die 6 Wochen davor, je mindestens 3 Einheiten. Ab ±2 % steigt oder fällt eine Übung.</p>`;
}
/* Bestleistung bei gleichem Gewicht (Idee 74, Regel des trainings-experte): Ein Satz mit Gewicht hat mehr Wdh als jeder
   frühere Satz der Übung mit gleichem oder höherem Gewicht (Wdh über 15 zählen als 15) und es gibt einen solchen Satz.
   Das Gewicht muss mindestens 85 % des schwersten Satzes der letzten drei Einheiten erreichen oder höchstens einen
   Gewichtsschritt darunter liegen (was niedriger ist). Ohne Gewicht gibt es keine Bestleistung (dort ist es ein Rekord).
   prior: frühere Sätze [{kg, reps}], recentTop: schwerster Satz der letzten drei Einheiten. Ergebnis {kg, reps, prev, prevKg}. */
function bestEffort(exId, set, prior, recentTop){
  const kg = num(set.a), reps = Math.min(num(set.b), REP_CAP);
  if (!(kg > 0) || !(reps > 0) || !recentTop) return null;
  if (kg < Math.min(recentTop * .85, recentTop - stepSize(exId, false, recentTop))) return null;
  const same = prior.filter(x => x.kg >= kg);
  if (!same.length) return null;
  const top = same.reduce((a, b) => Math.min(b.reps, REP_CAP) > Math.min(a.reps, REP_CAP) || (Math.min(b.reps, REP_CAP) === Math.min(a.reps, REP_CAP) && b.kg < a.kg) ? b : a);
  return reps > Math.min(top.reps, REP_CAP) ? {kg, reps:num(set.b), prev:top.reps, prevKg:top.kg} : null;
}
// frühere Sätze einer Übung vor dem Zeitpunkt before und der schwerste Satz der letzten drei Einheiten davor
function priorSets(exId, before = Infinity){
  const runs = exRuns(exId).filter(r => r.date < before);
  return {prior:runs.flatMap(r => r.sets.map(x => ({kg:num(x.a), reps:num(x.b)}))).filter(x => x.kg > 0 && x.reps > 0),
          recentTop:Math.max(0, ...runs.slice(-3).flatMap(r => r.sets.map(x => num(x.a))))};
}
const fmtBest = b => `${fmtNum(b.reps)} Wdh mit ${fmtNum(b.kg)} kg (bisher ${fmtNum(b.prev)}${b.prevKg !== b.kg ? ` mit ${fmtNum(b.prevKg)} kg` : ""})`;
/* Kurve (Idee 76): Zeitraum 3 Monate, 1 Jahr oder alles (ui.chartRange, Vorgabe 3 Monate, mindestens die letzten 6
   Einheiten), x nach Datum; oben ist immer besser. Unterbrochen bei Lücken ab 35 Tagen und (Körpergewicht) bei einem
   Wechsel des Zusatzgewichts. Einheiten mit einem Rekord sind goldene Punkte. Ein Tipp auf die Kurve wählt den nächsten
   Punkt (ui.chartPick) und zeigt Datum, Sätze und Wert. Ab zwei Einheiten. */
const CHART_RANGES = [["3m", "3 Mon.", 91], ["1y", "1 Jahr", 365], ["all", "Alles", 0]];
function vChart(exId){
  const c = exSeries(exId);
  if (c.pts.length < 2) return "";
  const range = CHART_RANGES.find(r => r[0] === ui.chartRange) || CHART_RANGES[0];
  let pts = range[2] ? c.pts.filter(p => p.date >= Date.now() - range[2] * 864e5) : c.pts;
  if (pts.length < 6) pts = c.pts.slice(-6);
  if (pts.length < 2) pts = c.pts.slice(-2);
  const recIds = new Set((g => Object.keys(g).filter(id => g[id].records.some(r => r.exId === exId)))(gainsById()));
  const W = 320, H = 112, top = 12, bottom = 8, vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-6){ lo -= 1; hi += 1; }
  const t0 = pts[0].date, t1 = pts[pts.length - 1].date, span = Math.max(1, t1 - t0);
  const x = p => 6 + (W - 12) * (p.date - t0) / span;
  const y = v => { const t = (v - lo) / (hi - lo); return top + (H - top - bottom) * (c.lowerIsBetter ? t : 1 - t); };
  // Abschnitte: neue Linie nach einer Lücke ab PAUSE_DAYS oder bei anderem Zusatzgewicht
  const segs = [];
  pts.forEach((p, i) => { const prev = pts[i - 1];
    if (!prev || p.date - prev.date >= PAUSE_DAYS * 864e5 || p.seg !== prev.seg) segs.push([p]); else segs[segs.length - 1].push(p); });
  const line = seg => seg.map(p => `${x(p).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const best = c.lowerIsBetter ? Math.min(...c.pts.map(p => p.v)) : Math.max(...c.pts.map(p => p.v)), lastP = pts[pts.length - 1];
  const pick = pts.find(p => p.id === ui.chartPick && p.date >= t0) || null;
  const segLabels = c.bw && segs.length > 1 || (c.bw && segs[0][0].seg) ? segs.map(sg => `<text class="chart-seg" x="${x(sg[0]).toFixed(1)}" y="9">${sg[0].seg ? `+${fmtNum(sg[0].seg)} kg` : "ohne"}</text>`).join("") : "";
  const rangeBtns = `<div class="chart-range">${CHART_RANGES.map(r => `<button class="chip${r === range ? " on" : ""}" data-act="chart-range" data-r="${r[0]}" aria-pressed="${r === range}">${r[1]}</button>`).join("")}</div>`;
  return `<div class="chart">
    <div class="row between"><span class="muted">${c.label}</span><span class="chart-now">${c.fmt(lastP.v)}</span></div>
    ${rangeBtns}
    <svg viewBox="0 0 ${W} ${H}" data-act="chart-pick" data-ex="${exId}" role="img" aria-label="${esc(c.label)}: ${pts.length} Einheiten, zuletzt ${esc(c.fmt(lastP.v))}, Bestwert ${esc(c.fmt(best))}">
      <defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ki);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--ki);stop-opacity:0"/></linearGradient></defs>
      ${best >= Math.min(lo, hi) && best <= Math.max(lo, hi) ? `<line class="chart-best" x1="0" x2="${W}" y1="${y(best).toFixed(1)}" y2="${y(best).toFixed(1)}"/>` : ""}
      ${segs.map(sg => sg.length > 1 ? `<polygon fill="url(#chart-fill)" points="${x(sg[0]).toFixed(1)},${H} ${line(sg)} ${x(sg[sg.length - 1]).toFixed(1)},${H}"/><polyline class="chart-line" points="${line(sg)}"/>` : "").join("")}
      ${segLabels}
      ${pick ? `<line class="chart-cursor" x1="${x(pick).toFixed(1)}" x2="${x(pick).toFixed(1)}" y1="0" y2="${H}"/>` : ""}
      ${pts.map(p => { const last = p === lastP, rec = recIds.has(p.id);
        return `<circle class="${last ? "chart-last" : rec ? "chart-rec" : "chart-dot"}${p === pick ? " chart-sel" : ""}" cx="${x(p).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${last || rec || p === pick ? 5 : 3}"/>`; }).join("")}
    </svg>
    ${pick ? `<div class="chart-pickinfo"><b>${new Date(pick.date).toLocaleDateString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit"})}</b> · ${esc(fmtSets(exType(exId), pick.sets))} · <b>${c.fmt(pick.v)}</b>${recIds.has(pick.id) ? ` <span class="w-rec">★</span>` : ""}</div>`
      : `<div class="row between muted chart-foot"><span>${fmtDate(pts[0].date)}</span><span>Bestwert ${c.fmt(best)}</span><span>${fmtDate(lastP.date)}</span></div>`}
    ${segLabels ? `<p class="muted chart-foot" style="margin:4px 0 0">Ein neuer Abschnitt beginnt bei jedem anderen Zusatzgewicht; mit mehr Gewicht sind weniger Wdh normal.</p>` : ""}
  </div>`;
}

/* ---------- Übungsbibliothek (bibliothek/uebungen.json und vorlagen.json, Format in bibliothek/README.md) ----------
   Wird nach dem Start im Hintergrund geladen. Übernommene Übungen und Vorlagen bekommen das optionale Feld lib
   mit der ID aus der Bibliothek; eigene Übungen und Daten bleiben unverändert. */
const lib = {state:"idle", ex:[], progs:[], byId:new Map()};
// Lädt nur aus dem Zustand "idle". Nach einem Fehler setzt retryLib() beim nächsten Öffnen einer Ansicht zurück (keine Endlosschleife offline).
function loadLib(){
  if (lib.state !== "idle") return;
  lib.state = "loading";
  const get = url => fetch(url).then(r => { if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); });
  Promise.all([get("bibliothek/uebungen.json"), get("bibliothek/vorlagen.json")])
    .then(([u, v]) => {
      lib.ex = (Array.isArray(u && u.uebungen) ? u.uebungen : []).filter(l => l && l.id && l.name);
      lib.progs = (Array.isArray(v && v.vorlagen) ? v.vorlagen : []).filter(p => p && p.id && Array.isArray(p.einheiten));
      lib.byId = new Map(lib.ex.map(l => [l.id, l])); lib.state = "ready";
    })
    .catch(e => { console.warn("Übungsbibliothek nicht geladen:", e); lib.state = "error"; })   // fängt auch Fehler beim Auswerten ab
    .finally(() => {   // offene Ansicht nachziehen (Bibliothek, Richtwerte, Gewichtsschritt), aber nicht, während jemand tippt
      const uses = (ui.sheet && ["picker","programs","exercise","progress","template"].includes(ui.sheet.kind)) || (S && ui.tab === "training");   // Startbildschirm: Dran und Ordnung nach Programm
      if (uses && !document.activeElement?.matches("input,textarea,select")) render();
    });
}
function retryLib(){ if (lib.state === "error") lib.state = "idle"; }
// Eigene Übung zu einem Bibliothekseintrag: über die gespeicherte ID oder den gleichen Namen
function libOwner(l){ const n = l.name.toLowerCase(); return S.exercises.find(e => e.lib === l.id || String(e.name).toLowerCase() === n); }
// Gehört der Bibliothekseintrag l schon einer anderen eigenen Übung als id (gespeicherte ID oder, ohne lib, gleicher Name)?
const libTaken = (l, id) => S.exercises.some(e => e.id !== id && (e.lib === l.id || (!e.lib && String(e.name).toLowerCase() === l.name.toLowerCase())));
function libOf(e){
  if (lib.state !== "ready" || !e) return null;
  const n = String(e.name || "").toLowerCase();
  return (e.lib && lib.byId.get(e.lib)) || lib.ex.find(l => l.name.toLowerCase() === n) || null;
}
// Übernimmt einen Bibliothekseintrag in die eigene Liste (falls noch nicht vorhanden) und gibt die ID der eigenen Übung zurück
function addFromLib(l){
  const own = libOwner(l);
  if (own){ if (!own.lib && !libTaken(l, own.id)) own.lib = l.id; return own.id; }   // am Namen erkannt: Verbindung festhalten, damit sie ein Umbenennen übersteht (Idee 54)
  const e = {id:uid(), name:l.name, cat:l.cat || "Sonstiges", type:TYPES[l.type] ? l.type : "kraft", lib:l.id};
  S.exercises.push(e);
  return e.id;
}
// Dosierung aus einer Programm-Einheit, z. B. „3 × 6-8 Wdh · Pause 3:00 min“
function libDose(x){
  const what = x.wdh ? `${x.wdh} Wdh` : x.dauerMin ? `${x.dauerMin} min` : "";
  return `${x.saetze ? `${x.saetze} × ` : ""}${what}${x.jeSeite ? " je Seite" : ""}${x.pauseSek ? ` · Pause ${fmtSec(x.pauseSek)}` : ""}`;
}
/* Richtwert einer Übung aus dem Bibliotheks-Programm, aus dem eine Vorlage stammt (Feld lib der Vorlage).
   Wird nur nachgeschlagen, nicht gespeichert. planFor() gilt für das laufende Training, erkannt am Vorlagennamen. */
/* Steht die Übung nicht in der Einheit, weil sie in der Vorlage eine andere ersetzt (Idee 46), bekommt sie den Richtwert
   eines frei gewordenen Programmplatzes: einer Übung der Einheit, die in der Vorlage fehlt, mit gleichem Hauptmuskel
   (muskeln[0]; ohne Bibliothekseintrag gleiche Kategorie), bei mehreren der an derselben Position. Gleiche Regel wie
   beim Tauschen im Training (Idee 22). Das Ergebnis trägt dann slot (der Bibliothekseintrag des Programmplatzes). */
function planOf(t, exId){
  if (!t || !t.lib || lib.state !== "ready") return null;
  const u = lib.progs.flatMap(p => p.einheiten).find(x => x.id === t.lib), ex = exById(exId), l = libOf(ex);
  if (!u || !ex) return null;
  const list = u.uebungen || [], own = l && list.find(x => x.uebung === l.id);
  if (own) return own;
  const inTpl = new Set((t.ex || []).map(id => (libOf(exById(id)) || {}).id).filter(Boolean)), main = l && (l.muskeln || [])[0];
  const free = list.map((x, k) => ({x, k, s:lib.byId.get(x.uebung)})).filter(f => f.s && !inTpl.has(f.s.id)
    && (main ? (f.s.muskeln || [])[0] === main : !l && f.s.cat === ex.cat));
  if (!free.length) return null;
  const pos = (t.ex || []).indexOf(exId), f = free.find(c => c.k === pos) || free[0];
  return {...f.x, slot:f.s};
}
const planFor = exId => S.active ? planOf(S.templates.find(t => t.lib && t.name === S.active.name), exId) : null;
// Richtwert eines Eintrags im laufenden Training. Eine getauschte Übung übernimmt den Richtwert der Übung, die sie ersetzt
// (Feld planEx am Eintrag; es steht nur im laufenden Training und wird beim Speichern nicht übernommen).
const entryPlan = en => planFor(en.planEx || en.exId);
/* Passende Alternativen zum Tauschen im Training: gleiche Erfassungsart und gleicher Hauptmuskel (erster Eintrag in
   muskeln der Bibliothek); ist die Übung nicht in der Bibliothek, gleiche Kategorie. Eigene Übungen zuerst, dann die
   Bibliothek. Übungen, die schon im Training sind, fehlen. */
// exId: die zu ersetzende Übung, takenIds: Übungen, die schon im Training bzw. in der Vorlage sind
function swapAlternatives(exId, takenIds){
  const ex = exById(exId);
  if (!ex) return [];
  const l = libOf(ex), main = l && (l.muskeln || [])[0], type = ex.type || "kraft";
  const taken = new Set(takenIds);
  const fits = (lx, cat, t) => (t || "kraft") === type && (main && lx ? (lx.muskeln || [])[0] === main : cat === ex.cat);
  const own = S.exercises.filter(e => !taken.has(e.id) && fits(libOf(e), e.cat, e.type)).sort((a, b) => a.name.localeCompare(b.name, "de")).map(e => ({own:e}));
  const fromLib = lib.state === "ready" ? lib.ex.filter(x => !libOwner(x) && fits(x, x.cat, x.type)).sort((a, b) => a.name.localeCompare(b.name, "de")).map(x => ({lib:x})) : [];
  return [...own, ...fromLib];
}
function vSwapAlt(exId, takenIds){
  const alt = swapAlternatives(exId, takenIds), gear = l => esc(((l && l.geraet) || []).join(", "));
  return `<div class="grp"><h2>Statt ${esc(exName(exId))}</h2>
    ${alt.map(x => x.own
      ? `<button class="li row between" data-act="picked" data-id="${x.own.id}" data-name="${ownKey(x.own)}"><span>${esc(x.own.name)} <span class="muted">${gear(libOf(x.own))}</span></span></button>`
      : `<button class="li row between" data-act="picked-lib" data-lib="${esc(x.lib.id)}" data-name="${libKey(x.lib)}"><span>${esc(x.lib.name)} <span class="muted">${gear(x.lib)}</span></span><span class="lib-add" aria-hidden="true">+</span></button>`).join("")
    || `<p class="muted">Keine passende Übung gefunden. Unten stehen alle Übungen.</p>`}</div>`;
}
function vLibList(){
  if (lib.state !== "ready"){ loadLib(); return `<p class="muted">${lib.state === "error" ? "Die Übungsbibliothek ist gerade nicht erreichbar." : "Lade Übungsbibliothek …"}</p>`; }
  const free = lib.ex.filter(l => !libOwner(l));
  if (!free.length) return `<p class="muted">Alle Übungen der Bibliothek stehen schon in deiner Liste.</p>`;
  return groupByCat(free).map(([cat, list]) => `<div class="grp lib-grp"><h2>${esc(cat)}</h2>
    ${list.map(l => `<button class="li row between" data-act="picked-lib" data-lib="${esc(l.id)}" data-name="${libKey(l)}">
      <span>${esc(l.name)} <span class="muted">${esc((l.geraet || []).join(", "))}</span></span><span class="lib-add" aria-hidden="true">+</span></button>`).join("")}</div>`).join("");
}
/* Bibliothekseinträge, mit denen sich die eigene Übung d verknüpfen lässt (Idee 54): gleiche Erfassungsart, nicht schon
   einer anderen eigenen Übung zugeordnet; die Kategorie der Übung steht oben */
function vLinkList(d){
  if (lib.state !== "ready"){ loadLib(); return `<p class="muted">${lib.state === "error" ? "Die Übungsbibliothek ist gerade nicht erreichbar." : "Lade Übungsbibliothek …"}</p>`; }
  const free = lib.ex.filter(l => (l.type || "kraft") === (d.type || "kraft") && !libTaken(l, d.id));
  const groups = groupByCat(free).sort((a, b) => (b[0] === d.cat) - (a[0] === d.cat));
  return groups.map(([cat, list]) => `<div class="grp lib-grp"><h2>${esc(cat)}</h2>
    ${list.map(l => `<button class="li row between" data-act="picked-lib" data-lib="${esc(l.id)}" data-name="${libKey(l)}">
      <span>${esc(l.name)} <span class="muted">${esc((l.geraet || []).join(", "))}</span></span>${d.lib === l.id ? `<span class="muted">✓</span>` : ""}</button>`).join("")}</div>`).join("")
    || `<p class="muted">Keine passende Übung in der Bibliothek.</p>`;
}
// „Zuletzt“ oben im Auswahl-Sheet (Idee 57): die sechs zuletzt trainierten Übungen, die noch nicht drin sind
function vRecent(taken){
  const seen = new Map();
  for (let k = S.workouts.length - 1; k >= 0 && seen.size < 6; k--)
    S.workouts[k].entries.forEach(en => { if (seen.size < 6 && !seen.has(en.exId) && !taken.has(en.exId) && exById(en.exId)) seen.set(en.exId, S.workouts[k].date); });
  if (!seen.size) return "";
  return `<div class="grp recent"><h2>Zuletzt</h2>${[...seen].map(([id, t]) => { const e = exById(id), r = relDay(t);
    return `<button class="li row between" data-act="picked" data-id="${id}" data-name="${ownKey(e)}"><span>${esc(e.name)}</span><span class="muted">${r[0].toLowerCase() + r.slice(1)}</span></button>`; }).join("")}</div>`;
}
// Eigene Übungen, auf die sich der Verlauf von d übertragen lässt (Idee 58): gleiche Erfassungsart, nicht d selbst
function vTransferList(d){
  const list = S.exercises.filter(e => e.id !== d.id && (e.type || "kraft") === (d.type || "kraft"));
  return groupByCat(list).sort((a, b) => (b[0] === d.cat) - (a[0] === d.cat)).map(([cat, l]) => `<div class="grp"><h2>${esc(cat)}</h2>
    ${l.map(e => `<button class="li row between" data-act="picked" data-id="${e.id}" data-name="${ownKey(e)}"><span>${esc(e.name)}</span></button>`).join("")}</div>`).join("")
    || `<p class="muted">Keine andere Übung mit derselben Erfassungsart.</p>`;
}
function vUnit(p, u){
  const taken = S.templates.find(t => t.lib === u.id);
  return `<div class="unit"><div class="row between"><b class="unit-name">${esc(u.name)}</b>
    ${taken ? `<span class="muted">✓ als „${esc(taken.name)}“</span>` : `<button class="small" data-act="prog-take" data-p="${esc(p.id)}" data-u="${esc(u.id)}">Als Vorlage übernehmen</button>`}</div>
    <ul class="unit-ex">${(u.uebungen || []).map(x => `<li>${esc((lib.byId.get(x.uebung) || {}).name || x.uebung)} <span class="muted">${esc(libDose(x))}</span></li>`).join("")}</ul>
    ${u.hinweis ? `<p class="muted">${esc(u.hinweis)}</p>` : ""}</div>`;
}
// Suchtext einer Zeile im Auswahl-Sheet (Idee 55): Name, Kategorie, Geräte und Hauptmuskel aus der Bibliothek
// (nur der Hauptmuskel, sonst fände „Trizeps“ auch jedes Drücken für Brust und Schulter)
const searchKey = (name, cat, l) => esc([name, cat, ...((l && l.geraet) || []), ((l && l.muskeln) || [])[0]].filter(Boolean).join(" ").toLowerCase());
const ownKey = e => searchKey(e.name, e.cat, libOf(e)), libKey = l => searchKey(l.name, l.cat, l);
// Suche im Auswahl-Sheet; bleibt nach einem Neuzeichnen erhalten (ui.sheet.q). Eine Zeile passt, wenn sie alle
// Suchwörter enthält, in beliebiger Reihenfolge („trizeps kurzhantel“)
function filterPick(q){
  const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  q = words.join(" ");
  document.querySelectorAll("#pick-list .grp").forEach(g => {
    let any = false;
    g.querySelectorAll("[data-name]").forEach(b => { const hit = words.every(w => b.dataset.name.includes(w)); b.style.display = hit ? "" : "none"; any = any || hit; });
    g.style.display = any && !(q && g.classList.contains("recent")) ? "" : "none";   // „Zuletzt“ nur ohne Suche, die Treffer stehen in ihrer Kategorie
  });
  const t = $("#pick-list .lib-title");
  if (t) t.style.display = [...document.querySelectorAll("#pick-list .lib-grp")].some(g => g.style.display !== "none") || !q ? "" : "none";
  const none = $("#pick-none");
  if (none) none.hidden = !q || [...document.querySelectorAll("#pick-list .grp")].some(g => g.style.display !== "none");
}

/* ---------- Speicher (IndexedDB) ----------
   Datenbank "trainingslog", Schema-Version 1:
     meta     – ein Eintrag "state": Übungen, Vorlagen, Einstellungen, laufendes Training
     workouts – ein Eintrag pro gespeichertem Training (Schlüssel: id)
   Im Arbeitsspeicher (S) und im Backup gilt weiter das Datenformat v1 des Prototyps. */
const DB_NAME = "trainingslog", DB_VERSION = 1;
const store = {status:"ok", persisted:false};   // status: "ok" | "error" (Schreiben fehlgeschlagen) | "off" (kein Speicher verfügbar)
let dbP = null;

function openDb(){
  if (dbP) return dbP;
  const p = new Promise((res, rej) => {
    let late = false;
    const rq = indexedDB.open(DB_NAME, DB_VERSION);
    rq.onupgradeneeded = e => {
      const db = rq.result;
