      // Spätere Schema-Versionen hier als weitere Schritte ergänzen: if (e.oldVersion < 2){ … }
      if (e.oldVersion < 1){ db.createObjectStore("meta"); db.createObjectStore("workouts", {keyPath:"id"}); }
    };
    rq.onsuccess = () => {
      const db = rq.result;
      if (late){ db.close(); return; }
      const forget = () => { if (dbP === p) dbP = null; };
      db.onversionchange = () => { db.close(); forget(); };   // ein anderer Tab will das Schema ändern
      db.onclose = forget;                                     // der Browser hat die Verbindung getrennt
      res(db);
    };
    rq.onerror = () => rej(rq.error);
    setTimeout(() => { late = true; rej(new Error("Die Datenbank antwortet nicht.")); }, 5000);
  });
  p.catch(() => { if (dbP === p) dbP = null; });
  return dbP = p;
}
function closeDb(){ const p = dbP; dbP = null; if (p) p.then(db => db.close(), () => {}); }

// Führt work(transaktion) aus und wartet, bis alles gelesen bzw. geschrieben ist.
function idb(mode, work){
  return openDb().then(db => new Promise((res, rej) => {
    const t = db.transaction(["meta","workouts"], mode);
    t.oncomplete = () => res();
    t.onabort = () => rej(t.error || new Error("Transaktion abgebrochen"));
    try { work(t); } catch(e){ try { t.abort(); } catch(_){} rej(e); return; }
    // Sofort abschließen statt auf die Antworten zu warten – wichtig, wenn iOS die App direkt danach einfriert.
    if (mode === "readwrite" && t.commit) t.commit();
  }));
}
function setStatus(s){
  if (store.status === s) return;
  store.status = s;
  if (s === "error") toast("Speichern fehlgeschlagen – bitte Backup sichern");
  if (ui.tab === "verlauf" && !ui.sheet) render();
}

const stateBody = () => ({v:1, updatedAt:S.updatedAt, exercises:S.exercises, templates:S.templates, settings:S.settings, active:S.active, deleted:S.deleted});
async function loadDb(){
  const out = {};
  await idb("readonly", t => {
    t.objectStore("meta").get("state").onsuccess = e => { out.state = e.target.result; };
    t.objectStore("workouts").getAll().onsuccess = e => { out.workouts = e.target.result; };
  });
  return out;
}

/* Änderungen werden vorgemerkt und am Ende des laufenden Klicks/Tastendrucks zusammen in einer
   Transaktion geschrieben. save() sichert den "state"-Eintrag, save({put:id}) / save({del:id})
   zusätzlich ein einzelnes Training, save({all:true}) ersetzt alle Trainings (Import). */
const pending = {state:false, all:false, put:new Set(), del:new Set()};
let flushQueued = false, saveFails = 0;
function save(change){
  S.updatedAt = Date.now();
  if (store.status === "off") return;   // kein Speicher verfügbar, siehe boot()
  pending.state = true;
  if (change){
    if (change.all) pending.all = true;
    if (change.put){ pending.put.add(change.put); pending.del.delete(change.put); }
    if (change.del){ pending.del.add(change.del); pending.put.delete(change.del); }
  }
  if (!flushQueued){ flushQueued = true; queueMicrotask(flush); }
}
function flush(){
  flushQueued = false;
  if (!pending.state && !pending.all && !pending.put.size && !pending.del.size) return Promise.resolve(true);
  const job = {all:pending.all, put:[...pending.put], del:[...pending.del]};
  pending.state = pending.all = false; pending.put.clear(); pending.del.clear();
  return idb("readwrite", t => {
    const ws = t.objectStore("workouts");
    if (job.all){ ws.clear(); S.workouts.forEach(w => ws.put(w)); }
    else {
      job.del.forEach(id => ws.delete(id));
      job.put.forEach(id => { const w = S.workouts.find(x => x.id === id); if (w) ws.put(w); });
    }
    t.objectStore("meta").put(stateBody(), "state");
  }).then(() => { saveFails = 0; setStatus("ok"); return true; }, err => {
    console.warn("Speichern fehlgeschlagen:", err);
    closeDb();
    // Alles wieder vormerken – der nächste Versuch schreibt dann den aktuellen Stand.
    pending.state = true; pending.all = pending.all || job.all;
    job.put.forEach(id => pending.del.has(id) || pending.put.add(id));
    job.del.forEach(id => pending.put.has(id) || pending.del.add(id));
    if (++saveFails === 1) setTimeout(flush, 400);   // einmal mit frischer Verbindung wiederholen
    else setStatus("error");
    return false;
  });
}

/* ---------- UI state ---------- */
let ui = {tab:"training", sheet:null, open:null, next:null, openGroups:new Set(), histFilter:null};   // openGroups, histFilter: Verlauf (Ideen 64, 67)   // next: der als Nächstes markierte Satz (Idee 37)
let bootErr = null;   // gesetzt, wenn die Daten beim Start nicht geladen werden konnten
const timer = {end:0, total:0, rang:false, by:null, prev:null, src:null};
let undoDel = null;   // zuletzt gelöschtes Training, solange „Rückgängig“ angeboten wird (Idee 71)
let undoSet = null;   // zuletzt mit „− Satz“ entfernter Satz, solange er sich zurückholen lässt
let undoVals = null;   // Werte vor „Steigern“, „Entlasten“ oder „Ziel eintragen“, solange sie sich zurückholen lassen
// Ein Feld (f: "a" = kg, "b" = Wdh) in allen offenen Sätzen setzen, val(j) liefert den Wert für Satz j;
// der Hinweis bietet 10 s lang „Rückgängig“ an
function setValues(en, f, val, msg){

  en.sets.forEach((s, j) => { if (!s.done) s[f] = String(val(j)); });
  save(); render();
  toast(`${msg} · Rückgängig`, "undo-vals", true);
  setTimeout(() => { if (undoVals === u) undoVals = null; }, 10500);
}

/* ---------- Audio (beep at end of rest) ---------- */
let actx = null, beeps = [];
function unlockAudio(){
  try {
    const fresh = !actx;
    if (fresh) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    // Nach einem Neuladen läuft die Pause schon (Idee 38): den Ton jetzt planen, wo Audio freigegeben ist
    if (fresh && timer.end > Date.now()) scheduleBeep((timer.end - Date.now()) / 1000);
  } catch(e){}
}
function cancelBeep(){ beeps.forEach(o => { try { o.stop(); } catch(e){} }); beeps = []; }
function scheduleBeep(sec){
  cancelBeep();
  if (!actx) return;
  try {
    const t0 = actx.currentTime + Math.max(0, sec);
    [0, .28, .56].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + d + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + .2);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + .22);
      beeps.push(o);
    });
  } catch(e){}
}
/* Nächster Satz nach dem Abhaken (Idee 37): der nächste offene Satz derselben Übung, sonst ein früher übersprungener,
   sonst der erste offene Satz der folgenden Übungen (danach wieder von vorn). Ergebnis: das Satz-Objekt oder null. */
function nextOpen(i, j){
  const es = S.active.entries, own = es[i].sets;
  for (let k = j + 1; k < own.length; k++) if (!own[k].done) return own[k];
  for (let k = 0; k < j; k++) if (!own[k].done) return own[k];
  for (let d = 1; d < es.length; d++){ const s = es[(i + d) % es.length].sets.find(x => !x.done); if (s) return s; }
  return null;
}
/* Den markierten Satz sichtbar machen, falls er hinter dem Pausen-Timer (oder der Tab-Leiste) oder unter der Kopfzeile
   liegt. Beginnt mit ihm eine neue Übung, rückt deren Karte nach oben, damit „Letztes Mal“ und Ziel in der Pause lesbar
   sind. Nicht, wenn gerade ein Feld den Fokus hat. */
function revealNext(newEx){
  const row = document.querySelector(".set.next");
  if (!row || document.activeElement?.matches("input,textarea,select")) return;
  const tb = $("#timer"), head = document.querySelector(".live-head"), bottom = parseFloat(getComputedStyle(tb).bottom) || 0;
  const edge = window.innerHeight - bottom - (tb.classList.contains("show") ? tb.offsetHeight : 0), low = edge - 12;
  const high = (head ? head.getBoundingClientRect().bottom : 0) + 8;
  const r = row.getBoundingClientRect(), card = row.closest(".card").getBoundingClientRect();
  // Nur scrollen, wenn Timer, Tab-Leiste oder Kopfzeile den Satz wirklich verdecken; knappe Fälle bleiben ruhig,
  // damit die Seite nicht nach jedem Haken ein paar Pixel unter dem Finger wegrückt
  if (r.top >= high - 8 && r.bottom <= edge) return;
  let dy = r.bottom > edge ? r.bottom - low : r.top - high;
  if (newEx && r.bottom - (card.top - high) <= low) dy = card.top - high;
  window.scrollBy({top:dy, behavior:matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
/* Pausendauer nach einem Satz (Idee 36): bei Vorlagen aus einem Bibliotheks-Programm dessen Pause (pauseSek, bei einer
   getauschten Übung die des Programmplatzes), sonst die allgemeine Einstellung. Eine eigene Pause pro Übung gibt es nicht. */
function restFor(en){
  const p = num((entryPlan(en) || {}).pauseSek);
  return p >= 10 && p <= 600 ? {sec:Math.round(p), src:"Programm"} : {sec:S.settings.rest, src:null};
}
/* Die laufende Pause steht als {end, total, src} in S.active.rest (Idee 38), damit sie einen App-Wechsel und ein
   Neuladen übersteht. Das Feld gibt es nur im laufenden Training: finish() übernimmt es nicht, das Backup setzt active:null. */
// next: Position [Übung, Satz] des markierten nächsten Satzes (Idee 37), damit die Markierung ein Neuladen übersteht,
// auch ohne laufende Pause (dann end:0)
function keepRest(){
  if (!S || !S.active) return;
  const i = ui.next ? S.active.entries.findIndex(e => e.sets.includes(ui.next)) : -1;
  if (timer.end || i >= 0){
    S.active.rest = timer.end ? {end:timer.end, total:timer.total, src:timer.src || null} : {end:0};
    if (i >= 0) S.active.rest.next = [i, S.active.entries[i].sets.indexOf(ui.next)];
  } else delete S.active.rest;
  save();
}
function restoreRest(){
  const r = S && S.active && S.active.rest;
  if (!r) return;
  const n = Array.isArray(r.next) && S.active.entries[r.next[0]] && S.active.entries[r.next[0]].sets[r.next[1]];
  if (n && !n.done) ui.next = n;
  if (Number.isFinite(r.end) && r.end > Date.now() - 8000 && r.end < Date.now() + 3600e3 && Number.isFinite(r.total) && r.total > 0){
    timer.end = r.end; timer.total = r.total; timer.src = r.src || null; timer.rang = r.end <= Date.now();
    if (!timer.rang) scheduleBeep((r.end - Date.now()) / 1000);   // klappt erst, wenn Audio nach einem Tipp freigegeben ist
  } else if (ui.next) S.active.rest = {end:0, next:r.next};   // Pause vorbei, Markierung bleibt
  else delete S.active.rest;
}
// by: der Satz, der die Pause ausgelöst hat. Der Stand davor wird gemerkt, damit undoTimer() ihn zurückholen kann.
// src: woher die Dauer stammt ("Programm" oder null für die allgemeine Einstellung), steht im Timer.
function startTimer(sec, by, src){
  timer.prev = by ? {end:timer.end, total:timer.total, rang:timer.rang, src:timer.src} : null; timer.by = by || null;
  timer.end = Date.now() + sec * 1000; timer.total = sec; timer.rang = false; timer.src = src || null; scheduleBeep(sec); keepRest(); tick();
}
// Wird der auslösende Satz gleich wieder gelöst, läuft die vorherige Pause weiter; gab es keine, stoppt der Timer.
function undoTimer(by){
  if (!timer.end || !by || timer.by !== by) return;
  const p = timer.prev;
  if (p && p.end > Date.now()){
    timer.end = p.end; timer.total = p.total; timer.rang = p.rang; timer.src = p.src; timer.by = timer.prev = null;
    scheduleBeep((p.end - Date.now()) / 1000); keepRest(); tick();
  } else stopTimer();
}
function stopTimer(){ timer.end = 0; timer.by = timer.prev = null; cancelBeep(); keepRest(); tick(); }
function shiftTimer(delta){
  if (!timer.end) return;
  timer.end = Math.max(Date.now() + 1000, timer.end + delta * 1000);
  timer.total = Math.max(timer.total + delta, 1); timer.rang = false;
  scheduleBeep((timer.end - Date.now()) / 1000); keepRest(); tick();
}

let dlgResolve = null;
function ask(text, ok = "OK", danger = false, no = "Abbrechen"){

/* Verlauf von Übung from auf Übung to übertragen (Idee 58): exId in allen gespeicherten Trainings, in den Vorlagen und im
   laufenden Training umsetzen, danach from löschen. Stehen beide in einem Training, kommen die Sätze in einen Eintrag
   (an der Stelle des ersten, in der Reihenfolge der Einträge). Nur nach Rückfrage; s: das Auswahl-Sheet, das gefragt hat. */
async function transferHistory(from, to, s){
  const a = exById(from), b = exById(to);
  if (!a || !b || from === to || (a.type || "kraft") !== (b.type || "kraft")) return;   // Sätze würden sonst anders gelesen
  const ws = S.workouts.filter(w => w.entries.some(e => e.exId === from));
  const ok = await ask(`${ws.length === 1 ? "1 Training" : `${ws.length} Trainings`} von „${a.name}“ zu „${b.name}“ übertragen? „${a.name}“ wird danach gelöscht. Das lässt sich nicht rückgängig machen.`, "Übertragen", true);
  if (!ok || ui.sheet !== s || !exById(from) || !exById(to)) return;
  // Einträge von from in to umsetzen. Nur wenn dadurch to doppelt wird, kommen die Sätze in den ersten Eintrag;
  // schon vorher doppelte Einträge von to bleiben, wie sie sind. Felder, die nur der zweite Eintrag hat, wandern mit.
  const merge = entries => {
    const out = [];
    entries.forEach(en => {
      const moved = en.exId === from;
      if (moved) en.exId = to;
      if (en.planEx === from) en.planEx = to;
      const first = en.exId === to && out.find(x => x.exId === to && (moved || x.moved));
      if (first){ first.sets.push(...en.sets); for (const k in en) if (!(k in first)) first[k] = en[k]; }
      else { if (moved) Object.defineProperty(en, "moved", {value:true, configurable:true}); out.push(en); }   // nicht aufzählbar, wird nicht gespeichert
    });
    out.forEach(en => delete en.moved);
    return out;
  };
  ws.forEach(w => { w.entries = merge(w.entries); save({put:w.id}); });
  S.templates.forEach(t => { t.ex = [...new Set(t.ex.map(id => id === from ? to : id))]; });
  if (S.active){ S.active.entries = merge(S.active.entries); keepRest(); }   // Position des markierten Satzes neu festhalten
  S.exercises = S.exercises.filter(e => e.id !== from);
  save(); ui.sheet = null; render();
  toast(`Verlauf von „${a.name}“ jetzt bei „${b.name}“`);
}
// Übungs-Sheet öffnen; orig: Ausgangsstand, damit „Abbrechen“ oder ein Tipp neben das Sheet nach Änderungen nachfragt
function exSheet(draft, more){ ui.sheet = {kind:"exercise", draft, orig:JSON.stringify(draft), ...more}; render(); }
let toastT = null;
// act (optional): Aktion aus "actions", die ein Tipp auf den Hinweis auslöst – der Hinweis bleibt dann länger stehen.
// low: unten über Timer und Tab-Leiste statt oben, für Hinweise zu einer Aktion, die der Daumen gerade unten gemacht hat
function toast(msg, act, low){
  const t = $("#toast"); t.textContent = msg;
  t.classList.toggle("notimer", !!low && !$("#timer").classList.contains("show"));
  if (act) t.dataset.act = act; else delete t.dataset.act;
  t.classList.toggle("low", !!low);
  t.classList.add("show"); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("show"), act ? 10000 : 2200);
}

/* ---------- Fortschritt (Spielelemente) ----------
   Kampfkraft, Stufe, Serie, Rekorde und Erfolge werden bei jedem Anzeigen aus den gespeicherten
   Trainings berechnet. Nichts davon wird gespeichert, das Datenformat bleibt unverändert. */
// Kampfkraft für einen Satz: Gewicht × Wdh, Übungen ohne Gewicht zählen wie 30 kg; bei Ausdauer Minuten und Kilometer.
function setPower(type, s){
  const a = num(s.a), b = num(s.b);
  return Math.round(type === "kraft" ? (a > 0 ? a * b / 10 + b : b * 4) : type === "ausdauer" ? a * 10 + b * 20 : a * 10);
}
// Woran ein Rekord gemessen wird: [Einheit, Wert]
function setMark(type, s){
  const a = num(s.a), b = num(s.b);
  return type === "kraft" ? (a > 0 ? ["kg", a] : ["Wdh", b]) : type === "ausdauer" && b > 0 ? ["km", b] : ["min", a];
}
// Kampfkraft und neue Rekorde eines Trainings, gemessen an den bisherigen Bestwerten. bests wird dabei fortgeschrieben.
function workoutGain(w, bests){
  let power = 0, volume = 0; const records = [];
  w.entries.forEach(en => {
    const type = exType(en.exId), b = bests[en.exId] || (bests[en.exId] = {}), top = {};
    en.sets.forEach(s => {
      power += setPower(type, s);
      if (type === "kraft") volume += num(s.a) * num(s.b);
      const [unit, v] = setMark(type, s);
      if (v > (top[unit] || 0)) top[unit] = v;
    });
    Object.keys(top).forEach(unit => {
      if (b[unit] > 0 && top[unit] > b[unit]) records.push({name:exName(en.exId), exId:en.exId, unit, v:top[unit], old:b[unit]});   // der erste Wert einer Übung ist noch kein Rekord
      if (top[unit] > (b[unit] || 0)) b[unit] = top[unit];
    });
  });
  return {power, volume, records};
}
// Kampfkraft und Rekorde je Training (id → workoutGain), einmal über alle Trainings wie in progress(); nur berechnet
function gainsById(){ const out = {}, bests = {}; S.workouts.forEach(w => { out[w.id] = workoutGain(w, bests); }); return out; }
const WEEK = 7 * 864e5;
const weekStart = t => { const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); };   // Montag der Woche
// Gesamtstand über alle Trainings (list ist nach Datum aufsteigend sortiert).
function progress(list){
  const p = {n:list.length, power:0, sets:0, km:0, records:0, maxVolume:0, bests:{}, exercises:new Set(), streak:0, bestStreak:0, seven:false};
  let run = 0, prevWeek = null;
  list.forEach((w, i) => {
    const g = workoutGain(w, p.bests);
    p.power += g.power; p.records += g.records.length; p.maxVolume = Math.max(p.maxVolume, g.volume);
    w.entries.forEach(en => { p.exercises.add(en.exId); p.sets += en.sets.length; if (exType(en.exId) === "ausdauer") en.sets.forEach(s => p.km += num(s.b)); });
    if (i >= 6 && w.date - list[i - 6].date < WEEK) p.seven = true;
    const wk = weekStart(w.date);
    if (wk !== prevWeek){ run = prevWeek !== null && Math.round((wk - prevWeek) / WEEK) === 1 ? run + 1 : 1; prevWeek = wk; p.bestStreak = Math.max(p.bestStreak, run); }
  });
  // Die Serie läuft weiter, solange diese oder die letzte Woche ein Training hat.
  if (prevWeek !== null && Math.round((weekStart(Date.now()) - prevWeek) / WEEK) <= 1) p.streak = run;
  p.level = Math.floor(Math.sqrt(p.power / 400)) + 1;
  return p;
}
const levelFloor = l => 400 * (l - 1) ** 2;   // Kampfkraft, bei der Stufe l beginnt
const RANKS = [[20,"Legende"],[15,"Großmeister"],[10,"Meister"],[7,"Elitekämpfer"],[4,"Kämpfer"],[2,"Schüler"],[1,"Neuling"]];
const rankOf = l => RANKS.find(r => l >= r[0])[1];
const fmtInt = n => Math.round(n).toLocaleString("de-DE");
const weeks = n => n === 1 ? "1 Woche" : `${n} Wochen`;
// Erfolge: [Name, Beschreibung, Bedingung auf dem Gesamtstand]
const ACHIEVEMENTS = [
  ["Erster Schritt", "Das erste Training gespeichert", p => p.n >= 1],
  ["Dranbleiber", "10 Trainings gespeichert", p => p.n >= 10],
  ["Stammgast", "50 Trainings gespeichert", p => p.n >= 50],
  ["Hundert voll", "100 Trainings gespeichert", p => p.n >= 100],
  ["Alle sieben", "7 Trainings innerhalb von 7 Tagen", p => p.seven],
  ["Monatsserie", "4 Wochen in Folge trainiert", p => p.bestStreak >= 4],
  ["Vierteljahr", "12 Wochen in Folge trainiert", p => p.bestStreak >= 12],
  ["Über 9000", "Mehr als 9000 Kampfkraft gesammelt", p => p.power > 9000],
  ["Rekordjäger", "10 eigene Bestwerte übertroffen", p => p.records >= 10],
  ["Schwergewicht", "10.000 kg in einem Training bewegt", p => p.maxVolume >= 10000],
  ["Vielseitig", "10 verschiedene Übungen trainiert", p => p.exercises.size >= 10],
  ["Marathon", "Insgesamt 42 km Ausdauer", p => p.km >= 42]
];

/* ---------- Views ---------- */
// Stufe, Kampfkraft und Balken bis zur nächsten Stufe
function vLevel(p){
  const from = levelFloor(p.level), to = levelFloor(p.level + 1);
  return `<span class="row between lvl"><span><b>Stufe ${p.level}</b> ${rankOf(p.level)}</span><span><b>${fmtInt(p.power)}</b> Kampfkraft</span></span>
    <span class="xp"><i style="width:${Math.round(100 * (p.power - from) / (to - from))}%"></i></span>`;

/* Verlauf (Ideen 64, 65, 67). Gruppen: diese und letzte Woche offen, ältere Wochen und (älter als drei Monate) Monate
   als einzeilige Knöpfe, die ein Tipp aufklappt (ui.openGroups). Jede Karte zeigt, was das Training gebracht hat
   (Kampfkraft und Rekorde aus workoutGain(), wie in progress() nur berechnet), aufgeklappt dazu „besser als letztes Mal“
   je Übung. Der Filter über der Liste (ui.histFilter) zeigt nur Trainings eines Namens, ohne Gruppen. */
function histGroup(t){
  const thisWeek = weekStart(Date.now()), wk = weekStart(t);
  if (wk >= thisWeek) return {key:"w" + wk, title:"Diese Woche", fixed:true};
  if (wk >= weekStart(thisWeek - 864e5)) return {key:"w" + wk, title:"Letzte Woche", fixed:true};
  const d = new Date(t), now = new Date(), year = d.getFullYear() !== now.getFullYear();
  // Ganze Monate, die vor gut drei Monaten anfangen. Entschieden wird je Woche, eine Woche über die Monatsgrenze kommt
  // ganz in den Monat ihres Montags; so liegt keine Kalenderwoche an zwei Stellen.
  const cut = new Date(Date.now() - 91 * 864e5); cut.setDate(1); cut.setHours(0, 0, 0, 0);
  if (wk < cut.getTime()){ const md = new Date(wk); return {key:`m${md.getFullYear()}-${md.getMonth()}`, title:md.toLocaleDateString("de-DE", {month:"long", year:"numeric"})}; }
  const mon = new Date(wk), sun = new Date(wk + 6 * 864e5), m = x => x.toLocaleDateString("de-DE", {month:"short"});
  return {key:"w" + wk, title:`${mon.getDate()}.${mon.getMonth() === sun.getMonth() ? "" : ` ${m(mon)}`}–${sun.getDate()}. ${m(sun)}${year ? ` ${sun.getFullYear()}` : ""}`};
}
// Kurzfassung einer Übung für die zugeklappte Verlaufskarte (Idee 69): Kraft der schwerste Satz („82,5 × 8“, ohne Gewicht
// die meisten Wdh), Ausdauer Strecke und Tempo, „nur Zeit“ die Minuten
function entryBrief(e){
  const type = exType(e.exId), sets = e.sets, sum = f => sets.reduce((t, x) => t + num(x[f]), 0);
  let v = "";
  if (type === "kraft"){
    const kg = Math.max(0, ...sets.map(x => num(x.a)));
    if (kg > 0){ const reps = Math.max(0, ...sets.filter(x => num(x.a) === kg).map(x => num(x.b))); v = `${fmtNum(kg)}${reps ? ` × ${fmtNum(reps)}` : " kg"}`; }
    else { const reps = Math.max(0, ...sets.map(x => num(x.b))); v = reps ? `${fmtNum(reps)} Wdh` : ""; }
  } else {
    const min = sum("a"), km = type === "ausdauer" ? sum("b") : 0;
    v = km ? `${fmtNum(km)} km${min ? ` · ${fmtPace(min / km)} min/km` : ""}` : min ? `${fmtNum(min)} min` : "";
  }
  return `${exName(e.exId)}${v ? ` ${v}` : ""}`;
}
function vHistory(){
  const gains = gainsById();
  const thisYear = new Date().getFullYear();
  const card = w => {
    const open = ui.open === w.id, g = gains[w.id];
    // Satzzahl nur, wenn Kraftübungen dabei sind; ein Lauf ist kein „1 Satz“
    const n = w.entries.filter(e => exType(e.exId) === "kraft").reduce((s, e) => s + e.sets.length, 0);
    const recs = new Map(g.records.map(r => [r.exId, r]));
    const mins = w.end ? Math.max(1, Math.round((w.end - w.date) / 60000)) : 0;
    const date = fmtDateLong(w.date) + (new Date(w.date).getFullYear() !== thisYear ? ` ${new Date(w.date).getFullYear()}` : "");
    const rec = g.records.length;
    return `<div class="card">
      <button class="li row between" style="padding:0" data-act="toggle-w" data-id="${w.id}">
        <span class="grow"><span class="ex-name" style="display:block">${esc(w.name)}</span>
        <span class="muted">${date}${mins ? ` · ${mins} min` : ""}${n ? ` · ${n} ${n === 1 ? "Satz" : "Sätze"}` : ""}</span>
        ${open ? "" : `<span class="w-brief">${esc(w.entries.map(entryBrief).join(" · "))}</span>`}
        <span class="w-gain">+${fmtInt(g.power)} Kampfkraft${rec ? ` · <b>★ ${rec} ${rec === 1 ? "Rekord" : "Rekorde"}</b>` : ""}</span></span>
        <span class="muted">${open ? "▾" : "▸"}</span></button>
      ${open ? `<div style="margin-top:8px">${w.entries.map(e => { const bt = exById(e.exId) ? betterThanLast(e, null, w.date) : null, rc = recs.get(e.exId);
          // Rekord (Idee 70): goldener Stern vor dem Vergleich, ohne Vergleich mit dem alten Bestwert
          const unit = rc && (rc.unit === "Wdh" ? " Wdh" : ` ${rc.unit}`);
          const right = rc && !bt ? `<span class="w-rec">★ ${fmtNum(rc.v)}${unit} (vorher ${fmtNum(rc.old)})</span>`
            : bt ? `<span class="better">${rc ? `<span class="w-rec">★</span> ` : ""}${esc(bt.label)}</span>` : "";
          return `<div class="li"><div class="row between"><b>${esc(exName(e.exId))}</b>${right}</div><div class="muted">${esc(fmtSets(exType(e.exId), e.sets))}</div></div>`; }).join("")}
        <div class="row between" style="margin-top:6px"><button class="small" data-act="edit-w" data-id="${w.id}">Bearbeiten</button>
        <button class="small ghost danger" data-act="del-w" data-id="${w.id}">Training löschen</button></div></div>` : ""}
    </div>`;
  };
  // Filter nach Einheit (Idee 67): Namen der Trainings aus den letzten 8 Wochen, der zuletzt trainierte zuerst
  // Die Einheiten mit „Dran“ kommen zuerst (Idee 72), man sieht sie vor dem Training nach
  const recent = [...new Set([...S.workouts].reverse().filter(w => w.date >= Date.now() - 56 * 864e5).map(w => w.name))];
  const dueNames = (td => S.templates.filter(t => td.due.has(t.id)).map(t => t.name))(templateDays()).filter(nm => recent.includes(nm));
  const names = [...new Set([...dueNames, ...recent])];
  const f = ui.histFilter && S.workouts.some(w => w.name === ui.histFilter) ? ui.histFilter : null;
  const chips = names.length > 1 || f ? `<div class="cat-chips hist-filter">${[...new Set(f ? [...names, f] : names)].map(nm => `<button class="chip${nm === f ? " on" : ""}" data-act="hist-filter" data-name="${esc(nm)}" aria-pressed="${nm === f}">${esc(nm)}</button>`).join("")}</div>` : "";
  const ws = [...S.workouts].reverse();
  let list;
  if (!ws.length) list = `<div class="card muted">Noch keine Trainings gespeichert. Starte eins im Tab „Training“.</div>`;
  else if (f){ const hit = ws.filter(w => w.name === f); list = `<div class="hist-head">${esc(f)} · ${hit.length} ${hit.length === 1 ? "Training" : "Trainings"}</div>${hit.map(card).join("")}`; }
  else {
    const groups = [];
    ws.forEach(w => { const g = histGroup(w.date), last = groups[groups.length - 1]; if (last && last.key === g.key) last.ws.push(w); else groups.push({...g, ws:[w]}); });
    list = groups.map(g => {
      const n = g.ws.length, sets = g.ws.reduce((t, w) => t + w.entries.reduce((u, e) => u + e.sets.length, 0), 0);
      const sum = `${n} ${n === 1 ? "Training" : "Trainings"} · ${sets} ${sets === 1 ? "Satz" : "Sätze"}`;
      if (g.fixed) return `<div class="hist-head">${g.title} <span class="muted">· ${sum}</span></div>${g.ws.map(card).join("")}`;
      const open = ui.openGroups.has(g.key);
      return `<button class="hist-group row between" data-act="hist-group" data-key="${g.key}" aria-expanded="${open}"><span><b>${esc(g.title)}</b> <span class="muted">· ${sum}</span></span><span class="muted">${open ? "▾" : "›"}</span></button>
        ${open ? `<div class="hist-open">${g.ws.map(card).join("")}</div>` : ""}`;
    }).join("");
  }
  return `<div class="row between"><h1>Verlauf</h1>${ws.length > 4 ? `<button class="small ghost" data-act="to-settings">↓ Einstellungen</button>` : ""}</div>${chips}${list}
  <h2 id="settings">Einstellungen</h2>
  <div class="card"><div class="row between"><span>Pausen-Timer</span>
    <select data-setting="rest" style="width:auto">${[45,60,90,120,150,180,240].map(s => `<option value="${s}" ${S.settings.rest == s ? "selected" : ""}>${fmtSec(s)}</option>`).join("")}</select></div>
    <p class="muted" style="margin:8px 0 0">Bei Vorlagen aus einem Programm gilt die Pause des Programms.</p>
  </div>
  <h2>Daten & Backup</h2>
  <div class="card">${vStatus()}
    <div class="grid2"><button data-act="exp-json">Backup (JSON)</button><button data-act="exp-csv">Export (CSV)</button></div>
    <button class="block" style="margin-top:8px" data-act="imp">Backup wiederherstellen</button>
  </div>`;
}

function vSheet(s){

    // passende Alternativen stehen jeweils oben

    if (s.target === "link") return `<div class="sheet-head"><button class="ghost" data-act="close">Zurück</button><b>Mit Bibliothek verknüpfen</b><span style="width:60px"></span></div>

    <input id="pick-q" placeholder="Suchen …" autocomplete="off">
    ${onlyLib ? "" : `<button class="small ghost accent" style="margin-top:6px;padding-left:0" data-act="to-lib">↓ Zur Übungsbibliothek</button>`}
    <p class="muted" id="pick-none" style="margin-top:12px" hidden>${onlyLib ? "Keine passende Übung in der Bibliothek." : "Keine passende Übung. Über „Neu“ legst du eine eigene an."}</p>
    <div id="pick-list">${swap ? vSwapAlt(swapId, [...inWorkout]) : onlyLib ? "" : vRecent(inWorkout)}${onlyLib ? "" : groupByCat(S.exercises).map(([cat, list]) => `<div class="grp"><h2>${esc(cat)}</h2>
      ${list.map(e => `<button class="li row between" data-act="picked" data-id="${e.id}" data-name="${ownKey(e)}"><span>${esc(e.name)}</span>${inWorkout.has(e.id) ? `<span class="muted">✓ drin</span>` : ""}</button>`).join("")}</div>`).join("")}
      ${onlyLib ? `<p class="muted">Tippen übernimmt die Übung in deine Liste.</p>` : `<h2 class="lib-title">Aus der Bibliothek</h2>`}${vLibList()}</div>`;
  }
  if (s.kind === "template"){
    const d = s.draft;
    return `<div class="sheet-head"><button class="ghost" data-act="close">Abbrechen</button><b>${d.isNew ? "Neue Vorlage" : "Vorlage"}</b><button class="ghost accent" data-act="save-tpl">Sichern</button></div>

    if (lib.state === "idle") loadLib();
    const tech = libOf(d);   // Technik-Hinweise aus der Bibliothek, falls die Übung dort steht (gespeicherte ID oder gleicher Name)
    const inTraining = s.from === "training";   // aus dem Training geöffnet (Idee 53): Erfassungsart nur als Text, kein Löschen
    // Kategorie mit einem Tipp (Idee 62): vorhandene Kategorien als Knöpfe, das Feld bleibt für neue
    const fCat = `<label class="lbl">Kategorie</label><input data-draft="cat" list="cats" value="${esc(d.cat)}" placeholder="z. B. Brust" autocomplete="off">
    <datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist>
    ${cats.length ? `<div class="cat-chips">${cats.map(c => `<button class="chip${c === String(d.cat || "").trim() ? " on" : ""}" data-act="cat-pick" data-cat="${esc(c)}" aria-pressed="${c === String(d.cat || "").trim()}">${esc(c)}</button>`).join("")}</div>` : ""}`;
    const fName = `<label class="lbl">Name</label><input data-draft="name" value="${esc(d.name)}" placeholder="z. B. Bankdrücken" autocomplete="off">`;
    const fType = `<label class="lbl">Erfassung</label>${inTraining ? `<div class="ex-type">${esc((TYPES[d.type] || TYPES.kraft).label)}</div>`
      : `<select data-draft="type">${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${d.type === k ? "selected" : ""}>${t.label}</option>`).join("")}</select>`}`;
    const fLink = lib.state === "ready" ? `<div class="lib-link row between"><span class="muted grow">${tech ? `Bibliothek: ${esc([tech.name, ...(tech.geraet || []).slice(0, 1), ...(tech.muskeln || []).slice(0, 1)].join(" · "))}` : "Nicht mit der Bibliothek verknüpft"}</span>
      <button class="small ghost accent" data-act="ex-link">${tech ? "Ändern" : "Verknüpfen"}</button></div>` : "";
    const fNote = `<label class="lbl">Notiz (steht im Training unter dem Namen)</label><input data-draft="note" value="${esc(d.note || "")}" placeholder="z. B. Sitz Stufe 4, enger Griff" maxlength="140" autocomplete="off">`;
    const vTech = tech && tech.hinweise && tech.hinweise.length ? `<h2>Technik</h2><ul class="hints">${tech.hinweise.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : "";
    const vHist = list => list.length ? `<div class="list" style="padding:0">${list.map(w => `<div class="li"><div class="muted">${fmtDate(w.date)} · ${esc(w.name)}</div><div>${esc(fmtSets(exType(d.id), w.entries.find(e => e.exId === d.id).sets))}</div></div>`).join("")}</div>` : `<p class="muted">Noch nicht trainiert.</p>`;
    const head = `<div class="sheet-head"><button class="ghost" data-act="close">Abbrechen</button><b${inTraining ? ` id="sheet-rest"${restLabel() !== "Übung" ? ` class="resting"` : ""}` : ""}>${inTraining ? restLabel() : d.isNew ? "Neue Übung" : "Übung"}</b><button class="ghost accent" data-act="save-ex">Sichern</button></div>`;
    if (inTraining){
      // Aus dem Training (Idee 59): zuerst, was man zwischen zwei Sätzen nachsieht – letzte Einheiten, Richtwert, Technik,
      // Notiz, Kurve –, die Stammdaten am Ende. Die Kopfzeile zeigt die laufende Pause (tick()).
      const en = S.active && S.active.entries[s.i], plan = en && en.exId === d.id ? entryPlan(en) : null;
      return `${head}<div class="ex-sheet-name">${esc(d.name)}</div>
      <h2>Letzte Einheiten</h2>${vHist(hist.slice(0, 3))}
      ${vBests(d.id)}
      ${plan ? `<div class="plan">Programm: ${esc(libDose(plan))}</div>` : ""}
      ${vTech}${fNote}
      ${chart ? `<h2>Entwicklung</h2>${chart}` : ""}
      <h2>Übung bearbeiten</h2>${fName}${fCat}${fType}${fLink}`;
    }
    return `${head}${fName}${fCat}${fType}${fLink}${fNote}${vTech}
    ${d.isNew ? "" : `${vBests(d.id)}${chart ? `<h2>Entwicklung</h2>${chart}` : ""}
      <h2>Letzte Einheiten</h2>
      ${vHist(hist)}
      ${hist.length ? `<button class="block ghost" style="margin-top:14px" data-act="ex-transfer">Verlauf übertragen auf …</button>` : ""}
      <button class="block ghost danger" style="margin-top:${hist.length ? 4 : 14}px" data-act="del-ex">Übung löschen</button>`}`;
  }
  if (s.kind === "programs"){
    const head = `<div class="sheet-head"><button class="ghost" data-act="close">Fertig</button><b>Programme</b><span style="width:60px"></span></div>`;
    if (lib.state !== "ready"){ loadLib(); return head + `<p class="muted">${lib.state === "error" ? "Die Programme sind gerade nicht erreichbar." : "Lade Programme …"}</p>`; }
    return head + `<p class="muted">Jede Einheit lässt sich als Vorlage übernehmen. Fehlende Übungen kommen dabei in deine Liste. Sätze, Wiederholungen und Pausen stehen hier als Richtwert.</p>
    ${lib.progs.map(p => { const open = s.open === p.id, days = (p.tageProWoche || []).join(" oder ");
      return `<div class="card prog"><button class="li row between" data-act="prog-open" data-id="${esc(p.id)}" aria-expanded="${open}">
        <span class="grow"><span class="ex-name" style="display:block">${esc(p.name)}</span><span class="muted">${days ? `${days} Tage pro Woche · ` : ""}${esc((p.erfahrung || []).join(", "))}</span>${(n => n ? `<span class="prog-taken">✓ ${n} von ${p.einheiten.length} übernommen</span>` : "")(p.einheiten.filter(u => S.templates.some(t => t.lib === u.id)).length)}</span>
        <span class="muted">${open ? "▾" : "▸"}</span></button>
        ${open ? `<p class="muted prog-desc">${esc(p.beschreibung || "")}</p>${p.einheiten.map(u => vUnit(p, u)).join("")}` : ""}</div>`; }).join("")}`;
  }
  if (s.kind === "edit-w"){
    // Gespeichertes Training nachträglich korrigieren; geändert wird erst mit „Sichern“ (Entwurf in s.draft)
    const d = s.draft;
    return `<div class="sheet-head"><button class="ghost" data-act="close">Abbrechen</button><b>Bearbeiten</b><button class="ghost accent" data-act="save-w">Sichern</button></div>
    <label class="lbl">Name</label><input data-draft="name" value="${esc(d.name)}" autocomplete="off">
    <div class="ew-when"><div><label class="lbl">Beginn</label><input type="datetime-local" data-draft="when" value="${esc(d.when)}" max="${toLocalInput(Date.now())}"></div>
      <div><label class="lbl">Dauer (min)</label><input inputmode="numeric" data-draft="mins" data-sel="1" value="${esc(d.mins)}" placeholder="–" autocomplete="off"></div></div>
    ${d.entries.map(vEditEntry).join("")}
    <button class="block" style="margin-top:12px" data-act="pick" data-target="edit-w">+ Übung hinzufügen</button>
    <p class="muted">Leere Sätze fallen beim Sichern weg. Rekorde, Kampfkraft und Kurven rechnen sich danach neu.</p>`;
  }
  if (s.kind === "text"){
    return `<div class="sheet-head"><button class="ghost" data-act="close">Fertig</button><b>${esc(s.title)}</b><button class="ghost accent" data-act="copy-text">Kopieren</button></div>
    <p class="muted">${esc(s.hint)}</p><textarea id="text-out" readonly>${esc(s.text)}</textarea>`;
  }
  if (s.kind === "progress"){
    const p = progress(S.workouts), got = ACHIEVEMENTS.filter(a => a[2](p));
    return `<div class="sheet-head"><button class="ghost" data-act="close">Fertig</button><b>Fortschritt</b><span style="width:60px"></span></div>
    <div class="lvl-box">${vLevel(p)}<span class="muted">Noch ${fmtInt(levelFloor(p.level + 1) - p.power)} Kampfkraft bis Stufe ${p.level + 1}${rankOf(p.level + 1) !== rankOf(p.level) ? `: ${rankOf(p.level + 1)}` : ""}</span></div>
    <div class="stats">
      <div class="stat"><b>${fmtInt(p.n)}</b><span>Trainings</span></div>
      <div class="stat"><b>${fmtInt(p.sets)}</b><span>Sätze</span></div>
      <div class="stat"><b>${weeks(p.streak)}</b><span>Serie, längste: ${weeks(p.bestStreak)}</span></div>
      <button class="stat" data-act="to-recs"><b>${fmtInt(p.records)}</b><span>Rekorde ›</span></button>
    </div>
    <h2>Kalender</h2>${vCalendar(s.cal || 0, s.day)}
    ${vStrengthTrend(s.allTrend)}
    ${vWeekCompare()}
    ${vRecentRecords(s.allRec)}
    <h2>Erfolge (${got.length} von ${ACHIEVEMENTS.length})</h2>
    <div class="list" style="padding:0">${ACHIEVEMENTS.map(a => vBadge(a, got.includes(a))).join("")}</div>
    <p class="muted" style="margin-top:14px">Kampfkraft gibt es für jeden gespeicherten Satz. Mehr Gewicht, Wiederholungen, Minuten oder Kilometer bringen mehr. Die Serie zählt die Wochen in Folge mit mindestens einem Training.</p>`;
  }
  if (s.kind === "result"){
    return `<div class="sheet-head"><span style="width:60px"></span><b>Training geschafft</b><button class="ghost accent" data-act="close">Weiter</button></div>
    <div class="gain"><b>+${fmtInt(s.power)}</b><span>Kampfkraft</span></div>
    ${s.level ? `<p class="levelup">Stufe ${s.level} erreicht: ${rankOf(s.level)}</p>` : ""}
    <div class="lvl-box">${vLevel(progress(S.workouts))}</div>
    ${s.records.length ? `<h2>${s.records.length === 1 ? "Neuer Rekord" : "Neue Rekorde"}</h2>
      <div class="list" style="padding:0">${s.records.map(r => `<div class="li row between"><span>${esc(r.name)}</span><span><b>${fmtNum(r.v)} ${r.unit}</b> <span class="muted">vorher ${fmtNum(r.old)}</span></span></div>`).join("")}</div>` : ""}
    ${s.better && s.better.length ? `<h2>Besser als letztes Mal</h2>
      <div class="list" style="padding:0">${s.better.map(b => `<div class="li row between"><span>${esc(b.name)}</span><b class="better">${b.goal ? "✓ " : ""}${esc(b.label)}</b></div>`).join("")}</div>` : ""}
    ${s.earned.length ? `<h2>${s.earned.length === 1 ? "Neuer Erfolg" : "Neue Erfolge"}</h2>
      <div class="list" style="padding:0">${s.earned.map(a => vBadge(a, true)).join("")}</div>` : ""}
    ${vBackupDue()}
    <button class="block primary" style="margin-top:18px" data-act="close">Weiter</button>`;
  }
  if (s.kind === "import"){
    return `<div class="sheet-head"><button class="ghost" data-act="close">Abbrechen</button><b>Backup wiederherstellen</b><span style="width:70px"></span></div>
    <p class="muted">Wähle eine Backup-Datei (JSON) oder füge den Backup-Text ein. Achtung: Die aktuellen Daten werden ersetzt.</p>
    <button class="block" data-act="imp-file">Datei auswählen</button>
    <label class="lbl">… oder Text einfügen</label><textarea id="imp-text" placeholder='{"v":1, …}'></textarea>
    <button class="block primary" style="margin-top:10px" data-act="imp-text">Wiederherstellen</button>`;
  }
  return "";
}

/* ---------- Render ---------- */
// Solange S fehlt: Ladehinweis bzw. Fehlermeldung, wenn die Datenbank nicht geöffnet werden konnte.
function vBoot(){
  if (!bootErr) return `<p class="muted" style="text-align:center;margin-top:38vh">Lade …</p>`;
  return `<h1>Trainingslog</h1>
  <div class="card"><p>Der Datenspeicher lässt sich gerade nicht öffnen.</p>
    <p class="muted">Vorhandene Daten bleiben unangetastet. Das kann z. B. im privaten Modus des Browsers passieren.</p>
    <p class="muted">${esc(bootErr.message || bootErr)}</p>
    <button class="block primary" data-act="reload">Erneut versuchen</button></div>`;
}
function render(){
  if (!S){ $("#main").innerHTML = vBoot(); return; }
  const views = {training:vTraining, vorlagen:vTemplates, uebungen:vExercises, verlauf:vHistory};
  const noStore = store.status === "off" ? `<div class="status warn" style="margin:10px 0 0"><i></i><span>Vorschau ohne Speicher – Eingaben gehen beim Schließen verloren.</span></div>` : "";
  const bar = $(".hist-filter"), barX = bar ? bar.scrollLeft : 0;   // Filterleiste im Verlauf behält ihre Wischposition
  $("#main").innerHTML = noStore + views[ui.tab]();
  if (barX && $(".hist-filter")) $(".hist-filter").scrollLeft = barX;
  document.querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === ui.tab);
    b.classList.toggle("live", b.dataset.tab === "training" && !!S.active);
  });
  const sh = $("#sheet"), wasOpen = sh.classList.contains("open"), oldPanel = sh.querySelector(".panel"), st = oldPanel ? oldPanel.scrollTop : 0;
  if (ui.sheet){
    sh.innerHTML = `<div class="backdrop" data-act="close"></div><div class="panel${wasOpen ? "" : " anim"}${ui.sheet.kind === "picker" ? " tall" : ""}">${vSheet(ui.sheet)}</div>`;
    sh.classList.add("open");
    if (wasOpen && ui.sheet === lastSheet) sh.querySelector(".panel").scrollTop = st;
  } else { sh.innerHTML = ""; sh.classList.remove("open"); }
  lastSheet = ui.sheet;
  if (ui.sheet && ui.sheet.kind === "picker" && ui.sheet.q){ $("#pick-q").value = ui.sheet.q; filterPick(ui.sheet.q); }
  tick();
  keepAwake();
}
let lastSheet = null;

/* Bildschirm wachhalten, solange ein Training läuft (Screen Wake Lock; auf dem iPhone in der installierten App ab iOS 18.4).
   Wird nach jedem render() und bei der Rückkehr in die App aufgerufen. Der Browser gibt die Sperre beim Wechsel
   in eine andere App selbst frei; ohne Unterstützung passiert nichts. */
let wakeLock = null, wakeBusy = false;
function keepAwake(){
  if (!("wakeLock" in navigator)) return;
  const want = !!(S && S.active) && document.visibilityState === "visible";
  if (!want){ if (wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; } return; }
  if (wakeBusy || (wakeLock && !wakeLock.released)) return;
  wakeBusy = true;
  navigator.wakeLock.request("screen")
    .then(l => { wakeLock = l; }, () => { wakeLock = null; })
    .finally(() => { wakeBusy = false; if (!(S && S.active)) keepAwake(); });   // Training inzwischen beendet: gleich wieder freigeben
}

// Titel des Übungs-Sheets aus dem Training (Idee 59): die laufende Pause, sonst „Übung“
function restLabel(){ const rem = Math.ceil((timer.end - Date.now()) / 1000); return timer.end && rem > 0 ? `Pause ${Math.floor(rem/60)}:${String(rem%60).padStart(2,"0")}` : "Übung"; }
function tick(){
  const el = $("#elapsed"), sr = $("#sheet-rest");
  if (sr){ const t = restLabel(); if (sr.textContent !== t){ sr.textContent = t; sr.classList.toggle("resting", t !== "Übung"); } }
  if (el && S.active){ const m = Math.floor((Date.now() - S.active.date) / 60000); el.textContent = m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`; }
  const tb = $("#timer");
  if (!timer.end){ tb.classList.remove("show","over"); return; }
  const remMs = timer.end - Date.now(), rem = Math.ceil(remMs / 1000);
  tb.classList.add("show");
  if (rem <= 0){
    if (!timer.rang){ timer.rang = true; try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){} }
    tb.classList.add("over"); $("#tlabel").textContent = "Pause vorbei"; $("#ttime").textContent = "Nächster Satz!"; $("#tfill").style.width = "100%";
    if (rem <= -8){ timer.end = 0; tb.classList.remove("show","over"); }
    return;
  }
  tb.classList.remove("over");
  $("#tlabel").textContent = timer.src ? `Pause · ${timer.src}` : "Pause";
  $("#ttime").textContent = `${Math.floor(rem/60)}:${String(rem%60).padStart(2,"0")}`;
  $("#tfill").style.width = `${Math.min(100, 100 * (1 - remMs / (timer.total * 1000)))}%`;
}
setInterval(tick, 250);

/* ---------- Export / Import ---------- */
const stamp = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0,10); };   // heutiges Datum in Ortszeit
// at: Zeitpunkt dieses Backups. Er steht im Backup als settings.lastBackup, damit nach einem Import klar ist, wie aktuell die Daten gesichert sind.
function backupJson(at = Date.now()){ return JSON.stringify({...S, settings:{...S.settings, lastBackup:at}, active:null, exportedAt:new Date(at).toISOString()}, null, 1); }
// Nach einem Backup, das wirklich gespeichert oder geteilt wurde.
function markBackup(at){
  S.settings.lastBackup = at; save();
  if (ui.tab === "verlauf" || (ui.sheet && ui.sheet.kind === "result")) render();
}
/* Ist ein Backup fällig? Nur wenn es seit dem letzten Backup neue Trainings gibt und das Backup mehr als 14 Tage
   zurückliegt oder 10 Trainings fehlen. Ohne Backup zählen die 14 Tage ab dem ersten noch ungesicherten Training. */
function backupDue(){
  const now = Date.now(), last = Math.min(S.settings.lastBackup || 0, now);   // ein Zeitpunkt in der Zukunft (falsche Uhr) zählt als jetzt
  const open = S.workouts.filter(w => (w.end || w.date) > last);
  if (!open.length || store.status === "off") return null;
  const days = Math.round((dayStart(now) - dayStart(last || open[0].date)) / 864e5);   // Kalendertage wie relDay()
  return open.length >= 10 || days >= 14 ? {count:open.length, days, never:!last} : null;
}
function vBackupDue(){
  const due = backupDue();
  if (!due) return "";
  const n = due.count === 1 ? "1 Training ist" : `${due.count} Trainings sind`;
  return `<div class="backup-due"><p>${due.never ? `Noch kein Backup gesichert. ${n} nur auf diesem Gerät gespeichert.` : `Letztes Backup vor ${due.days} ${due.days === 1 ? "Tag" : "Tagen"}. ${n} noch nicht gesichert.`}</p>
    <button class="block" data-act="exp-json">Jetzt sichern</button></div>`;
}
function csv(){
  // Neue Spalten nur hinten anhängen, damit bestehende Auswertungen der CSV weiter passen
  const rows = [["Datum","Training","Übung","Kategorie","Satz","Gewicht_kg","Wiederholungen","Minuten","km","Tempo_min_km"]];
  S.workouts.forEach(w => w.entries.forEach(e => {
    const ex = exById(e.exId) || {name:"Gelöschte Übung", cat:"", type:"kraft"};
    e.sets.forEach((s, i) => rows.push([new Date(w.date).toLocaleDateString("de-DE"), w.name, ex.name, ex.cat || "", i + 1,
      ex.type === "kraft" ? s.a : "", ex.type === "kraft" ? s.b : "", ex.type !== "kraft" ? s.a : "", ex.type === "ausdauer" ? s.b : "",
      ex.type === "ausdauer" ? paceOf(s) : ""]));
  }));
  return "﻿" + rows.map(r => r.map(c => { c = String(c ?? ""); return /[;"\n]/.test(c) ? `"${c.replace(/"/g,'""')}"` : c; }).join(";")).join("\n");
}
/* Gibt einen Export als Datei heraus:
   1. auf dem Handy über das Teilen-Menü (dort z. B. „In Dateien sichern“),
   2. sonst als normalen Datei-Download,
   3. und wo beides nicht geht, als Text zum Kopieren. */
// Ergebnis: "shared", "downloaded", "text" (zum Kopieren angezeigt) oder "cancelled". backupAt: nur beim Backup, siehe "copy-text".
async function offerFile(filename, data, type, title, backupAt){
  const file = new File([data], filename, {type});
  const touch = !!window.matchMedia && matchMedia("(pointer: coarse)").matches;
  if (touch && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file]}); return "shared"; }
    catch(e){ if (e && e.name === "AbortError") return "cancelled"; console.warn("Teilen fehlgeschlagen:", e); }   // abgebrochen: nichts tun
  }
  // In der vom iPhone-Home-Bildschirm gestarteten App ist der Datei-Download nicht verlässlich, dort lieber gleich der Text.
  if ("download" in HTMLAnchorElement.prototype && navigator.standalone !== true){
    const url = URL.createObjectURL(file), a = document.createElement("a");
    a.href = url; a.download = filename; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast("Download gestartet");
    return "downloaded";
  }
  ui.sheet = {kind:"text", title, backupAt, text:data.replace(/^﻿/, ""), hint:"Kopiere den Text und speichere ihn z. B. in der Notizen- oder Dateien-App."};
  render();
  return "text";
}
function applyImport(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ toast("Das ist kein gültiges Backup"); return; }
  if (!d || !Array.isArray(d.exercises) || !Array.isArray(d.workouts)){ toast("Backup unvollständig"); return; }
  ask(`Backup mit ${d.workouts.length} Trainings laden? Die aktuellen Daten werden ersetzt.`, "Laden", true).then(ok => {
    if (!ok) return;
    const before = new Set(S.workouts.map(w => w.id));
    S = normalize(d); S.active = null; stopTimer(); undoDel = null;   // eine laufende Pause gehört zum ersetzten Training
    // Ältere Backups kennen settings.lastBackup noch nicht: Die geladenen Daten sind auf dem Stand ihres Exports gesichert.
    if (!S.settings.lastBackup && Date.parse(d.exportedAt) > 0) S.settings.lastBackup = Date.parse(d.exportedAt);
    const now = new Set(S.workouts.map(w => w.id));
    S.deleted = [...new Set([...(S.deleted || []), ...[...before].filter(id => !now.has(id))])];
    save({all:true});
    ui.sheet = null; ui.tab = "verlauf"; render(); toast("Backup geladen");
  });
}

/* ---------- Actions ---------- */
const actions = {
  tab: el => { ui.tab = el.dataset.tab; ui.sheet = null; render(); window.scrollTo(0, 0); },
  start: el => {
    const t = S.templates.find(x => x.id === el.dataset.id);
    S.active = {id:uid(), date:Date.now(), name:t ? t.name : "Freies Training", entries:(t ? t.ex : []).filter(exById).map(id => newEntry(id, planOf(t, id)))};
    save(); render(); window.scrollTo(0, 0);
  },
  discard: async () => { if (await ask("Training verwerfen? Nichts davon wird gespeichert.", "Verwerfen", true)){ S.active = null; stopTimer(); save(); render(); } },
  finish: async () => {
    const a = S.active;
    const entries = a.entries.map(e => ({exId:e.exId, sets:e.sets.filter(s => s.done).map(s => ({a:s.a, b:s.b}))})).filter(e => e.sets.length);
    if (!entries.length){
      if (await ask("Du hast noch keinen Satz abgehakt. Training ohne Speichern beenden?", "Beenden", true)){ S.active = null; stopTimer(); save(); render(); }
      return;
    }
    const open = a.entries.reduce((n, e) => n + e.sets.filter(s => !s.done).length, 0);
    if (open && !(await ask(`${open} ${open === 1 ? "Satz ist" : "Sätze sind"} nicht abgehakt und werden nicht gespeichert. Trotzdem beenden?`, "Beenden"))) return;
    const w = {id:a.id, date:a.date, end:Date.now(), name:a.name, entries};
    // Vergleich mit dem letzten Mal: vor dem Speichern, solange lastFor() noch die vorige Einheit liefert
    const better = a.entries.map(e => { const sets = e.sets.filter(s => s.done); if (!sets.length) return null;
      const bt = betterThanLast({exId:e.exId, sets}, entryPlan(e));
      // Bestleistung (Idee 74): bei mehreren die mit dem höchsten Gewicht
      const ps = exType(e.exId) === "kraft" ? priorSets(e.exId) : null;
      const bests = ps ? sets.map(x => bestEffort(e.exId, x, ps.prior, ps.recentTop)).filter(Boolean) : [];
      const be = bests.length ? bests.reduce((p, q) => q.kg > p.kg || (q.kg === p.kg && q.reps > p.reps) ? q : p) : null;
      if (!be) return bt;
      const label = `Bestleistung ${fmtNum(be.kg)} kg × ${fmtNum(be.reps)}`;
      return bt ? {...bt, label:`${bt.label} · ${label}`} : {name:exName(e.exId), label};
    }).filter(Boolean);
    const before = progress(S.workouts);
    S.workouts.push(w); S.active = null; stopTimer(); save({put:w.id});
    // Belohnung: was dieses Training gebracht hat
    const after = progress(S.workouts), gain = workoutGain(w, before.bests);
    ui.sheet = {kind:"result", power:gain.power, records:gain.records, better, level:after.level > before.level ? after.level : 0, earned:ACHIEVEMENTS.filter(x => x[2](after) && !x[2](before))};
    ui.tab = "verlauf"; ui.open = w.id; render(); window.scrollTo(0, 0); toast(store.status === "off" ? "Training beendet – nicht gespeichert" : "Training gespeichert 💪");
  },
  check: el => {
    const en = S.active.entries[+el.dataset.i], s = en.sets[+el.dataset.j];
    // Ein leerer Satz wird nicht abgehakt (sonst startet der Timer und ein leerer Satz landet im Training).
    // Kraft braucht Wdh (das Gewicht darf bei Körpergewicht fehlen), Ausdauer Minuten oder km, „nur Zeit“ Minuten.
    if (!s.done){
      const type = exType(en.exId), isFilled = x => filledSet(type, x);
      // Leerer Satz: die Werte des Satzes darüber übernehmen (ein Tipp für „noch einmal dasselbe“)
      const prev = en.sets[+el.dataset.j - 1];
      if (!isFilled(s) && prev && isFilled(prev) && !(s.a || s.b)){ s.a = prev.a; s.b = prev.b; }
      const filled = isFilled(s);
      if (!filled){
        toast(type === "kraft" ? "Erst die Wiederholungen eintragen" : type === "ausdauer" ? "Erst Minuten oder km eintragen" : "Erst die Minuten eintragen");
        // gleich ins fehlende Feld springen (spart einen Tipp)
        const miss = document.querySelector(`input[data-i="${el.dataset.i}"][data-j="${el.dataset.j}"][data-f="${type === "kraft" ? "b" : "a"}"]`);
        if (miss) miss.focus();
        return;
      }
    }
    s.done = !s.done; save();
    // Markierung: nach einem Haken der nächste offene Satz, nach dem Lösen der gelöste Satz selbst.
    // Vor dem Timer setzen, damit keepRest() sie mitspeichert; keepRest() danach auch ohne Pause (z. B. Ausdauer).
    ui.next = s.done ? nextOpen(+el.dataset.i, +el.dataset.j) : s;
    if (s.done && exType(en.exId) === "kraft"){ const r = restFor(en); startTimer(r.sec, s, r.src); }
    if (!s.done) undoTimer(s);   // versehentlicher Haken: die Pause davor kommt zurück
    keepRest();
    render();
    if (ui.next) revealNext(!en.sets.includes(ui.next));
    if (s.done){
      // Sofort melden, wenn der Satz den bisherigen Bestwert der Übung übertrifft (und nicht schon ein früherer Satz heute).
      const type = exType(en.exId), [unit, v] = setMark(type, s), best = (progress(S.workouts).bests[en.exId] || {})[unit] || 0;
      const today = Math.max(0, ...en.sets.filter(x => x !== s && x.done).map(x => { const m = setMark(type, x); return m[0] === unit ? m[1] : 0; }));
      if (best > 0 && v > best && v > today) toast(`Neuer Rekord: ${fmtNum(v)} ${unit} bei ${exName(en.exId)}`);
      else if (type === "kraft"){
        // Bestleistung (Idee 74): frühere Trainings und die schon abgehakten Sätze heute; einmal pro Übung und Training
        const ps = priorSets(en.exId), earlier = en.sets.filter(x => x !== s && x.done).map(x => ({kg:num(x.a), reps:num(x.b)})).filter(x => x.kg > 0 && x.reps > 0);
        const b = bestEffort(en.exId, s, [...ps.prior, ...earlier], ps.recentTop);
        if (b && !en.sets.some(x => x !== s && x.done && bestEffort(en.exId, x, ps.prior, ps.recentTop))) toast(`Bestleistung: ${fmtBest(b)} bei ${exName(en.exId)}`);
      }
    }
  },

  picked: async el => {
    const s = ui.sheet, id = el.dataset.id;
    if (s.target === "transfer"){ await transferHistory(s.back.draft.id, id, s); return; }
    if (s.target === "active"){ S.active.entries.push(newEntry(id)); save(); ui.sheet = null; render(); setTimeout(() => window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}), 30); }
    else if (s.target === "swap"){
      // Tauschen: Die neue Übung kommt an dieselbe Stelle. Sind schon Sätze abgehakt, bleiben sie bei der alten Übung,
      // deren offene Sätze entfallen, und die neue Übung übernimmt so viele Sätze, wie noch offen waren, direkt darunter.
      const a = S.active, k = s.i, old = a && a.entries[k];
      if (!old || old.exId === id){ ui.sheet = null; render(); return; }
      if (a.entries.some(e => e.exId === id)){ toast(`„${exName(id)}“ ist schon in diesem Training`); return; }
      const own = planFor(id), planEx = own ? null : old.planEx || old.exId, inherit = planEx ? planFor(planEx) : null;
      const en = newEntry(id, own || inherit);
      if (inherit) en.planEx = planEx;   // Richtwert der ersetzten Übung (Programm-Platz) übernehmen
      const done = old.sets.filter(x => x.done), open = old.sets.length - done.length;
      if (done.length){
        if (open){ old.sets = done; en.sets = en.sets.slice(0, open); while (en.sets.length < open) en.sets.push({...en.sets[en.sets.length - 1], done:false}); }
        a.entries.splice(k + 1, 0, en);
      } else a.entries.splice(k, 1, en);
      save(); ui.sheet = null; render();
      toast(done.length && open ? `${open === 1 ? "Letzter Satz" : `Restliche ${open} Sätze`} mit „${exName(id)}“` : `„${exName(id)}“ statt „${exName(old.exId)}“`);
    }
    else if (s.target === "tpl-swap"){
      // In der Vorlage ersetzen, an derselben Stelle; den Programm-Richtwert gibt planOf() über den frei gewordenen Platz
      const d = s.back.draft;
      if (d.ex[s.k] === id){ ui.sheet = s.back; render(); return; }
      if (d.ex.includes(id)){ toast(`„${exName(id)}“ ist schon in der Vorlage`); return; }
      d.ex[s.k] = id; ui.sheet = s.back; render();
    }
    else if (s.target === "edit-w"){
      const d = s.back.draft;
      if (d.entries.some(e => e.exId === id)){ toast(`„${exName(id)}“ ist schon in diesem Training`); return; }
      d.entries.push({exId:id, sets:[{a:"", b:""}]}); ui.sheet = s.back; render();
      setTimeout(() => { const p = $("#sheet .panel"); if (p) p.scrollTop = p.scrollHeight; }, 30);
    }
    else if (s.back.draft.ex.includes(id)) toast(`„${exName(id)}“ ist schon in der Vorlage`);   // in Vorlagen keine Doppelten
    else { s.back.draft.ex.push(id); ui.sheet = s.back; render(); }
  },

  "save-tpl": async () => {
    const s = ui.sheet, d = s.draft;

    const {isNew, ...rest} = d;   // übrige Felder (z. B. lib) bleiben erhalten
    const t = {...rest, name:d.name.trim(), ex:d.ex}, cur = S.templates.find(x => x.id === d.id);
    // Umbenennen (Idee 50): „Zuletzt“, „Dran“ und der Programm-Richtwert hängen am Trainingsnamen. Nach Rückfrage
    // bekommen die gespeicherten Trainings mit dem alten Namen den neuen; nicht, wenn eine andere Vorlage noch so heißt.
    const old = cur ? cur.name : null, renamed = old !== null && old !== t.name;
    const sole = renamed && !S.templates.some(x => x.id !== d.id && x.name === old);   // nur diese Vorlage hieß so
    const mine = sole ? S.workouts.filter(w => w.name === old) : [];
    let carry = false;

      const taken = S.templates.some(x => x.id !== d.id && x.name === t.name) || S.workouts.some(w => w.name === t.name);

    if (sole && S.active && S.active.name === old) S.active.name = t.name;   // laufendes Training behält seinen Richtwert
    save(); ui.sheet = null; render();

  "ew-add-set": el => { const en = ui.sheet.draft.entries[+el.dataset.i], p = en.sets[en.sets.length - 1] || {}; en.sets.push({a:p.a ?? "", b:p.b ?? ""}); render(); },
  "ew-rm-set": el => { ui.sheet.draft.entries[+el.dataset.i].sets.splice(+el.dataset.j, 1); render(); },
  "ew-rm-entry": el => { ui.sheet.draft.entries.splice(+el.dataset.i, 1); render(); },
  "save-w": () => {
    const s = ui.sheet, d = s.draft, k = S.workouts.findIndex(w => w.id === d.id);
    if (k < 0){ ui.sheet = null; render(); toast("Dieses Training gibt es nicht mehr"); return; }
    const old = S.workouts[k], name = String(d.name || "").trim();
    if (!name){ toast("Bitte einen Namen eingeben"); return; }
    // Datum und Dauer nur übernehmen, wenn sie geändert wurden (das Eingabefeld kennt keine Sekunden)
    const date = d.when === s.when0 ? old.date : new Date(d.when).getTime();
    if (!(date > 0)){ toast("Bitte Beginn mit Datum und Uhrzeit angeben"); return; }
    if (date > Date.now()){ toast("Der Beginn liegt in der Zukunft"); return; }
    const mins = num(d.mins);
    if (String(d.mins).trim() && !(mins > 0 && mins <= 1440)){ toast("Dauer bitte in Minuten (1 bis 1440) oder leer lassen"); return; }
    // Nur ganz leere Sätze fallen weg. Nicht nach Erfassungsart filtern: Bei gelöschten Übungen ist die Art unbekannt,
    // und alte oder importierte Sätze (z. B. Gewicht ohne Wdh) sollen nicht verschwinden, nur weil man den Namen ändert.
    const blank = v => String(v ?? "").trim() === "";
    const entries = d.entries.map(e => ({...e, sets:e.sets.filter(x => !(blank(x.a) && blank(x.b)))})).filter(e => e.sets.length);
    if (!entries.length){ toast("Kein Satz mehr übrig. Zum Löschen „Training löschen“ nutzen."); return; }
    const w = {...old, name, date, entries};
    if (d.mins !== s.mins0) { if (mins > 0) w.end = date + Math.round(mins * 60000); else delete w.end; }
    else if (old.end) w.end = old.end + (date - old.date);   // Beginn verschoben: Ende rückt mit, Dauer bleibt
    S.workouts[k] = w;
    S.workouts.sort((x, y) => x.date - y.date);   // „Letztes Mal“, Rekorde und Serie lesen die Trainings nach Datum
    ui.openGroups.add(histGroup(w.date).key);   // liegt das Training jetzt in einer zugeklappten Woche: aufklappen
    if (ui.histFilter && ui.histFilter !== w.name) ui.histFilter = null;   // umbenannt: Filter aufheben, damit es sichtbar bleibt
    save({put:w.id}); ui.sheet = null; ui.open = w.id; render(); toast("Training geändert");
    // Hat sich die Position im Verlauf durch ein neues Datum verschoben: das Training wieder in den Blick holen
    const card = document.querySelector(`[data-act="toggle-w"][data-id="${CSS.escape(w.id)}"]`);
    if (card) card.closest(".card").scrollIntoView({block:"center"});
  },
  // Löschen nennt das Training und lässt sich bis zum nächsten Tipp an anderer Stelle zurücknehmen (Idee 71)
  "del-w": async el => {
    const id = el.dataset.id, w = S.workouts.find(x => x.id === id);
    if (!w) return;
    const n = w.entries.reduce((t, e) => t + e.sets.length, 0);
    if (!(await ask(`„${w.name}“ vom ${fmtDateLong(w.date)} löschen? ${n} ${n === 1 ? "Satz" : "Sätze"}`, "Löschen", true))) return;
    if (!S.workouts.includes(w)) return;
    S.workouts = S.workouts.filter(x => x !== w); S.deleted.push(id); save({del:id});
    undoDel = w; render();
    toast(`„${w.name}“ gelöscht · Rückgängig`, "undo-del-w", true);
    setTimeout(() => { if (undoDel === w) undoDel = null; }, 10500);   // nach dem Hinweis verfällt das Rückgängig
  },
  "undo-del-w": () => {
    const w = undoDel; undoDel = null;
    if (!w || S.workouts.some(x => x.id === w.id)) return;
    S.workouts.push(w); S.workouts.sort((x, y) => x.date - y.date);
    S.deleted = S.deleted.filter(id => id !== w.id);
    save({put:w.id}); ui.openGroups.add(histGroup(w.date).key); render(); toast(`„${w.name}“ wiederhergestellt`, null, true);
  },
  "exp-json": async () => {
    const at = Date.now(), r = await offerFile(`trainingslog-backup-${stamp()}.json`, backupJson(at), "application/json", "Backup (JSON)", at);
    if (r === "shared"){ markBackup(at); toast("Backup gesichert"); }
    else if (r === "downloaded") markBackup(at);
  },
  "exp-csv": () => { if (!S.workouts.length){ toast("Noch keine Trainings zum Exportieren"); return; } offerFile(`trainingslog-${stamp()}.csv`, csv(), "text/csv", "Export (CSV)"); },
  "copy-text": async () => {
    const t = $("#text-out");
    try { await navigator.clipboard.writeText(t.value); toast("Kopiert"); if (ui.sheet && ui.sheet.backupAt) markBackup(ui.sheet.backupAt); }
    catch(e){ t.focus(); t.select(); toast("Text markiert – jetzt „Kopieren“ wählen"); }
  },
  imp: () => { ui.sheet = {kind:"import"}; render(); },
  "imp-file": () => $("#imp-file").click(),
  "imp-text": () => applyImport($("#imp-text").value),
  "t-plus": () => shiftTimer(15),
  "t-minus": () => shiftTimer(-15),
  "t-skip": () => stopTimer(),
  "dlg-yes": () => closeDlg(true),
  "dlg-no": () => closeDlg(false),
  progress: () => { ui.sheet = {kind:"progress"}; render(); },
  cal: el => { if (ui.sheet && ui.sheet.kind === "progress"){ ui.sheet.cal = Math.min(0, (ui.sheet.cal || 0) + +el.dataset.d); ui.sheet.day = null; render(); } },
  "chart-range": el => { ui.chartRange = el.dataset.r; ui.chartPick = null; render(); },
  // Tipp auf die Kurve: nächster Punkt nach der x-Position; ein zweiter Tipp auf denselben Punkt hebt die Wahl auf
  "chart-pick": (el, e) => {
    const r = el.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
    const c = exSeries(el.dataset.ex), range = CHART_RANGES.find(x => x[0] === ui.chartRange) || CHART_RANGES[0];
    let pts = range[2] ? c.pts.filter(p => p.date >= Date.now() - range[2] * 864e5) : c.pts;
    if (pts.length < 6) pts = c.pts.slice(-6);
    if (pts.length < 2) return;
    const t0 = pts[0].date, span = Math.max(1, pts[pts.length - 1].date - t0), at = t0 + span * ((fx * 320 - 6) / 308);
    const p = pts.reduce((a, b) => Math.abs(b.date - at) < Math.abs(a.date - at) ? b : a);
    ui.chartPick = ui.chartPick === p.id ? null : p.id; render();
  },
  "cal-day": el => { const t = +el.dataset.t; ui.sheet.day = ui.sheet.day === t ? null : t; render(); },
  // Training aus dem Kalender im Verlauf zeigen: Gruppe aufklappen, Karte aufklappen und ins Bild holen
  "to-workout": el => { const w = S.workouts.find(x => x.id === el.dataset.id); if (!w) return;
    ui.sheet = null; ui.tab = "verlauf"; ui.histFilter = null; ui.open = w.id; ui.openGroups.add(histGroup(w.date).key); render();
    const c = document.querySelector(`[data-act="toggle-w"][data-id="${CSS.escape(w.id)}"]`); if (c) c.closest(".card").scrollIntoView({block:"start"}); },
  "to-recs": () => { const h = $("#recs"); if (h) h.scrollIntoView({behavior:"smooth", block:"start"}); },
  "trend-all": () => { ui.sheet.allTrend = !ui.sheet.allTrend; render(); },
  "recs-all": () => { ui.sheet.allRec = !ui.sheet.allRec; render(); },
  "rec-ex": el => { const e = exById(el.dataset.id); if (e) exSheet({...e}, {back:ui.sheet}); },
  reload: () => { saveNow(); location.reload(); }
};

document.addEventListener("click", e => {
  // Ein Hinweis unten mit „Rückgängig“ verschwindet beim nächsten Tipp an anderer Stelle, damit er keine Sätze verdeckt
  // und ein Tipp darauf nicht versehentlich etwas zurücknimmt
  const t = $("#toast");
  if (t.classList.contains("low") && t.classList.contains("show") && !e.target.closest("#toast")) t.classList.remove("show");
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  unlockAudio();
  const fn = actions[el.dataset.act];
  if (fn) fn(el, e);
});
let saveT = null;
/* Satzfelder im Training:
   - Beim Antippen wird der Inhalt markiert, die erste Ziffer ersetzt also den alten Wert (keine Löschtipps).
   - Was man in einem Satz einträgt, übernehmen die folgenden offenen Sätze derselben Übung, solange dort noch
     derselbe alte Wert oder nichts stand (link). Abgehakte und abweichende Sätze bleiben unverändert.
   Beides ändert nur Feldwerte, ohne render(), damit die Tastatur offen bleibt. */
let link = null, selFix = null, fresh = null;
const selectAll = t => { try { t.setSelectionRange(0, t.value.length); } catch(_){ t.select(); } };
document.addEventListener("focusin", e => {
  const t = e.target;
  if (t.dataset && (t.dataset.ef || t.dataset.sel)){   // Zahlenfelder beim Bearbeiten eines gespeicherten Trainings: markieren, aber nichts verknüpfen
    selFix = t; fresh = t; selectAll(t);
    setTimeout(() => { if (document.activeElement === t && fresh === t) selectAll(t); }, 0);
    return;
  }
  if (!t.dataset || !t.dataset.f || !S || !S.active) return;
  const i = +t.dataset.i, j = +t.dataset.j, f = t.dataset.f, en = S.active.entries[i];
  if (!en || !en.sets[j]) return;
  const orig = en.sets[j][f] ?? "";
  link = {en, j, f, ks:en.sets.map((s, k) => k > j && !s.done && ((s[f] ?? "") === orig || (s[f] ?? "") === "") ? k : -1).filter(k => k >= 0)};
  selFix = t; fresh = t;
  selectAll(t);   // sofort und noch einmal nach dem Antippen, weil manche Browser die Markierung beim Loslassen aufheben
  setTimeout(() => { if (document.activeElement === t && fresh === t) selectAll(t); }, 0);
});
document.addEventListener("focusout", e => { if (e.target.dataset && (e.target.dataset.f || e.target.dataset.ef || e.target.dataset.sel)){ link = null; fresh = null; } });
// Tippt man ein schon aktives Feld erneut an, will man den Cursor setzen: dann nichts mehr ersetzen
document.addEventListener("pointerdown", e => { if (fresh && e.target === fresh && document.activeElement === fresh) fresh = null; }, true);
// Sicherheitsnetz: Die erste Ziffer nach dem Antippen ersetzt den alten Wert immer, auch wenn die Markierung
// zu spät kam oder iOS sie aufgehoben hat (sonst würde z. B. aus „10“ unbemerkt „190“).
document.addEventListener("beforeinput", e => {
  const t = e.target;
  if (t !== fresh) return;
  fresh = null;
  const all = t.selectionStart === 0 && t.selectionEnd === t.value.length;
  if (e.inputType === "insertText" && e.data != null && t.value && !all){
    e.preventDefault();
    t.value = e.data; t.setSelectionRange(t.value.length, t.value.length);
    t.dispatchEvent(new Event("input", {bubbles:true}));
  }
});
// Das Loslassen nach dem Antippen würde die Markierung wieder aufheben: einmalig verhindern
document.addEventListener("mouseup", e => { if (selFix && e.target === selFix) e.preventDefault(); selFix = null; }, true);
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f && S.active){
    const i = +t.dataset.i, j = +t.dataset.j, f = t.dataset.f, en = S.active.entries[i], s = en?.sets[j];
    if (s){
      s[f] = t.value;
      if (link && link.en === en && link.j === j && link.f === f) link.ks.forEach(k => {
        const o = en.sets[k];
        if (!o || o.done) return;
        o[f] = t.value;
        const inp = document.querySelector(`input[data-i="${i}"][data-j="${k}"][data-f="${f}"]`);
        if (inp) inp.value = t.value;
      });
      clearTimeout(saveT); saveT = setTimeout(() => { saveT = null; save(); }, 400);
    }
  } else if (t.dataset.ef && ui.sheet?.kind === "edit-w"){
    const s = ui.sheet.draft.entries[+t.dataset.ei]?.sets[+t.dataset.ej];
    if (s) s[t.dataset.ef] = t.value;
  } else if (t.dataset.draft && ui.sheet?.draft){ ui.sheet.draft[t.dataset.draft] = t.value;
    // Kategorie getippt: die Markierung der Kategorie-Knöpfe folgt (Idee 62)
    if (t.dataset.draft === "cat") document.querySelectorAll(".cat-chips .chip").forEach(b => { const on = b.dataset.cat === t.value.trim(); b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  }
  else if (t.id === "pick-q"){ if (ui.sheet) ui.sheet.q = t.value; filterPick(t.value); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.draft && ui.sheet?.draft) ui.sheet.draft[t.dataset.draft] = t.value;
  if (t.dataset.setting){ S.settings[t.dataset.setting] = +t.value; save(); toast(`Pause: ${fmtSec(+t.value)}`); }
  if (t.id === "imp-file" && t.files[0]){ const r = new FileReader(); r.onload = () => applyImport(String(r.result)); r.readAsText(t.files[0]); t.value = ""; }
});
// Beim Verlassen der App (und bei der Rückkehr) alles Offene sofort sichern – iOS friert die Seite im Hintergrund ein.
function saveNow(){ if (saveT){ clearTimeout(saveT); saveT = null; save(); } flush(); }
document.addEventListener("visibilitychange", () => {
  saveNow(); tick(); keepAwake();
  // Im Hintergrund hält iOS das Audio an; der geplante Ton käme sonst verspätet. Bei der Rückkehr für die Restzeit neu planen.
  if (document.visibilityState === "hidden") cancelBeep();
  else if (timer.end > Date.now() && actx){ try { actx.resume(); } catch(e){} scheduleBeep((timer.end - Date.now()) / 1000); }
});
window.addEventListener("pagehide", saveNow);

/* ---------- Start ---------- */
async function boot(){
  const slow = setTimeout(render, 600);   // „Lade …“ nur zeigen, wenn es spürbar dauert
  try {
    const d = await loadDb();
    if (d.state) S = normalize({...d.state, workouts:d.workouts});
    else {
      // Erster Start mit IndexedDB: Daten des Prototyps aus localStorage übernehmen (Migration), sonst Startdaten anlegen.
      // Der alte localStorage-Eintrag bleibt als Sicherheitskopie liegen und wird danach nicht mehr gelesen.
      const old = loadLegacy();
      S = normalize(old);
      pending.state = true; S.workouts.forEach(w => pending.put.add(w.id));
      if (await flush() && old) toast("Bisherige Daten übernommen");
    }
  } catch(e){
    console.error("Start fehlgeschlagen:", e); closeDb();
    // Speicher in diesem Kontext grundsätzlich gesperrt (z. B. Datei-Vorschau ohne eigene Adresse): ohne Speichern weiterarbeiten.
    // Bei allen anderen Fehlern könnten Daten vorhanden sein – dann anhalten, statt mit leerem Stand zu starten.
    if (!window.indexedDB || (e && e.name === "SecurityError")){ S = normalize(loadLegacy()); store.status = "off"; }
    else bootErr = e;
  }
  clearTimeout(slow);
  restoreRest();   // laufende Pause aus dem gespeicherten Training übernehmen (Idee 38)
  render();
  if (S) loadLib();   // Übungsbibliothek im Hintergrund laden
  // Den Browser bitten, die Daten nicht von sich aus zu löschen (klappt v. a. bei installierter App).
  if (S && store.status !== "off" && navigator.storage && navigator.storage.persist){
    navigator.storage.persist().then(ok => { store.persisted = ok; if (ok && ui.tab === "verlauf" && !ui.sheet) render(); }, () => {});
  }
}
boot();

/* ---------- Service Worker (Offline-Betrieb; läuft nur über HTTPS oder localhost) ---------- */
if ("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data && e.data.type === "update") toast("Neue Version bereit – zum Laden tippen", "reload");
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("Service Worker nicht aktiv:", e)));
}
</script>
</body>
