<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Trainingslog</title>
<style>
:root{
  /* Kampfanzug-Palette: tiefes Blau als Grund, Orange für Aktionen, Gold für Energie, Grün für Messwerte, Tinte für Konturen */
  --bg:#0d1440; --card:#172165; --card2:#24338f; --well:#0a1036; --line:#34449f;
  --text:#fff8e7; --muted:#a9b5ea;
  --accent:#ff8a1f; --accent-hi:#ffa94d; --accent-deep:#e8590c; --accent-ink:#2a1000; --accent-shade:#8a3200;
  --ki:#ffd43b; --scan:#6dff9e; --ink:#060a26; --danger:#ff6b6b;
  /* Schräge, schmale Titelschrift: auf dem iPhone Avenir Next Condensed, sonst der nächste passende Systemfont */
  --display:"Avenir Next Condensed","Bahnschrift","Arial Narrow","Impact",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.35;
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
/* Aura hinter allem: blaues Leuchten von oben mit feinen Tempolinien */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(120% 55% at 50% -8%,rgba(78,112,255,.6),rgba(78,112,255,0) 70%),
    repeating-conic-gradient(from 0deg at 50% -18%,rgba(255,255,255,.04) 0deg 1.5deg,transparent 1.5deg 6deg);
  -webkit-mask-image:linear-gradient(#000,transparent 72%);mask-image:linear-gradient(#000,transparent 72%)}
main{padding:12px 16px calc(170px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
h1,h2,.ex-name,.ttime,.num,.tpl .t,.tpl .go,.sheet-head b,.hero-text b,.lvl b,.stat b,.gain b,.levelup,button.primary{font-family:var(--display);font-stretch:condensed;font-style:italic;font-weight:900}
h1{width:fit-content;max-width:100%;font-size:44px;line-height:.98;margin:6px 0 16px;padding:.12em .14em 0 0; /* Platz für Umlautpunkte und schräge Buchstaben */text-transform:uppercase;letter-spacing:.01em;
  color:var(--ki);background:linear-gradient(180deg,#fff3a6 0%,var(--ki) 36%,var(--accent) 72%,var(--accent-deep) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 16px rgba(255,138,31,.35))}
h2{font-size:18px;color:var(--ki);margin:24px 0 8px;letter-spacing:.01em}
p{margin:0 0 10px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 0 var(--ink)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:14px}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;background:var(--card2);border:0;border-radius:12px;padding:12px 14px;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 3px 0 var(--ink)}
button:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 var(--ink)}
button:disabled{opacity:.3}
button:focus-visible{outline:2px solid var(--ki);outline-offset:2px}
button.primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent) 45%,var(--accent-deep));color:var(--accent-ink);font-size:20px;letter-spacing:.02em;
  border:2px solid var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 0 var(--accent-shade);text-shadow:0 1px 0 rgba(255,255,255,.3)}
button.primary:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 var(--accent-shade)}
button.dangerbtn{background:linear-gradient(180deg,#ff8787,#f03e3e);color:#fff;font-weight:800;border:2px solid var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #7d1515}
button.dangerbtn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 0 #7d1515}
button.ghost{background:transparent;color:var(--muted);padding:8px 10px}
button.danger{color:var(--danger)}
button.accent{color:var(--accent);font-weight:800}
button.block{width:100%;display:block}
button.small{padding:8px 12px;font-size:14px;border-radius:10px}
button.ghost,button.li,button.tab{box-shadow:none}
.left{text-align:left}
input,select,textarea{font:inherit;font-size:17px;color:var(--text);background:var(--well);border:2px solid var(--line);border-radius:10px;padding:10px;width:100%;-webkit-appearance:none;appearance:none}
textarea{font-size:13px;font-family:ui-monospace,Menlo,monospace;min-height:160px;resize:vertical}
input:focus,select,textarea:focus{outline:none}
input:focus,textarea:focus{border-color:var(--ki);box-shadow:0 0 0 3px rgba(255,212,59,.22)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}

/* Start screen: sieben Sternkugeln, eine pro Training der letzten 7 Tage */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2233a0,var(--card) 62%);border:2px solid var(--ink);border-radius:16px;padding:16px 14px 13px;margin-bottom:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 var(--ink)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none; /* Rasterpunkte wie im Manga, nach links unten auslaufend */
  background:radial-gradient(circle,rgba(255,255,255,.16) 1.2px,transparent 1.7px) 0 0/9px 9px;
  -webkit-mask-image:radial-gradient(85% 130% at 100% 0,#000,transparent 62%);mask-image:radial-gradient(85% 130% at 100% 0,#000,transparent 62%)}
.hero.full{border-color:var(--ki);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 var(--ink),0 0 26px rgba(255,212,59,.55)}
.orbs{position:relative;z-index:1;display:flex;justify-content:space-between;gap:6px}
.orbs svg{flex:1;min-width:0;max-width:52px;height:auto;aspect-ratio:1}
.orbs svg.lit{filter:drop-shadow(0 0 6px rgba(255,160,40,.8))}
.hero-text{position:relative;z-index:1;flex-wrap:wrap;gap:2px 12px;margin-top:12px}
.hero-text b{font-size:24px;color:var(--ki);margin-right:2px}
button.hero{display:block;width:100%;text-align:left}
.lvl{position:relative;z-index:1;flex-wrap:wrap;gap:2px 12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.lvl b{font-size:21px;color:var(--ki);margin-right:2px}
.xp{position:relative;z-index:1;display:block;height:10px;margin:8px 3px 0;background:var(--well);border:1px solid var(--line);border-radius:3px;overflow:hidden;transform:skewX(-16deg)}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-deep),var(--accent) 40%,var(--ki))}
.hero-foot{position:relative;z-index:1;margin-top:9px;font-size:13px}

/* Fortschritt und Belohnung nach dem Training */
.lvl-box .lvl{border-top:0;margin-top:4px;padding-top:0}
.lvl-box .muted{display:block;margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stat{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;color:var(--ki)}
.stat span{color:var(--muted);font-size:13px}
.badge{gap:12px}
.badge svg{flex:none;width:36px;height:36px}
.badge svg.lit{filter:drop-shadow(0 0 5px rgba(255,160,40,.7))}
.badge b,.badge .muted{display:block}
.badge.off b{color:var(--muted)}
.gain{text-align:center;margin:8px 0 2px}
.gain b{display:block;font-size:64px;line-height:1;color:var(--ki);filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 18px rgba(255,212,59,.5))}
.gain span{color:var(--muted)}
.levelup{text-align:center;color:var(--accent);font-size:20px;margin:10px 0 0}
.backup-due{margin-top:18px;padding:12px;border:2px solid #ffb341;border-radius:12px;background:rgba(255,179,65,.08)}
.backup-due p{font-size:14px}
.tpl{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;text-align:left;background:var(--card);
  padding:14px 16px 14px 24px;margin-bottom:12px;border:2px solid var(--ink);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 4px 0 var(--ink)}
.tpl:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 2px 0 var(--ink)}
.tpl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:linear-gradient(180deg,var(--accent-hi),var(--accent-deep))} /* Gürtel */
.tpl .t{font-size:25px;line-height:1.05;letter-spacing:.01em}
.tpl .go{margin-top:8px;padding:3px 16px 4px 14px;font-size:16px;letter-spacing:.02em;color:var(--accent-ink);
  background:linear-gradient(180deg,var(--accent-hi),var(--accent-deep));border-radius:3px;transform:skewX(-10deg);box-shadow:2px 2px 0 var(--ink)}

/* Active workout */
.ex-name{font-size:22px;line-height:1.1;letter-spacing:.01em}
.last{font-size:13px;color:var(--scan);margin-top:4px}
/* Steigerungsvorschlag: schräger Knopf in Gold wie die Energieanzeigen */
button.step-up{margin-top:8px;padding:6px 14px 7px 12px;font-size:14px;font-weight:800;color:var(--accent-ink);border-radius:3px;transform:skewX(-10deg);
  background:linear-gradient(180deg,#fff3a6,var(--ki) 55%,var(--accent));box-shadow:2px 2px 0 var(--ink),0 0 12px rgba(255,212,59,.4)}
button.step-up:active{transform:skewX(-10deg) translateY(2px);box-shadow:0 0 0 var(--ink)}

/* Fortschrittskurve im Übungs-Sheet */
.chart{background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.chart svg{display:block;width:100%;height:auto;margin:8px 0 4px;overflow:visible}
.chart-now{font-family:var(--display);font-stretch:condensed;font-style:italic;font-weight:900;font-size:20px;color:var(--ki)}
.chart-line{fill:none;stroke:var(--ki);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart-best{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.chart-dot{fill:var(--well);stroke:var(--ki);stroke-width:2}
.chart-last{fill:var(--ki);stroke:var(--ink);stroke-width:1.5;filter:drop-shadow(0 0 5px rgba(255,212,59,.8))}
.chart-foot{font-size:12px}
.set{display:grid;gap:8px;align-items:center;margin-top:8px}
.set.head{margin-top:12px}
.set.head span{font-size:12px;font-weight:700;color:var(--muted);text-align:center}
.set input{text-align:center;padding:10px 4px;font-size:18px;font-weight:700}
.num{font-size:19px;color:var(--muted);text-align:center}
.check{height:48px;padding:0;border-radius:12px;font-size:20px;font-weight:800;color:var(--muted)}
.set.done .check{background:radial-gradient(circle at 35% 28%,#fff3a6,var(--ki) 45%,var(--accent) 100%);color:var(--accent-ink);box-shadow:0 3px 0 var(--accent-shade),0 0 14px rgba(255,212,59,.6)}
.set.done input{background:rgba(255,212,59,.12);border-color:rgba(255,212,59,.5);color:var(--ki)}
/* Bleibt beim Scrollen oben stehen und reicht bis unter die iPhone-Statusleiste */
.live-head{position:sticky;top:0;z-index:5;margin:calc(-1 * env(safe-area-inset-top)) -16px 10px;padding:calc(8px + env(safe-area-inset-top)) 16px 10px;
  background:rgba(13,20,64,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:2px solid var(--ink)}
.live-head h1{font-size:32px}

/* Lists */
.list{padding:0 14px}
.li{padding:13px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
button.li{background:none;border-radius:0;width:100%;text-align:left;padding:14px 0}
button.li:active{transform:none;opacity:.6}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Timer: die Pause lädt wie eine Energieleiste auf */
.timer{position:fixed;left:12px;right:12px;bottom:calc(74px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;
  background:linear-gradient(180deg,#26369a,var(--card));border:2px solid var(--ink);border-radius:16px;padding:12px 12px 14px;z-index:40;
  transform:translateY(170%);transition:transform .25s ease;box-shadow:0 5px 0 var(--ink),0 14px 30px rgba(0,0,0,.5);pointer-events:none}
.timer.show{transform:none;pointer-events:auto}
.timer.over{border-color:var(--ki);animation:aura 1s ease-in-out infinite alternate}
@keyframes aura{from{box-shadow:0 5px 0 var(--ink),0 0 8px rgba(255,212,59,.35)}to{box-shadow:0 5px 0 var(--ink),0 0 34px rgba(255,212,59,.95)}}
.bar{height:12px;margin:0 4px 10px;background:var(--well);border:1px solid var(--line);border-radius:3px;overflow:hidden;transform:skewX(-16deg)}
#tfill{height:100%;width:0;background:linear-gradient(90deg,#3bc9ff,#9af0ff 45%,var(--ki) 88%,#fff3a6)}
.ttime{font-size:34px;line-height:1;color:var(--ki);font-variant-numeric:tabular-nums}
.timer.over .ttime{font-size:24px}
.timer button{padding:9px 11px;font-size:14px}
#tlabel{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:rgba(8,12,44,.93);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:2px solid var(--ink);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0;position:relative;border-radius:0}
.tab:active{transform:none}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:-6px;left:50%;width:36px;height:4px;margin-left:-18px;background:var(--accent);transform:skewX(-24deg)}
.tab.live::after{content:"";position:absolute;top:3px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--ki);box-shadow:0 0 8px var(--ki)}

/* Sheet + dialog */
#sheet,#dlg{position:fixed;inset:0;display:none}
#sheet{z-index:60}#dlg{z-index:80}
#sheet.open,#dlg.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(3,5,22,.72)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);
  border-top:3px solid var(--accent);border-radius:20px 20px 0 0;padding:0 16px calc(28px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.panel.anim{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);padding:12px 0 8px;z-index:2}
.sheet-head b{font-size:21px}
.dlg-box{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);max-width:380px;margin:0 auto;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:18px;box-shadow:0 5px 0 var(--ink)}
.dlg-box p{font-size:16px;margin-bottom:16px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-170%);transition:transform .25s;z-index:90;
  background:var(--ink);color:var(--text);border:2px solid var(--ki);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.45);width:max-content;max-width:90vw}
#toast.show{transform:translate(-50%,0)}
#toast[data-act]{cursor:pointer;border-color:var(--accent);box-shadow:0 0 18px rgba(255,138,31,.6),0 8px 24px rgba(0,0,0,.45)}
.status{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);margin-bottom:12px}
.status i{flex:none;width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--muted)}
.status.ok i{background:var(--scan)}.status.warn i{background:#ffb341}
@media (prefers-reduced-motion:reduce){.timer.over,.panel.anim{animation:none}}
</style>
</head>
<body>
<main id="main"></main>

<!-- Farbverläufe für die Sternkugeln auf dem Startbildschirm (siehe orb()) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="orb-lit" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff3a6"/><stop offset=".35" stop-color="#ffc21f"/><stop offset=".8" stop-color="#ff8a1f"/><stop offset="1" stop-color="#d9480f"/></radialGradient>
  <radialGradient id="orb-off" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#3a49a8"/><stop offset="1" stop-color="#1b2570"/></radialGradient>
</defs></svg>

<div id="timer" class="timer" aria-live="polite">
  <div class="bar"><div id="tfill"></div></div>
  <div class="row between">
    <div><div id="tlabel">Pause</div><div id="ttime" class="ttime">0:00</div></div>
    <div class="row" style="gap:6px">
      <button data-act="t-minus">−15</button>
      <button data-act="t-plus">+15</button>
      <button data-act="t-skip">Weiter</button>
    </div>
  </div>
</div>

<nav class="tabs">
  <button class="tab" data-act="tab" data-tab="training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg><span>Training</span></button>
  <button class="tab" data-act="tab" data-tab="vorlagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span>Vorlagen</span></button>
  <button class="tab" data-act="tab" data-tab="uebungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>Übungen</span></button>
  <button class="tab" data-act="tab" data-tab="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Verlauf</span></button>
</nav>

<div id="sheet"></div>
<div id="dlg"></div>
<div id="toast"></div>
<input type="file" id="imp-file" accept=".json,application/json,text/plain" hidden>

<script>
"use strict";
/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const num = v => parseFloat(String(v ?? "").replace(",", ".")) || 0;
const fmtNum = n => String(Math.round(n * 100) / 100).replace(".", ",");
const fmtDate = t => new Date(t).toLocaleDateString("de-DE", {weekday:"short", day:"2-digit", month:"2-digit"});
const fmtDateLong = t => new Date(t).toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
const fmtSec = s => s < 60 ? `${s} s` : `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} min`;
const dayStart = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function relDay(t){ const d = Math.round((dayStart(Date.now()) - dayStart(t)) / 864e5); return d <= 0 ? "Heute" : d === 1 ? "Gestern" : `vor ${d} Tagen`; }

const TYPES = {
  kraft:    {label:"Kraft (Gewicht × Wdh)", f:[["a","kg","decimal"],["b","Wdh","numeric"]]},
  ausdauer: {label:"Ausdauer (Zeit + Strecke)", f:[["a","min","decimal"],["b","km","decimal"]]},
  zeit:     {label:"Nur Zeit", f:[["a","min","decimal"]]}
};

/* ---------- Data ---------- */
const LEGACY_KEY = "trainingslog-v1";   // localStorage-Eintrag des Prototyps, wird nur noch für die Migration gelesen
function seed(){
  const ex = (name, cat, type="kraft") => ({id:uid(), name, cat, type});
  const list = [
    ex("Bankdrücken","Brust"), ex("Schrägbankdrücken","Brust"), ex("Schulterdrücken","Schultern"), ex("Seitheben","Schultern"),

    ex("Laufen","Ausdauer","ausdauer"), ex("Padel-Drills","Padel","zeit")

  const by = n => list.find(e => e.name === n).id;

      {id:uid(), name:"Pull", ex:["Klimmzüge","Langhantelrudern","Latzug","Bizepscurls"].map(by)},

function loadLegacy(){ try { const s = localStorage.getItem(LEGACY_KEY); if (s) return JSON.parse(s); } catch(e){} return null; }
// Optionales Feld lastBackup: nur eine gültige Zahl behalten, sonst gilt „noch kein Backup“.
function cleanSettings(s){
  if (!(Number.isFinite(s.lastBackup) && s.lastBackup > 0)) delete s.lastBackup;
  return s;
}
function normalize(d){
  const b = seed();
  d = d && typeof d === "object" ? d : b;
  return {
    v:1, updatedAt:d.updatedAt || 0,
    exercises:Array.isArray(d.exercises) ? d.exercises : b.exercises,
    templates:Array.isArray(d.templates) ? d.templates : b.templates,
    workouts:(Array.isArray(d.workouts) ? d.workouts : []).filter(w => w && w.id).sort((x,y) => x.date - y.date),
    deleted:Array.isArray(d.deleted) ? d.deleted : [],
    active:d.active || null,
    settings:cleanSettings(Object.assign({rest:90}, d.settings || {}))
  };
}
let S = null;   // wird beim Start aus IndexedDB geladen, siehe boot()

const exById = id => S.exercises.find(e => e.id === id);
const exName = id => exById(id)?.name || "Gelöschte Übung";
const exType = id => exById(id)?.type || "kraft";

function lastFor(exId){
  for (let k = S.workouts.length - 1; k >= 0; k--){
    const w = S.workouts[k], en = w.entries.find(e => e.exId === exId);
    if (en && en.sets.length) return {date:w.date, sets:en.sets};
  }
  return null;
}
function fmtSets(type, sets){
  if (type === "ausdauer") return sets.map(s => `${s.a || "–"} min${s.b ? ` · ${s.b} km` : ""}`).join(" | ");
  if (type === "zeit") return sets.map(s => `${s.a || "–"} min`).join(" | ");
  const w = s => s.a ? `${s.a} kg` : "KG";
  const weights = new Set(sets.map(s => String(s.a)));
  if (sets.length > 1 && weights.size === 1) return `${w(sets[0])} × ${sets.map(s => s.b || "–").join(", ")}`;
  return sets.map(s => `${w(s)} × ${s.b || "–"}`).join(", ");
}
function newEntry(exId){
  const last = lastFor(exId);
  const sets = last ? last.sets.map(s => ({a:s.a ?? "", b:s.b ?? "", done:false}))
                    : Array.from({length: exType(exId) === "kraft" ? 3 : 1}, () => ({a:"", b:"", done:false}));
  return {exId, sets};
}
function groupByCat(list){
  const m = new Map();
  [...list].sort((a,b) => a.name.localeCompare(b.name, "de")).forEach(e => {
    const c = e.cat || "Sonstiges"; if (!m.has(c)) m.set(c, []); m.get(c).push(e);
  });
  return [...m.entries()].sort((a,b) => a[0].localeCompare(b[0], "de"));
}
function bestLabel(e){
  let best = 0, count = 0;
  S.workouts.forEach(w => w.entries.forEach(en => { if (en.exId === e.id){ count++; en.sets.forEach(s => best = Math.max(best, num(s.a))); } }));
  if (!count) return "";
  return e.type === "kraft" && best > 0 ? `Best ${fmtNum(best)} kg` : `${count}×`;
}

/* Steigerungsvorschlag: Wurden in den letzten zwei Einheiten einer Kraftübung alle Sätze mit demselben Gewicht
   und mindestens STEP_REPS Wiederholungen geschafft, schlägt die App STEP_KG mehr vor. Ergebnis: neues Gewicht oder null. */
const STEP_REPS = 10, STEP_KG = 2.5;
function stepUp(exId){
  if (exType(exId) !== "kraft") return null;
  const runs = [];
  for (let k = S.workouts.length - 1; k >= 0 && runs.length < 2; k--){
    const en = S.workouts[k].entries.find(e => e.exId === exId);
    if (en && en.sets.length) runs.push(en.sets);
  }
  if (runs.length < 2) return null;
  const kg = num(runs[0][0].a);
  if (!(kg > 0)) return null;
  return runs.every(sets => sets.every(s => num(s.a) === kg && num(s.b) >= STEP_REPS)) ? kg + STEP_KG : null;
}

/* Fortschrittskurve einer Übung: ein Wert pro Einheit.
   Kraft: geschätztes Maximum für 1 Wdh nach Epley (kg × (1 + Wdh/30)), ohne Gewicht die meisten Wiederholungen;
   Ausdauer: Tempo in min/km (kleiner ist besser); nur Zeit: Minuten der Einheit. */
function exSeries(exId){
  const type = exType(exId), pts = [], sum = (sets, f) => sets.reduce((t, s) => t + num(s[f]), 0);
  const runs = S.workouts.map(w => ({date:w.date, sets:(w.entries.find(e => e.exId === exId) || {}).sets})).filter(r => r.sets && r.sets.length);
  if (type === "kraft"){
    const weighted = runs.some(r => r.sets.some(s => num(s.a) > 0));
    const e1rm = s => num(s.b) > 1 ? num(s.a) * (1 + num(s.b) / 30) : num(s.a);
    runs.forEach(r => {
      const v = weighted ? Math.max(0, ...r.sets.filter(s => num(s.a) > 0 && num(s.b) > 0).map(e1rm)) : Math.max(0, ...r.sets.map(s => num(s.b)));
      if (v > 0) pts.push({date:r.date, v});
    });
    return weighted ? {pts, label:"Geschätztes Maximum für 1 Wdh", fmt:v => `${fmtNum(Math.round(v * 2) / 2)} kg`}
                    : {pts, label:"Meiste Wiederholungen in einem Satz", fmt:v => `${Math.round(v)} Wdh`};
  }
  if (type === "ausdauer"){
    runs.forEach(r => { const min = sum(r.sets, "a"), km = sum(r.sets, "b"); if (min > 0 && km > 0) pts.push({date:r.date, v:min / km}); });
    return {pts, label:"Tempo (oben ist schneller)", lowerIsBetter:true, fmt:v => { const s = Math.round(v * 60); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} min/km`; }};
  }
  runs.forEach(r => { const min = sum(r.sets, "a"); if (min > 0) pts.push({date:r.date, v:min}); });
  return {pts, label:"Minuten pro Einheit", fmt:v => `${fmtNum(v)} min`};
}
// Linie der letzten 20 Einheiten, gleichmäßig verteilt; oben ist immer besser. Ab zwei Einheiten.
function vChart(exId){
  const c = exSeries(exId), pts = c.pts.slice(-20);
  if (pts.length < 2) return "";
  const W = 320, H = 112, top = 10, bottom = 8, vals = pts.map(p => p.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1e-6){ lo -= 1; hi += 1; }
  const x = i => 6 + (W - 12) * i / (pts.length - 1);
  const y = v => { const t = (v - lo) / (hi - lo); return top + (H - top - bottom) * (c.lowerIsBetter ? t : 1 - t); };
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const best = c.lowerIsBetter ? Math.min(...vals) : Math.max(...vals), lastP = pts[pts.length - 1];
  return `<div class="chart">
    <div class="row between"><span class="muted">${c.label}</span><span class="chart-now">${c.fmt(lastP.v)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.label)} der letzten ${pts.length} Einheiten, zuletzt ${esc(c.fmt(lastP.v))}, Bestwert ${esc(c.fmt(best))}">
      <defs><linearGradient id="chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ki);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--ki);stop-opacity:0"/></linearGradient></defs>
      <line class="chart-best" x1="0" x2="${W}" y1="${y(best).toFixed(1)}" y2="${y(best).toFixed(1)}"/>
      <polygon fill="url(#chart-fill)" points="${x(0).toFixed(1)},${H} ${line} ${x(pts.length - 1).toFixed(1)},${H}"/>
      <polyline class="chart-line" points="${line}"/>
      ${pts.map((p, i) => `<circle class="${i === pts.length - 1 ? "chart-last" : "chart-dot"}" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 5 : 3}"/>`).join("")}
    </svg>
    <div class="row between muted chart-foot"><span>${fmtDate(pts[0].date)}</span><span>Bestwert ${c.fmt(best)}</span><span>${fmtDate(lastP.date)}</span></div>
  </div>`;
}

/* ---------- Speicher (IndexedDB) ----------
   Datenbank "trainingslog", Schema-Version 1:
     meta     – ein Eintrag "state": Übungen, Vorlagen, Einstellungen, laufendes Training
     workouts – ein Eintrag pro gespeichertem Training (Schlüssel: id)
   Im Arbeitsspeicher (S) und im Backup gilt weiter das Datenformat v1 des Prototyps. */
const DB_NAME = "trainingslog", DB_VERSION = 1;
const store = {status:"ok", persisted:false};   // status: "ok" | "error" (Schreiben fehlgeschlagen) | "off" (kein Speicher verfügbar)
let dbP = null;

function openDb(){
  if (dbP) return dbP;
  const p = new Promise((res, rej) => {
    let late = false;
    const rq = indexedDB.open(DB_NAME, DB_VERSION);
    rq.onupgradeneeded = e => {
      const db = rq.result;
      // Spätere Schema-Versionen hier als weitere Schritte ergänzen: if (e.oldVersion < 2){ … }
      if (e.oldVersion < 1){ db.createObjectStore("meta"); db.createObjectStore("workouts", {keyPath:"id"}); }
    };
    rq.onsuccess = () => {
      const db = rq.result;
      if (late){ db.close(); return; }
      const forget = () => { if (dbP === p) dbP = null; };
      db.onversionchange = () => { db.close(); forget(); };   // ein anderer Tab will das Schema ändern
      db.onclose = forget;                                     // der Browser hat die Verbindung getrennt
      res(db);
    };
    rq.onerror = () => rej(rq.error);
    setTimeout(() => { late = true; rej(new Error("Die Datenbank antwortet nicht.")); }, 5000);
  });
  p.catch(() => { if (dbP === p) dbP = null; });
  return dbP = p;
}
function closeDb(){ const p = dbP; dbP = null; if (p) p.then(db => db.close(), () => {}); }

// Führt work(transaktion) aus und wartet, bis alles gelesen bzw. geschrieben ist.
function idb(mode, work){
  return openDb().then(db => new Promise((res, rej) => {
    const t = db.transaction(["meta","workouts"], mode);
    t.oncomplete = () => res();
    t.onabort = () => rej(t.error || new Error("Transaktion abgebrochen"));
    try { work(t); } catch(e){ try { t.abort(); } catch(_){} rej(e); return; }
    // Sofort abschließen statt auf die Antworten zu warten – wichtig, wenn iOS die App direkt danach einfriert.
    if (mode === "readwrite" && t.commit) t.commit();
  }));
}
function setStatus(s){
  if (store.status === s) return;
  store.status = s;
  if (s === "error") toast("Speichern fehlgeschlagen – bitte Backup sichern");
  if (ui.tab === "verlauf" && !ui.sheet) render();
}

const stateBody = () => ({v:1, updatedAt:S.updatedAt, exercises:S.exercises, templates:S.templates, settings:S.settings, active:S.active, deleted:S.deleted});
async function loadDb(){
  const out = {};
  await idb("readonly", t => {
    t.objectStore("meta").get("state").onsuccess = e => { out.state = e.target.result; };
    t.objectStore("workouts").getAll().onsuccess = e => { out.workouts = e.target.result; };
  });
  return out;
}

/* Änderungen werden vorgemerkt und am Ende des laufenden Klicks/Tastendrucks zusammen in einer
   Transaktion geschrieben. save() sichert den "state"-Eintrag, save({put:id}) / save({del:id})
   zusätzlich ein einzelnes Training, save({all:true}) ersetzt alle Trainings (Import). */
const pending = {state:false, all:false, put:new Set(), del:new Set()};
let flushQueued = false, saveFails = 0;
function save(change){
  S.updatedAt = Date.now();
  if (store.status === "off") return;   // kein Speicher verfügbar, siehe boot()
  pending.state = true;
  if (change){
    if (change.all) pending.all = true;
    if (change.put){ pending.put.add(change.put); pending.del.delete(change.put); }
    if (change.del){ pending.del.add(change.del); pending.put.delete(change.del); }
  }
  if (!flushQueued){ flushQueued = true; queueMicrotask(flush); }
}
function flush(){
  flushQueued = false;
  if (!pending.state && !pending.all && !pending.put.size && !pending.del.size) return Promise.resolve(true);
  const job = {all:pending.all, put:[...pending.put], del:[...pending.del]};
  pending.state = pending.all = false; pending.put.clear(); pending.del.clear();
  return idb("readwrite", t => {
    const ws = t.objectStore("workouts");
    if (job.all){ ws.clear(); S.workouts.forEach(w => ws.put(w)); }
    else {
      job.del.forEach(id => ws.delete(id));
      job.put.forEach(id => { const w = S.workouts.find(x => x.id === id); if (w) ws.put(w); });
    }
    t.objectStore("meta").put(stateBody(), "state");
  }).then(() => { saveFails = 0; setStatus("ok"); return true; }, err => {
    console.warn("Speichern fehlgeschlagen:", err);
    closeDb();
    // Alles wieder vormerken – der nächste Versuch schreibt dann den aktuellen Stand.
    pending.state = true; pending.all = pending.all || job.all;
    job.put.forEach(id => pending.del.has(id) || pending.put.add(id));
    job.del.forEach(id => pending.put.has(id) || pending.del.add(id));
    if (++saveFails === 1) setTimeout(flush, 400);   // einmal mit frischer Verbindung wiederholen
    else setStatus("error");
    return false;
  });
}

let ui = {tab:"training", sheet:null, open:null};
let bootErr = null;   // gesetzt, wenn die Daten beim Start nicht geladen werden konnten

/* ---------- Audio (beep at end of rest) ---------- */
let actx = null, beeps = [];
function unlockAudio(){
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch(e){}
}
function cancelBeep(){ beeps.forEach(o => { try { o.stop(); } catch(e){} }); beeps = []; }
function scheduleBeep(sec){
  cancelBeep();
  if (!actx) return;
  try {
    const t0 = actx.currentTime + Math.max(0, sec);
    [0, .28, .56].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.35, t0 + d + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + .2);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + .22);
      beeps.push(o);
    });
  } catch(e){}
}
function startTimer(sec){ timer.end = Date.now() + sec * 1000; timer.total = sec; timer.rang = false; scheduleBeep(sec); tick(); }
function stopTimer(){ timer.end = 0; cancelBeep(); tick(); }
function shiftTimer(delta){
  if (!timer.end) return;
  timer.end = Math.max(Date.now() + 1000, timer.end + delta * 1000);
  timer.total = Math.max(timer.total + delta, 1); timer.rang = false;
  scheduleBeep((timer.end - Date.now()) / 1000); tick();
}

/* ---------- Fortschritt (Spielelemente) ----------
   Kampfkraft, Stufe, Serie, Rekorde und Erfolge werden bei jedem Anzeigen aus den gespeicherten
   Trainings berechnet. Nichts davon wird gespeichert, das Datenformat bleibt unverändert. */
// Kampfkraft für einen Satz: Gewicht × Wdh, Übungen ohne Gewicht zählen wie 30 kg; bei Ausdauer Minuten und Kilometer.
function setPower(type, s){
  const a = num(s.a), b = num(s.b);
  return Math.round(type === "kraft" ? (a > 0 ? a * b / 10 + b : b * 4) : type === "ausdauer" ? a * 10 + b * 20 : a * 10);
}
// Woran ein Rekord gemessen wird: [Einheit, Wert]
function setMark(type, s){
  const a = num(s.a), b = num(s.b);
  return type === "kraft" ? (a > 0 ? ["kg", a] : ["Wdh", b]) : type === "ausdauer" && b > 0 ? ["km", b] : ["min", a];
}
// Kampfkraft und neue Rekorde eines Trainings, gemessen an den bisherigen Bestwerten. bests wird dabei fortgeschrieben.
function workoutGain(w, bests){
  let power = 0, volume = 0; const records = [];
  w.entries.forEach(en => {
    const type = exType(en.exId), b = bests[en.exId] || (bests[en.exId] = {}), top = {};
    en.sets.forEach(s => {
      power += setPower(type, s);
      if (type === "kraft") volume += num(s.a) * num(s.b);
      const [unit, v] = setMark(type, s);
      if (v > (top[unit] || 0)) top[unit] = v;
    });
    Object.keys(top).forEach(unit => {
      if (b[unit] > 0 && top[unit] > b[unit]) records.push({name:exName(en.exId), unit, v:top[unit], old:b[unit]});   // der erste Wert einer Übung ist noch kein Rekord
      if (top[unit] > (b[unit] || 0)) b[unit] = top[unit];
    });
  });
  return {power, volume, records};
}
const WEEK = 7 * 864e5;
const weekStart = t => { const d = new Date(t); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d.getTime(); };   // Montag der Woche
// Gesamtstand über alle Trainings (list ist nach Datum aufsteigend sortiert).
function progress(list){
  const p = {n:list.length, power:0, sets:0, km:0, records:0, maxVolume:0, bests:{}, exercises:new Set(), streak:0, bestStreak:0, seven:false};
  let run = 0, prevWeek = null;
  list.forEach((w, i) => {
    const g = workoutGain(w, p.bests);
    p.power += g.power; p.records += g.records.length; p.maxVolume = Math.max(p.maxVolume, g.volume);
    w.entries.forEach(en => { p.exercises.add(en.exId); p.sets += en.sets.length; if (exType(en.exId) === "ausdauer") en.sets.forEach(s => p.km += num(s.b)); });
    if (i >= 6 && w.date - list[i - 6].date < WEEK) p.seven = true;
    const wk = weekStart(w.date);
    if (wk !== prevWeek){ run = prevWeek !== null && Math.round((wk - prevWeek) / WEEK) === 1 ? run + 1 : 1; prevWeek = wk; p.bestStreak = Math.max(p.bestStreak, run); }
  });
  // Die Serie läuft weiter, solange diese oder die letzte Woche ein Training hat.
  if (prevWeek !== null && Math.round((weekStart(Date.now()) - prevWeek) / WEEK) <= 1) p.streak = run;
  p.level = Math.floor(Math.sqrt(p.power / 400)) + 1;
  return p;
}
const levelFloor = l => 400 * (l - 1) ** 2;   // Kampfkraft, bei der Stufe l beginnt
const RANKS = [[20,"Legende"],[15,"Großmeister"],[10,"Meister"],[7,"Elitekämpfer"],[4,"Kämpfer"],[2,"Schüler"],[1,"Neuling"]];
const rankOf = l => RANKS.find(r => l >= r[0])[1];
const fmtInt = n => Math.round(n).toLocaleString("de-DE");
const weeks = n => n === 1 ? "1 Woche" : `${n} Wochen`;
// Erfolge: [Name, Beschreibung, Bedingung auf dem Gesamtstand]
const ACHIEVEMENTS = [
  ["Erster Schritt", "Das erste Training gespeichert", p => p.n >= 1],
  ["Dranbleiber", "10 Trainings gespeichert", p => p.n >= 10],
  ["Stammgast", "50 Trainings gespeichert", p => p.n >= 50],
  ["Hundert voll", "100 Trainings gespeichert", p => p.n >= 100],
  ["Alle sieben", "7 Trainings innerhalb von 7 Tagen", p => p.seven],
  ["Monatsserie", "4 Wochen in Folge trainiert", p => p.bestStreak >= 4],
  ["Vierteljahr", "12 Wochen in Folge trainiert", p => p.bestStreak >= 12],
  ["Über 9000", "Mehr als 9000 Kampfkraft gesammelt", p => p.power > 9000],
  ["Rekordjäger", "10 eigene Bestwerte übertroffen", p => p.records >= 10],
  ["Schwergewicht", "10.000 kg in einem Training bewegt", p => p.maxVolume >= 10000],
  ["Vielseitig", "10 verschiedene Übungen trainiert", p => p.exercises.size >= 10],
  ["Marathon", "Insgesamt 42 km Ausdauer", p => p.km >= 42]
];

/* ---------- Views ---------- */
// Stufe, Kampfkraft und Balken bis zur nächsten Stufe
function vLevel(p){
  const from = levelFloor(p.level), to = levelFloor(p.level + 1);
  return `<span class="row between lvl"><span><b>Stufe ${p.level}</b> ${rankOf(p.level)}</span><span><b>${fmtInt(p.power)}</b> Kampfkraft</span></span>
    <span class="xp"><i style="width:${Math.round(100 * (p.power - from) / (to - from))}%"></i></span>`;
}
const vBadge = (a, got) => `<div class="li row badge${got ? "" : " off"}">${orb(1, got)}<span class="grow"><b>${a[0]}</b><span class="muted">${a[1]}</span></span></div>`;
// Sternkugel als SVG mit n Sternen (1–7). lit: gesammelt und leuchtend, sonst versteinert.
const starPath = R => Array.from({length:10}, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * .42 : R; return (i ? "L" : "M") + (Math.cos(a) * r).toFixed(2) + " " + (Math.sin(a) * r).toFixed(2); }).join("") + "Z";
function orb(n, lit){
  const ring = n === 7 ? 6 : n, rad = [0, 0, 7.5, 9, 10, 11, 11.5, 11.5][n], turn = n === 2 ? Math.PI / 4 : 0;
  const pts = n === 1 ? [] : Array.from({length:ring}, (_, i) => { const a = -Math.PI / 2 + turn + i * 2 * Math.PI / ring; return [Math.cos(a) * rad, Math.sin(a) * rad]; });
  if (n === 1 || n === 7) pts.push([0, 0]);
  const star = starPath(n === 1 ? 7.5 : n < 4 ? 5.6 : n === 4 ? 5 : 4.4);
  return `<svg class="${lit ? "lit" : ""}" viewBox="-24 -24 48 48" aria-hidden="true">
    <circle r="22" fill="url(#${lit ? "orb-lit" : "orb-off"})" stroke="${lit ? "#7a2e00" : "#0a0f33"}" stroke-width="1.5"/>
    ${pts.map(p => `<path transform="translate(${p[0].toFixed(1)} ${p[1].toFixed(1)})" d="${star}" fill="${lit ? "#e03131" : "#141c5c"}"/>`).join("")}
    ${lit ? `<ellipse cx="-8" cy="-10" rx="7" ry="3.6" transform="rotate(-35 -8 -10)" fill="#fff" opacity=".6"/>` : ""}</svg>`;
}
function vTraining(){
  const a = S.active;

    return `<h1>Training</h1>
    <button class="hero${wk >= 7 ? " full" : ""}" data-act="progress">
      <span class="orbs" role="img" aria-label="${Math.min(wk, 7)} von 7 Sternkugeln gesammelt">${[1,2,3,4,5,6,7].map(n => orb(n, n <= wk)).join("")}</span>
      <span class="row between hero-text">
        <span><b>${wk}</b> ${wk === 1 ? "Training" : "Trainings"} in 7 Tagen</span>
        <span class="muted">${last ? `Zuletzt ${esc(last.name)}, ${ago[0].toLowerCase() + ago.slice(1)}` : "Sammle deine erste Sternkugel"}</span>
      </span>

      <span class="row between muted hero-foot"><span>${p.streak ? `Serie: ${weeks(p.streak)}` : "Noch keine Serie"}</span><span>Erfolge ${ACHIEVEMENTS.filter(a => a[2](p)).length}/${ACHIEVEMENTS.length} ›</span></span>

    <button class="block" data-act="pick" data-target="active">+ Übung hinzufügen</button>

function vEntry(en, i){

  // Steigerungsknopf nur, solange noch ein offener Satz unter dem vorgeschlagenen Gewicht liegt

    ${d.isNew ? "" : `${chart ? `<h2>Entwicklung</h2>${chart}` : ""}
      <h2>Letzte Einheiten</h2>

    <p class="muted" style="margin-top:14px">Kampfkraft gibt es für jeden gespeicherten Satz. Mehr Gewicht, Wiederholungen, Minuten oder Kilometer bringen mehr. Die Serie zählt die Wochen in Folge mit mindestens einem Training.</p>`;

  if (s.kind === "result"){

}

/* ---------- Render ---------- */
// Solange S fehlt: Ladehinweis bzw. Fehlermeldung, wenn die Datenbank nicht geöffnet werden konnte.
function vBoot(){
  if (!bootErr) return `<p class="muted" style="text-align:center;margin-top:38vh">Lade …</p>`;
  return `<h1>Trainingslog</h1>
  <div class="card"><p>Der Datenspeicher lässt sich gerade nicht öffnen.</p>
    <p class="muted">Vorhandene Daten bleiben unangetastet. Das kann z. B. im privaten Modus des Browsers passieren.</p>
    <p class="muted">${esc(bootErr.message || bootErr)}</p>
    <button class="block primary" data-act="reload">Erneut versuchen</button></div>`;
}
function render(){
  if (!S){ $("#main").innerHTML = vBoot(); return; }
  const views = {training:vTraining, vorlagen:vTemplates, uebungen:vExercises, verlauf:vHistory};
  const noStore = store.status === "off" ? `<div class="status warn" style="margin:10px 0 0"><i></i><span>Vorschau ohne Speicher – Eingaben gehen beim Schließen verloren.</span></div>` : "";
  $("#main").innerHTML = noStore + views[ui.tab]();
  document.querySelectorAll(".tab").forEach(b => {
    b.classList.toggle("on", b.dataset.tab === ui.tab);
    b.classList.toggle("live", b.dataset.tab === "training" && !!S.active);
  });
  const sh = $("#sheet"), wasOpen = sh.classList.contains("open"), oldPanel = sh.querySelector(".panel"), st = oldPanel ? oldPanel.scrollTop : 0;
  if (ui.sheet){
    sh.innerHTML = `<div class="backdrop" data-act="close"></div><div class="panel${wasOpen ? "" : " anim"}">${vSheet(ui.sheet)}</div>`;
    sh.classList.add("open");
    if (wasOpen && ui.sheet === lastSheet) sh.querySelector(".panel").scrollTop = st;
  } else { sh.innerHTML = ""; sh.classList.remove("open"); }
  lastSheet = ui.sheet;
  tick();
  keepAwake();
}
let lastSheet = null;

/* Bildschirm wachhalten, solange ein Training läuft (Screen Wake Lock; auf dem iPhone in der installierten App ab iOS 18.4).
   Wird nach jedem render() und bei der Rückkehr in die App aufgerufen. Der Browser gibt die Sperre beim Wechsel
   in eine andere App selbst frei; ohne Unterstützung passiert nichts. */
let wakeLock = null, wakeBusy = false;
function keepAwake(){
  if (!("wakeLock" in navigator)) return;
  const want = !!(S && S.active) && document.visibilityState === "visible";
  if (!want){ if (wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; } return; }
  if (wakeBusy || (wakeLock && !wakeLock.released)) return;
  wakeBusy = true;
  navigator.wakeLock.request("screen")
    .then(l => { wakeLock = l; }, () => { wakeLock = null; })
    .finally(() => { wakeBusy = false; if (!(S && S.active)) keepAwake(); });   // Training inzwischen beendet: gleich wieder freigeben
}

function tick(){
  const el = $("#elapsed");
  if (el && S.active){ const m = Math.floor((Date.now() - S.active.date) / 60000); el.textContent = m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`; }
  const tb = $("#timer");
  if (!timer.end){ tb.classList.remove("show","over"); return; }
  const remMs = timer.end - Date.now(), rem = Math.ceil(remMs / 1000);
  tb.classList.add("show");
  if (rem <= 0){
    if (!timer.rang){ timer.rang = true; try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){} }
    tb.classList.add("over"); $("#tlabel").textContent = "Pause vorbei"; $("#ttime").textContent = "Nächster Satz!"; $("#tfill").style.width = "100%";
    if (rem <= -8){ timer.end = 0; tb.classList.remove("show","over"); }
    return;
  }
  tb.classList.remove("over");
  $("#tlabel").textContent = "Pause";
  $("#ttime").textContent = `${Math.floor(rem/60)}:${String(rem%60).padStart(2,"0")}`;
  $("#tfill").style.width = `${Math.min(100, 100 * (1 - remMs / (timer.total * 1000)))}%`;
}
setInterval(tick, 250);

/* ---------- Export / Import ---------- */
const stamp = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0,10); };   // heutiges Datum in Ortszeit
// at: Zeitpunkt dieses Backups. Er steht im Backup als settings.lastBackup, damit nach einem Import klar ist, wie aktuell die Daten gesichert sind.
function backupJson(at = Date.now()){ return JSON.stringify({...S, settings:{...S.settings, lastBackup:at}, active:null, exportedAt:new Date(at).toISOString()}, null, 1); }
// Nach einem Backup, das wirklich gespeichert oder geteilt wurde.
function markBackup(at){
  S.settings.lastBackup = at; save();
  if (ui.tab === "verlauf" || (ui.sheet && ui.sheet.kind === "result")) render();
}
/* Ist ein Backup fällig? Nur wenn es seit dem letzten Backup neue Trainings gibt und das Backup mehr als 14 Tage
   zurückliegt oder 10 Trainings fehlen. Ohne Backup zählen die 14 Tage ab dem ersten noch ungesicherten Training. */
function backupDue(){
  const now = Date.now(), last = Math.min(S.settings.lastBackup || 0, now);   // ein Zeitpunkt in der Zukunft (falsche Uhr) zählt als jetzt
  const open = S.workouts.filter(w => (w.end || w.date) > last);
  if (!open.length || store.status === "off") return null;
  const days = Math.round((dayStart(now) - dayStart(last || open[0].date)) / 864e5);   // Kalendertage wie relDay()
  return open.length >= 10 || days >= 14 ? {count:open.length, days, never:!last} : null;
}
function vBackupDue(){
  const due = backupDue();
  if (!due) return "";
  const n = due.count === 1 ? "1 Training ist" : `${due.count} Trainings sind`;
  return `<div class="backup-due"><p>${due.never ? `Noch kein Backup gesichert. ${n} nur auf diesem Gerät gespeichert.` : `Letztes Backup vor ${due.days} ${due.days === 1 ? "Tag" : "Tagen"}. ${n} noch nicht gesichert.`}</p>
    <button class="block" data-act="exp-json">Jetzt sichern</button></div>`;
}
function csv(){
  const rows = [["Datum","Training","Übung","Kategorie","Satz","Gewicht_kg","Wiederholungen","Minuten","km"]];
  S.workouts.forEach(w => w.entries.forEach(e => {
    const ex = exById(e.exId) || {name:"Gelöschte Übung", cat:"", type:"kraft"};
    e.sets.forEach((s, i) => rows.push([new Date(w.date).toLocaleDateString("de-DE"), w.name, ex.name, ex.cat || "", i + 1,
      ex.type === "kraft" ? s.a : "", ex.type === "kraft" ? s.b : "", ex.type !== "kraft" ? s.a : "", ex.type === "ausdauer" ? s.b : ""]));
  }));
  return "﻿" + rows.map(r => r.map(c => { c = String(c ?? ""); return /[;"\n]/.test(c) ? `"${c.replace(/"/g,'""')}"` : c; }).join(";")).join("\n");
}
/* Gibt einen Export als Datei heraus:
   1. auf dem Handy über das Teilen-Menü (dort z. B. „In Dateien sichern“),
   2. sonst als normalen Datei-Download,
   3. und wo beides nicht geht, als Text zum Kopieren. */
// Ergebnis: "shared", "downloaded", "text" (zum Kopieren angezeigt) oder "cancelled". backupAt: nur beim Backup, siehe "copy-text".
async function offerFile(filename, data, type, title, backupAt){
  const file = new File([data], filename, {type});
  const touch = !!window.matchMedia && matchMedia("(pointer: coarse)").matches;
  if (touch && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file]}); return "shared"; }
    catch(e){ if (e && e.name === "AbortError") return "cancelled"; console.warn("Teilen fehlgeschlagen:", e); }   // abgebrochen: nichts tun
  }
  // In der vom iPhone-Home-Bildschirm gestarteten App ist der Datei-Download nicht verlässlich, dort lieber gleich der Text.
  if ("download" in HTMLAnchorElement.prototype && navigator.standalone !== true){
    const url = URL.createObjectURL(file), a = document.createElement("a");
    a.href = url; a.download = filename; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    toast("Download gestartet");
    return "downloaded";
  }
  ui.sheet = {kind:"text", title, backupAt, text:data.replace(/^﻿/, ""), hint:"Kopiere den Text und speichere ihn z. B. in der Notizen- oder Dateien-App."};
  render();
  return "text";
}
function applyImport(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ toast("Das ist kein gültiges Backup"); return; }
  if (!d || !Array.isArray(d.exercises) || !Array.isArray(d.workouts)){ toast("Backup unvollständig"); return; }
  ask(`Backup mit ${d.workouts.length} Trainings laden? Die aktuellen Daten werden ersetzt.`, "Laden", true).then(ok => {
    if (!ok) return;
    const before = new Set(S.workouts.map(w => w.id));
    S = normalize(d); S.active = null;
    // Ältere Backups kennen settings.lastBackup noch nicht: Die geladenen Daten sind auf dem Stand ihres Exports gesichert.
    if (!S.settings.lastBackup && Date.parse(d.exportedAt) > 0) S.settings.lastBackup = Date.parse(d.exportedAt);
    const now = new Set(S.workouts.map(w => w.id));
    S.deleted = [...new Set([...(S.deleted || []), ...[...before].filter(id => !now.has(id))])];
    save({all:true});
    ui.sheet = null; ui.tab = "verlauf"; render(); toast("Backup geladen");
  });
}

/* ---------- Actions ---------- */
const actions = {
  tab: el => { ui.tab = el.dataset.tab; ui.sheet = null; render(); window.scrollTo(0, 0); },
  start: el => {
    const t = S.templates.find(x => x.id === el.dataset.id);
    S.active = {id:uid(), date:Date.now(), name:t ? t.name : "Freies Training", entries:(t ? t.ex : []).filter(exById).map(newEntry)};
    save(); render(); window.scrollTo(0, 0);
  },
  discard: async () => { if (await ask("Training verwerfen? Nichts davon wird gespeichert.", "Verwerfen", true)){ S.active = null; stopTimer(); save(); render(); } },
  finish: async () => {
    const a = S.active;
    const entries = a.entries.map(e => ({exId:e.exId, sets:e.sets.filter(s => s.done).map(s => ({a:s.a, b:s.b}))})).filter(e => e.sets.length);
    if (!entries.length){
      if (await ask("Du hast noch keinen Satz abgehakt. Training ohne Speichern beenden?", "Beenden", true)){ S.active = null; stopTimer(); save(); render(); }
      return;
    }
    const open = a.entries.reduce((n, e) => n + e.sets.filter(s => !s.done).length, 0);
    if (open && !(await ask(`${open} ${open === 1 ? "Satz ist" : "Sätze sind"} nicht abgehakt und werden nicht gespeichert. Trotzdem beenden?`, "Beenden"))) return;
    const w = {id:a.id, date:a.date, end:Date.now(), name:a.name, entries};
    const before = progress(S.workouts);
    S.workouts.push(w); S.active = null; stopTimer(); save({put:w.id});
    // Belohnung: was dieses Training gebracht hat
    const after = progress(S.workouts), gain = workoutGain(w, before.bests);
    ui.sheet = {kind:"result", power:gain.power, records:gain.records, level:after.level > before.level ? after.level : 0, earned:ACHIEVEMENTS.filter(x => x[2](after) && !x[2](before))};
    ui.tab = "verlauf"; ui.open = w.id; render(); window.scrollTo(0, 0); toast(store.status === "off" ? "Training beendet – nicht gespeichert" : "Training gespeichert 💪");
  },
  check: el => {
    const en = S.active.entries[+el.dataset.i], s = en.sets[+el.dataset.j];
    s.done = !s.done; save();
    if (s.done && exType(en.exId) === "kraft") startTimer(S.settings.rest);
    render();
    if (s.done){
      // Sofort melden, wenn der Satz den bisherigen Bestwert der Übung übertrifft (und nicht schon ein früherer Satz heute).
      const type = exType(en.exId), [unit, v] = setMark(type, s), best = (progress(S.workouts).bests[en.exId] || {})[unit] || 0;
      const today = Math.max(0, ...en.sets.filter(x => x !== s && x.done).map(x => { const m = setMark(type, x); return m[0] === unit ? m[1] : 0; }));
      if (best > 0 && v > best && v > today) toast(`Neuer Rekord: ${fmtNum(v)} ${unit} bei ${exName(en.exId)}`);
    }
  },
  "step-up": el => {
    const en = S.active.entries[+el.dataset.i], up = stepUp(en.exId);
    if (!up) return;
    en.sets.forEach(s => { if (!s.done) s.a = fmtNum(up); });
    save(); render();
  },
  "add-set": el => { const en = S.active.entries[+el.dataset.i], p = en.sets[en.sets.length - 1] || {a:"", b:""}; en.sets.push({a:p.a, b:p.b, done:false}); save(); render(); },
  "del-set": el => { S.active.entries[+el.dataset.i].sets.pop(); save(); render(); },
  "del-entry": async el => { if (await ask("Übung aus diesem Training entfernen?", "Entfernen", true)){ S.active.entries.splice(+el.dataset.i, 1); save(); render(); } },
  pick: el => { ui.sheet = {kind:"picker", target:el.dataset.target, back:ui.sheet}; render(); },
  picked: el => {
    const s = ui.sheet, id = el.dataset.id;
    if (s.target === "active"){ S.active.entries.push(newEntry(id)); save(); ui.sheet = null; render(); setTimeout(() => window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"}), 30); }
    else { s.back.draft.ex.push(id); ui.sheet = s.back; render(); }
  },
  "new-ex-inline": () => { ui.sheet = {kind:"exercise", draft:{isNew:true, id:uid(), name:"", cat:"", type:"kraft"}, back:ui.sheet}; render(); },
  close: () => { ui.sheet = ui.sheet && ui.sheet.back || null; render(); },
  "new-tpl": () => { ui.sheet = {kind:"template", draft:{isNew:true, id:uid(), name:"", ex:[]}}; render(); },
  "edit-tpl": el => { const t = S.templates.find(x => x.id === el.dataset.id); ui.sheet = {kind:"template", draft:{...t, ex:[...t.ex]}}; render(); },
  "tpl-move": el => { const ex = ui.sheet.draft.ex, k = +el.dataset.k, j = k + +el.dataset.d; [ex[k], ex[j]] = [ex[j], ex[k]]; render(); },
  "tpl-rm": el => { ui.sheet.draft.ex.splice(+el.dataset.k, 1); render(); },
  "save-tpl": () => {
    const d = ui.sheet.draft;
    if (!d.name.trim()){ toast("Bitte einen Namen eingeben"); return; }
    const t = {id:d.id, name:d.name.trim(), ex:d.ex}, k = S.templates.findIndex(x => x.id === d.id);
    if (k >= 0) S.templates[k] = t; else S.templates.push(t);
    save(); ui.sheet = null; render();
  },
  "del-tpl": async () => { const d = ui.sheet.draft; if (await ask(`Vorlage „${d.name}“ löschen?`, "Löschen", true)){ S.templates = S.templates.filter(t => t.id !== d.id); save(); ui.sheet = null; render(); } },
  "new-ex": () => { ui.sheet = {kind:"exercise", draft:{isNew:true, id:uid(), name:"", cat:"", type:"kraft"}}; render(); },
  "edit-ex": el => { const e = exById(el.dataset.id); ui.sheet = {kind:"exercise", draft:{...e}}; render(); },
  "save-ex": () => {
    const s = ui.sheet, d = s.draft;
    if (!d.name.trim()){ toast("Bitte einen Namen eingeben"); return; }
    const e = {id:d.id, name:d.name.trim(), cat:(d.cat || "").trim() || "Sonstiges", type:d.type || "kraft"}, k = S.exercises.findIndex(x => x.id === d.id);
    if (k >= 0) S.exercises[k] = e; else S.exercises.push(e);
    save();
    const back = s.back;
    if (back && back.kind === "picker"){
      if (back.target === "active"){ S.active.entries.push(newEntry(e.id)); save(); ui.sheet = null; }
      else { back.back.draft.ex.push(e.id); ui.sheet = back.back; }
    } else ui.sheet = null;
    render();
  },
  "del-ex": async () => {
    const d = ui.sheet.draft;
    if (!(await ask(`Übung „${d.name}“ löschen? Sie verschwindet aus allen Vorlagen. Alte Trainings bleiben erhalten.`, "Löschen", true))) return;
    S.exercises = S.exercises.filter(e => e.id !== d.id);
    S.templates.forEach(t => t.ex = t.ex.filter(id => id !== d.id));
    save(); ui.sheet = null; render();
  },
  "toggle-w": el => { ui.open = ui.open === el.dataset.id ? null : el.dataset.id; render(); },
  "del-w": async el => {
    if (!(await ask("Dieses Training endgültig löschen?", "Löschen", true))) return;
    const id = el.dataset.id;
    S.workouts = S.workouts.filter(w => w.id !== id); S.deleted.push(id); save({del:id}); render();
  },
  "exp-json": async () => {
    const at = Date.now(), r = await offerFile(`trainingslog-backup-${stamp()}.json`, backupJson(at), "application/json", "Backup (JSON)", at);
    if (r === "shared"){ markBackup(at); toast("Backup gesichert"); }
    else if (r === "downloaded") markBackup(at);
  },
  "exp-csv": () => { if (!S.workouts.length){ toast("Noch keine Trainings zum Exportieren"); return; } offerFile(`trainingslog-${stamp()}.csv`, csv(), "text/csv", "Export (CSV)"); },
  "copy-text": async () => {
    const t = $("#text-out");
    try { await navigator.clipboard.writeText(t.value); toast("Kopiert"); if (ui.sheet && ui.sheet.backupAt) markBackup(ui.sheet.backupAt); }
    catch(e){ t.focus(); t.select(); toast("Text markiert – jetzt „Kopieren“ wählen"); }
  },
  imp: () => { ui.sheet = {kind:"import"}; render(); },
  "imp-file": () => $("#imp-file").click(),
  "imp-text": () => applyImport($("#imp-text").value),
  "t-plus": () => shiftTimer(15),
  "t-minus": () => shiftTimer(-15),
  "t-skip": () => stopTimer(),
  "dlg-yes": () => closeDlg(true),
  "dlg-no": () => closeDlg(false),
  progress: () => { ui.sheet = {kind:"progress"}; render(); },
  reload: () => { saveNow(); location.reload(); }
};

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  unlockAudio();
  const fn = actions[el.dataset.act];
  if (fn) fn(el, e);
});
let saveT = null;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f && S.active){
    const s = S.active.entries[+t.dataset.i]?.sets[+t.dataset.j];
    if (s){ s[t.dataset.f] = t.value; clearTimeout(saveT); saveT = setTimeout(() => { saveT = null; save(); }, 400); }
  } else if (t.dataset.draft && ui.sheet?.draft){ ui.sheet.draft[t.dataset.draft] = t.value; }
  else if (t.id === "pick-q"){
    const q = t.value.trim().toLowerCase();
    document.querySelectorAll("#pick-list .grp").forEach(g => {
      let any = false;
      g.querySelectorAll("[data-name]").forEach(b => { const hit = !q || b.dataset.name.includes(q); b.style.display = hit ? "" : "none"; any = any || hit; });
      g.style.display = any ? "" : "none";
    });
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.draft && ui.sheet?.draft) ui.sheet.draft[t.dataset.draft] = t.value;
  if (t.dataset.setting){ S.settings[t.dataset.setting] = +t.value; save(); toast(`Pause: ${fmtSec(+t.value)}`); }
  if (t.id === "imp-file" && t.files[0]){ const r = new FileReader(); r.onload = () => applyImport(String(r.result)); r.readAsText(t.files[0]); t.value = ""; }
});
// Beim Verlassen der App (und bei der Rückkehr) alles Offene sofort sichern – iOS friert die Seite im Hintergrund ein.
function saveNow(){ if (saveT){ clearTimeout(saveT); saveT = null; save(); } flush(); }
document.addEventListener("visibilitychange", () => { saveNow(); tick(); keepAwake(); });
window.addEventListener("pagehide", saveNow);

/* ---------- Start ---------- */
async function boot(){
  const slow = setTimeout(render, 600);   // „Lade …“ nur zeigen, wenn es spürbar dauert
  try {
    const d = await loadDb();
    if (d.state) S = normalize({...d.state, workouts:d.workouts});
    else {
      // Erster Start mit IndexedDB: Daten des Prototyps aus localStorage übernehmen (Migration), sonst Startdaten anlegen.
      // Der alte localStorage-Eintrag bleibt als Sicherheitskopie liegen und wird danach nicht mehr gelesen.
      const old = loadLegacy();
      S = normalize(old);
      pending.state = true; S.workouts.forEach(w => pending.put.add(w.id));
      if (await flush() && old) toast("Bisherige Daten übernommen");
    }
  } catch(e){
    console.error("Start fehlgeschlagen:", e); closeDb();
    // Speicher in diesem Kontext grundsätzlich gesperrt (z. B. Datei-Vorschau ohne eigene Adresse): ohne Speichern weiterarbeiten.
    // Bei allen anderen Fehlern könnten Daten vorhanden sein – dann anhalten, statt mit leerem Stand zu starten.
    if (!window.indexedDB || (e && e.name === "SecurityError")){ S = normalize(loadLegacy()); store.status = "off"; }
    else bootErr = e;
  }
  clearTimeout(slow);
  render();
  // Den Browser bitten, die Daten nicht von sich aus zu löschen (klappt v. a. bei installierter App).
  if (S && store.status !== "off" && navigator.storage && navigator.storage.persist){
    navigator.storage.persist().then(ok => { store.persisted = ok; if (ok && ui.tab === "verlauf" && !ui.sheet) render(); }, () => {});
  }
}
boot();

/* ---------- Service Worker (Offline-Betrieb; läuft nur über HTTPS oder localhost) ---------- */
if ("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data && e.data.type === "update") toast("Neue Version bereit – zum Laden tippen", "reload");
  });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(e => console.warn("Service Worker nicht aktiv:", e)));
}
</script>
